/* ------------------------ distance de projection ------------------------- */
/* La page de référence (prestataires-audiovisuel.fr) n'a pas pu être lue ; ce
   sont les relations d'usage, sans la consommation d'énergie que Rémi ne
   voulait pas.
   Géométrie :
     rapport de projection = distance / largeur de l'image d'un projecteur
     largeur = diagonale × r / √(r² + 1), hauteur = largeur / r (r = format)
   En mosaïque, n projecteurs côte à côte avec un recouvrement o (part de la
   largeur d'un projecteur) : largeur totale = l × (n − (n − 1) × o), et le
   format vient alors des projecteurs.
   Lumière :
     éclairement (lux) = lumens / surface éclairée par un projecteur (m²)
     luminance (cd/m²) = lux × gain / π ; 1 ft-L = 3,426 cd/m²
     contraste = (éclairement projeté + ambiant) / ambiant, le gain de l'écran
     s'appliquant aux deux
   Besoin en lumens : l'éclairement qui tient le contraste visé face à la
   lumière ambiante, sans descendre sous 48 cd/m², plus une marge pour le
   vieillissement de la source et les modes éco.
   Public : dernier rang selon la règle 4-6-8 (en hauteurs d'image) ; premier
   rang là où un pixel sous-tend une minute d'arc, la limite de l'œil. */
const CLE_DIST = "projection.v1";
const DIST = Object.assign({ sens:"d", fmt:"16:9", base:"l", l:"", diag:"", d:"",
                             tr:"", trx:"", lm:"", gain:"1", amb:"50", ctr:"15", marge:"20",
                             n:1, rec:"15", res:"1920x1080", onglet:"geo" }, lireLocal(CLE_DIST, {}));
const FORMATS = [["16:9", 16 / 9], ["16:10", 16 / 10], ["4:3", 4 / 3], ["2,39:1", 2.39]];
const RESOLUTIONS = [["1920x1080", "HD"], ["1920x1200", "WUXGA"], ["3840x2160", "4K UHD"], ["1024x768", "XGA"]];
/* ANSI/INFOCOMM 3M-2011, contraste d'une image projetée. */
const CONTRASTES = [["7", "7:1", "regarder, sans lire de détail"], ["15", "15:1", "lire texte et tableaux"],
                    ["50", "50:1", "analyser une image fine"], ["80", "80:1", "vidéo plein écran"]];
/* Ordres de grandeur de la lumière qui tombe sur l'écran, à corriger au
   luxmètre si l'on en a un. */
const AMBIANCES = [["1", "Noir"], ["50", "Pénombre"], ["150", "Éclairée"], ["400", "Plein jour"]];
const POUCE = 0.0254, LUM_MIN = 48, FTL = 3.426, MINUTE = Math.PI / 180 / 60;

const nbDist = v => parseFloat(String(v ?? "").replace(/\s/g, "").replace(",", "."));
const mDist = (v, n = 2) => vg(Number(v.toFixed(n)));
const entier = v => Math.round(v).toLocaleString("fr-FR");
/* Une fourchette qui ne s'ouvre pas s'écrit comme un seul nombre. */
const fourch = (a, b, n = 2) => b == null || Math.abs(a - b) < 0.005 ? mDist(a, n)
                                                                     : mDist(a, n) + " – " + mDist(b, n);
/* Classes indicatives : les constructeurs ne découpent pas tous pareil. */
const classeOptique = t => t < 0.5 ? "ultra-courte focale" : t < 1 ? "courte focale"
                         : t <= 2.5 ? "focale standard" : "longue focale";

function calculDist(c){
  const n = Math.max(1, Math.min(4, +c.n || 1));
  const rec = n > 1 ? Math.min(Math.max(nbDist(c.rec) || 0, 0), 50) / 100 : 0;
  const k = n - (n - 1) * rec;                              // largeurs de projecteur dans l'image
  const [px, py] = String(c.res).split("x").map(Number);
  /* Seul, le projecteur prend le format de l'écran ; en mosaïque, c'est lui
     qui le donne. */
  const rp = n > 1 ? px / py : (FORMATS.find(f => f[0] === c.fmt) || FORMATS[0])[1];
  const tr = nbDist(c.tr), trx = nbDist(c.trx);
  const tx = trx > 0 && trx !== tr ? trx : null;
  const trA = tr > 0 ? (tx ? Math.min(tr, tx) : tr) : null, trB = tr > 0 && tx ? Math.max(tr, tx) : null;
  /* Une image, pour une largeur par projecteur. */
  const image = wp => {
    const w = wp * k, h = wp / rp;
    return { wp, w, h, diag: Math.hypot(w, h) };
  };
  const r = { n, rec, k, px, py, trA, trB };
  const d = nbDist(c.d);
  if(c.sens === "d"){
    if(!trA) return { manque:"Renseignez le rapport de projection du projecteur." };
    const W = c.base === "l" ? nbDist(c.l)
            : nbDist(c.diag) * POUCE * (rp * k) / Math.sqrt((rp * k) ** 2 + 1);
    if(!(W > 0)) return { manque:"Renseignez la taille de l'image." };
    r.imgs = [image(W / k)];
    r.dist = [trA * W / k, trB ? trB * W / k : null];
  } else if(c.sens === "i"){
    if(!trA) return { manque:"Renseignez le rapport de projection du projecteur." };
    if(!(d > 0)) return { manque:"Renseignez la distance entre l'objectif et l'écran." };
    /* Au rapport le plus court, la plus grande image. */
    r.imgs = trB ? [image(d / trB), image(d / trA)] : [image(d / trA)];
    r.dist = [d, null];
  } else {
    const W = c.base === "l" ? nbDist(c.l)
            : nbDist(c.diag) * POUCE * (rp * k) / Math.sqrt((rp * k) ** 2 + 1);
    if(!(W > 0)) return { manque:"Renseignez la taille de l'image." };
    if(!(d > 0)) return { manque:"Renseignez la distance entre l'objectif et l'écran." };
    r.imgs = [image(W / k)];
    r.dist = [d, null];
    r.besoin = d / (W / k);
  }

  /* La lumière et le public se lisent sur la plus grande image, la plus
     exigeante. */
  const g = r.imgs[r.imgs.length - 1];
  const gain = nbDist(c.gain) > 0 ? nbDist(c.gain) : 1;
  const amb = Math.max(nbDist(c.amb) || 0, 0), ctr = nbDist(c.ctr) || 15;
  const marge = Math.max(nbDist(c.marge) || 0, 0) / 100;
  const surf = g.wp * g.h;                                  // éclairée par un projecteur
  const eCtr = amb * (ctr - 1), eMin = LUM_MIN * Math.PI / gain;
  const eReq = Math.max(eCtr, eMin);
  r.lumiere = { gain, amb, ctr, marge, surf, eReq, parContraste: eCtr >= eMin,
                besoin: eReq * surf * (1 + marge) };
  const lm = nbDist(c.lm);
  if(lm > 0){
    const e = lm / surf;
    Object.assign(r.lumiere, { lm, e, cd: e * gain / Math.PI,
      contraste: amb > 0 ? (e + amb) / amb : null,
      pile: Math.ceil(r.lumiere.besoin / lm) });
  }

  if(px > 0 && py > 0){
    const pxTot = Math.round(n * px - (n - 1) * rec * px);
    const pas = Math.max(g.wp / px, g.h / py);              // l'image tient dans la matrice
    r.public = { pxTot, py, pas, premier: pas / Math.tan(MINUTE),
                 d4: 4 * g.h, d6: 6 * g.h, d8: 8 * g.h };
  }
  return r;
}

function peindreDist(zone){
  const c = DIST, r = calculDist(c);
  const kv = (lab, val) => `<div class="kv"><span>${lab}</span><b>${val}</b></div>`;
  const titre = { d:"Distance de projection", i:"Largeur de l'image", o:"Rapport de projection" }[c.sens];
  if(r.manque){
    const [k, u] = c.onglet === "lum" ? ["Lumens nécessaires", "lm"]
                 : c.onglet === "pub" ? ["Places du public", "m"]
                 : [titre, c.sens === "o" ? ": 1" : "m"];
    zone.innerHTML = `<div class="kick">${k}</div>
      <div class="big"><b>—</b><span>${u}</span></div>
      <p>${c.onglet === "geo" ? r.manque : "Renseignez d'abord l'image et l'optique dans Placement."}</p>`;
    return;
  }
  const [a, b] = r.imgs, ab = (f, n) => fourch(f(a), b ? f(b) : null, n);
  const fmt = r.n > 1 ? r.n + " projecteurs" : esc(c.fmt);
  let big, unite = "m", pied;
  if(c.sens === "d"){
    big = fourch(r.dist[0], r.dist[1]);
    pied = r.dist[1] ? "De l'objectif à l'écran, zoom au plus large puis au plus serré." : "De l'objectif à l'écran.";
  } else if(c.sens === "i"){
    big = ab(i => i.w);
    pied = b ? "Zoom au plus serré puis au plus large, à " + mDist(r.dist[0]) + " m." : "À " + mDist(r.dist[0]) + " m de l'écran.";
  } else {
    big = mDist(r.besoin); unite = ": 1";
    const ok = r.trA && r.besoin >= r.trA - 0.005 && r.besoin <= (r.trB || r.trA) + 0.005;
    pied = "Une optique " + classeOptique(r.besoin) + ". "
         + (!r.trA ? "Renseignez l'optique du projecteur pour savoir si elle convient."
            : ok ? "L'optique du projecteur y arrive."
            : "Hors de l'optique du projecteur (" + fourch(r.trA, r.trB) + " : 1) : "
              + (r.besoin < r.trA ? "rapprocher l'image demande une focale plus courte, ou reculer le projecteur à "
                                    + mDist(r.trA * a.wp) + " m."
                                  : "il faut une focale plus longue, ou avancer le projecteur à "
                                    + mDist((r.trB || r.trA) * a.wp) + " m."));
  }
  const geo = (c.sens === "i" ? "" : kv("Largeur", ab(i => i.w) + " m"))
    + (r.n > 1 ? kv("Largeur par projecteur", ab(i => i.wp) + " m") : "")
    + kv("Hauteur", ab(i => i.h) + " m")
    + kv("Diagonale", ab(i => i.diag) + " m · " + ab(i => i.diag / POUCE, 0) + " po")
    + (r.n > 1 ? kv("Format obtenu", mDist(a.w / a.h) + " : 1") : "")
    + kv("Surface", ab(i => i.w * i.h) + " m²");
  /* Lumière et public rappellent l'image sur laquelle ils sont calculés. */
  const g = r.imgs[r.imgs.length - 1];
  const rappel = kv("Image", mDist(g.w) + " × " + mDist(g.h) + " m" + (r.n > 1 ? " · " + r.n + " projecteurs" : ""));
  if(c.onglet === "geo"){
    zone.innerHTML = `<div class="kick">${titre} · ${fmt}</div>
      <div class="big"><b>${big}</b><span>${unite}</span></div>
      <p>${pied}</p>${geo}`;
    return;
  }

  const L = r.lumiere, par = r.n > 1 ? " par projecteur" : "";
  let lum = `<div class="kick">Lumens nécessaires${par}</div>
    <div class="big"><b>${entier(L.besoin)}</b><span>lm</span></div>
    <p>${L.parContraste ? "Pour tenir " + vg(L.ctr) + ":1 face à " + vg(L.amb) + " lux sur l'écran"
                        : "Pour atteindre " + LUM_MIN + " cd/m², le plancher en salle noire"}${L.marge ? ", marge de " + vg(Math.round(L.marge * 100)) + " % comprise" : ""}.</p>
    ${kv("Éclairement visé", entier(L.eReq) + " lux")}
    ${kv("Luminance visée", entier(L.eReq * L.gain / Math.PI) + " cd/m²")}`;
  if(L.lm){
    const ok = L.lm >= L.besoin;
    lum += kv("Avec " + entier(L.lm) + " lm", entier(L.e) + " lux · " + entier(L.cd) + " cd/m²")
         + kv("En foot-lamberts", mDist(L.cd / FTL, 1) + " ft-L")
         + (L.contraste ? kv("Contraste obtenu", mDist(L.contraste, 1) + ":1") : "")
         + `<p class="${ok ? "muted" : "alert"}" style="margin:10px 0 0">${ok
              ? "Le projecteur suffit" + (L.lm < L.besoin * 1.1 ? ", de peu." : ".")
              : "Pas assez : il manque " + entier(L.besoin - L.lm) + " lm" + par + ". "
                + (L.pile > 1 ? L.pile + " projecteurs empilés y arriveraient." : "")}</p>`;
  }
  if(c.onglet === "lum"){ zone.innerHTML = lum.replace("</p>", "</p>" + rappel); return; }

  const P = r.public;
  zone.innerHTML = `<div class="kick">Places du public</div>
    <div class="big"><b>${mDist(P.premier, 1)} – ${mDist(P.d8, 1)}</b><span>m</span></div>
    <p>Du premier rang, où l'on ne distingue plus les pixels, au dernier, pour regarder l'image.</p>
    ${rappel}${kv("Définition", entier(P.pxTot) + " × " + entier(P.py) + " px")}
    ${kv("Taille d'un pixel", mDist(P.pas * 1000, 1) + " mm")}
    ${kv("Premier rang, pixels invisibles", "≥ " + mDist(P.premier, 1) + " m")}
    ${kv("Dernier rang, image à regarder", "≤ " + mDist(P.d8, 1) + " m")}
    ${kv("Dernier rang, texte à lire", "≤ " + mDist(P.d6, 1) + " m")}
    ${kv("Dernier rang, détail à inspecter", "≤ " + mDist(P.d4, 1) + " m")}`;
}

function vDist(){
  const c = DIST;
  const d = el("div", "dpj");
  d.append(bar("Distance de projection"));
  const garder = () => ecrireLocal(CLE_DIST, c);
  /* Tout sur une page faisait neuf cartes à descendre : trois onglets, la
     réponse de l'onglet en tête, et seulement ses réglages dessous. */
  const menu = el("div", "onglets");
  menu.setAttribute("role", "tablist");
  [["geo", "Placement"], ["lum", "Lumière"], ["pub", "Public"]].forEach(([v, t]) => {
    const b = el("button", null, t);
    b.setAttribute("role", "tab");
    b.setAttribute("aria-selected", String(c.onglet === v));
    b.onclick = () => { toucher(); c.onglet = v; garder(); render(); };
    menu.append(b);
  });
  const res = el("div", "res");
  d.append(menu, res);
  const peindre = () => peindreDist(res);

  /* Les choix fermés refont l'écran : les champs affichés en dépendent. */
  const choix = (lab, cle, vals) => {
    const f = el("div", "f");
    if(lab) f.append(el("label", null, esc(lab)));
    const t = el("div", "tri");
    vals.forEach(([v, txt]) => {
      const b = el("button", null, esc(txt));
      b.setAttribute("aria-pressed", String(String(c[cle]) === String(v)));
      b.onclick = () => { toucher(); c[cle] = v; garder(); render(); };
      t.append(b);
    });
    f.append(t);
    return f;
  };
  /* Les nombres ne refont que les résultats : un rendu complet fermerait le
     clavier. */
  const champ = (lab, cle, ph, aide) => {
    const f = el("div", "f");
    f.innerHTML = `<label for="dpj-${cle}">${esc(lab)}</label>
      <input id="dpj-${cle}" inputmode="decimal" autocomplete="off" value="${esc(c[cle])}" placeholder="${esc(ph)}">
      ${aide ? `<small>${aide}</small>` : ""}`;
    f.querySelector("input").addEventListener("input", e => {
      c[cle] = e.target.value; garder(); peindre();
    });
    return f;
  };
  const note = (txt, bas) => `<p class="muted" style="margin:-4px 0 ${bas ?? 12}px">${txt}</p>`;

  const formules = lignes => {
    const f = el("details", "card formules");
    f.innerHTML = `<summary>Formules</summary><p class="formule">${lignes.join("<br>")}</p>`;
    return f;
  };

  if(c.onglet === "lum"){
    const cl = el("div", "card");
    cl.innerHTML = `<h4>Salle</h4>`;
    cl.append(choix("Lumière ambiante", "amb", AMBIANCES));
    cl.append(champ("Ambiant sur l'écran (lux)", "amb", "50",
      "Des ordres de grandeur : mesurez au luxmètre, capteur tourné vers le public, projecteur éteint."));
    cl.append(choix("Contraste visé", "ctr", CONTRASTES.map(([v, t]) => [v, t])));
    cl.insertAdjacentHTML("beforeend", note(CONTRASTES.map(([, t, s]) => t + " " + s).join(" · ")
      + " (ANSI/INFOCOMM 3M-2011).", 0));
    d.append(cl);
    const ce = el("div", "card");
    ce.innerHTML = `<h4>Écran et projecteur</h4>`;
    const fl = el("div", "ff");
    fl.append(champ("Gain d'écran", "gain", "1"), champ("Marge (%)", "marge", "20"));
    ce.append(fl);
    ce.insertAdjacentHTML("beforeend", note("La marge couvre le vieillissement de la lampe ou du laser et les modes éco."));
    ce.append(champ("Flux du projecteur (lm)", "lm", "10000", "Facultatif : pour vérifier un projecteur donné."));
    d.append(ce);
    d.append(formules(["lux = lumens / surface d'un projecteur", "cd/m² = lux × gain / π",
      "contraste = (lux projeté + ambiant) / ambiant",
      "lumens = max(ambiant × (contraste − 1), 48 π / gain)", "&nbsp;&nbsp;× surface × (1 + marge)"]));
  } else if(c.onglet === "pub"){
    const cp = el("div", "card");
    cp.innerHTML = `<h4>Projecteur</h4>`;
    cp.append(choix("Définition", "res", RESOLUTIONS.map(([v, t]) => [v, t])));
    cp.insertAdjacentHTML("beforeend", note("Dernier rang : règle 4-6-8, en hauteurs d'image. Premier rang : "
      + "là où l'œil ne distingue plus un pixel (une minute d'arc).", 0).replace("margin:-4px", "margin:0"));
    d.append(cp);
    d.append(formules(["pixel = max(largeur / px, hauteur / px)", "premier rang = pixel / tan(1′)",
      "dernier rang = 8, 6 ou 4 × hauteur"]));
  } else {
    const cs = el("div", "card");
    cs.innerHTML = `<h4>Je cherche</h4>`;
    cs.append(choix("", "sens", [["d", "La distance"], ["i", "L'image"], ["o", "L'optique"]]));
    d.append(cs);

    const ci = el("div", "card");
    ci.innerHTML = `<h4>Image</h4>`;
    if(c.n > 1) ci.insertAdjacentHTML("beforeend", note("En mosaïque, le format vient des projecteurs.")
                                                     .replace("margin:-4px", "margin:0"));
    else ci.append(choix("Format", "fmt", FORMATS.map(f => [f[0], f[0]])));
    if(c.sens !== "i"){
      ci.append(choix("Taille connue par", "base", [["l", "Largeur"], ["d", "Diagonale"]]));
      ci.append(c.base === "l" ? champ("Largeur de l'image (m)", "l", "4")
                               : champ("Diagonale (pouces)", "diag", "150"));
    }
    if(c.sens !== "d") ci.append(champ("Distance objectif – écran (m)", "d", "8"));
    d.append(ci);

    const co = el("div", "card");
    co.innerHTML = `<h4>Optique</h4>`;
    const ff = el("div", "ff");
    ff.append(champ("Rapport mini", "tr", "1,5"), champ("Rapport maxi", "trx", "2"));
    co.append(ff);
    co.insertAdjacentHTML("beforeend", note(c.sens === "o"
      ? "Facultatif : l'optique du projecteur, pour savoir si elle couvre le rapport trouvé."
      : "Sur la fiche de l'objectif, écrit 1,5 – 2 : 1. Le maxi est pour un zoom ; on le laisse vide avec une optique fixe."));
    co.append(choix("Projecteurs côte à côte", "n", [[1, "Un seul"], [2, "2"], [3, "3"], [4, "4"]]));
    if(c.n > 1){
      co.append(champ("Recouvrement (%)", "rec", "15",
        "La part de l'image d'un projecteur qui chevauche la voisine pour le fondu (edge blending)."));
      co.append(choix("Définition", "res", RESOLUTIONS.map(([v, t]) => [v, t])));
    }
    d.append(co);
    d.append(formules(["rapport = distance / largeur d'un projecteur",
      "largeur = diagonale × r / √(r² + 1)", "mosaïque : largeur = l × (n − (n − 1) × recouvrement)"]));
  }

  peindre();
  return d;
}

/* ----------------------------- mise à jour ------------------------------ */
/* L'application se compare à la version publiée dans la release du dépôt. Le
   natif vérifie tout seul au lancement et télécharge dans la foulée ; il reste
   un geste, l'écran d'installation d'Android, qu'aucune application hors
   magasin n'a le droit de sauter. Deux endroits affichent le même état — le
   bandeau d'accueil et cet écran — et aucun des deux n'est forcément là. */
const MAJ = { e:null };
/* Le bandeau ne garde que les phases qui demandent un geste : « disponible » et
   « téléchargement » poussaient la grille d'une rangée entière pour ne rien
   faire faire. Elles se disent maintenant sur la ligne Application. */
const PHASES_BANDEAU = ["pret", "autorisation"];

function ko(o){ return o >= 1048576 ? (o / 1048576).toFixed(1).replace(".", ",") + " Mo"
                                    : Math.round(o / 1024) + " ko"; }
function nomVer(e){ return e.nomPublie || ("version " + e.publie); }
/* Une version construite depuis une branche de travail arrive sur le téléphone
   comme les autres : autant que le bandeau le dise. */
function branche(e){ return e.branche && e.branche !== "main" ? " Branche " + esc(e.branche) + "." : ""; }
function jour(iso){ const j = iso.slice(0, 10).split("-"); return j.length === 3 ? j[2] + "/" + j[1] + "/" + j[0] : iso; }

function bandeauMaj(e){
  if(e.phase === "telechargement"){
    const pc = e.taille ? Math.min(100, Math.round(e.recus / e.taille * 100)) : 0;
    return `<div class="maj"><div class="g"><b>Téléchargement de ${esc(nomVer(e))}</b>
      <span>${ko(e.recus)}${e.taille ? " sur " + ko(e.taille) : ""}</span>
      <div class="jauge"><div style="width:${pc}%"></div></div></div></div>`;
  }
  if(e.phase === "pret")
    return `<div class="maj"><div class="g"><b>${esc(nomVer(e))} prête</b>
      <span>Android demandera de confirmer l'installation.${branche(e)}</span></div>
      <button data-maj="installer">Installer</button></div>`;
  if(e.phase === "autorisation")
    return `<div class="maj"><div class="g"><b>Une autorisation à donner</b>
      <span>Autoriser Patch à installer des applications, puis revenir ici.</span></div>
      <button data-maj="installer">Reprendre</button></div>`;
  return `<div class="maj"><div class="g"><b>${esc(nomVer(e))} disponible</b>
    <span>Téléchargement en attente.${branche(e)}</span></div>
    <button data-maj="telecharger">Télécharger</button></div>`;
}

const DITS = {
  repos:"Pas encore vérifié.", verification:"Vérification en cours…",
  ajour:"L'application est à jour.", disponible:"Une version plus récente attend.",
  telechargement:"Téléchargement en cours…", pret:"La version téléchargée attend l'installation.",
  autorisation:"Android attend l'autorisation d'installer des applications.",
  erreur:"La vérification a échoué.", demo:"Hors application : rien à mettre à jour."
};

function ecranMaj(e){
  const lignes = [];
  lignes.push(`<div class="kv"><span>Installée</span><b>${esc(e.nomInstalle || "—")}</b></div>`);
  if(e.publie)
    lignes.push(`<div class="kv"><span>Publiée</span><b>${esc(e.nomPublie || String(e.publie))}</b></div>`);
  if(e.sha) lignes.push(`<div class="kv"><span>Construite depuis</span><b>${esc(e.sha)}${
    e.branche && e.branche !== "main" ? " · " + esc(e.branche) : ""}</b></div>`);
  if(e.date) lignes.push(`<div class="kv"><span>Publiée le</span><b>${esc(jour(e.date))}</b></div>`);
  if(e.phase === "telechargement" || (e.phase === "pret" && e.taille))
    lignes.push(`<div class="kv"><span>Téléchargé</span><b>${ko(e.recus)}${
      e.taille ? " / " + ko(e.taille) : ""}</b></div>`);
  const boutons = [];
  if(e.phase === "pret" || e.phase === "autorisation")
    boutons.push(`<button class="pill" data-maj="installer" style="padding:12px">Installer</button>`);
  else if(e.phase === "disponible" || e.phase === "erreur")
    boutons.push(`<button class="pill" data-maj="telecharger" style="padding:12px">Télécharger</button>`);
  boutons.push(`<button class="pill" data-maj="verifier" style="padding:12px">Vérifier</button>`);
  return `<p style="margin:0 0 12px">${e.phase === "ajour" ? `<span class="chipok">à jour</span>` : ""}
      <span class="muted">${esc(DITS[e.phase] || e.phase)}${
        e.erreur ? " " + esc(e.erreur) + "." : ""}</span></p>
    <div class="card"><h4>Version</h4>${lignes.join("")}</div>
    <div class="${boutons.length > 1 ? "ff" : ""}">${boutons.join("")}</div>
    <p class="muted" style="margin-top:14px">L'application regarde la release du dépôt à chaque
      lancement et rapatrie l'APK toute seule. Le dernier geste revient à Android : une application
      installée hors magasin ne peut pas en installer une autre sans que tu voies son écran et que
      tu confirmes. La première fois, il faudra aussi autoriser Patch à installer des applications.</p>`;
}

function cablerMaj(racine){
  racine.querySelectorAll("[data-maj]").forEach(b => b.onclick = () => {
    const quoi = b.dataset.maj;
    if(quoi === "installer") NET.maj.installer();
    else if(quoi === "telecharger") NET.maj.telecharger();
    else NET.maj.verifier();
    setTimeout(peindreMaj, 250);
  });
}

function peindreMaj(){
  const e = MAJ.e;
  const zone = $("#maj-zone");
  if(zone){
    const montre = e && PHASES_BANDEAU.includes(e.phase);
    zone.innerHTML = montre ? bandeauMaj(e) : "";
    if(montre) cablerMaj(zone);
  }
  const ecran = $("#maj-ecran");
  if(ecran && e){ ecran.innerHTML = ecranMaj(e); cablerMaj(ecran); }
  /* Le suivi repasse toutes les secondes : on ne refait le bouton que si ce
     qu'il dit a changé, sinon il se reconstruit sous le doigt. */
  const ligne = $("#appli-zone");
  if(ligne){
    const neuf = ligneAppli();
    if(ligne.textContent !== neuf.textContent) ligne.replaceChildren(neuf);
  }
}

function carteTheme(){
  const c = el("div", "card");
  c.innerHTML = `<h4>Thème</h4>`;
  const t = el("div", "tri");
  [["auto", "Automatique"], ["clair", "Clair"], ["sombre", "Sombre"]].forEach(([k, lab]) => {
    const b = el("button", null, lab);
    b.setAttribute("aria-pressed", THEME === k ? "true" : "false");
    b.onclick = () => { THEME = k; ecrireLocal(CLE_THEME, k); appliquerTheme(k); toucher(); render(); };
    t.append(b);
  });
  c.append(t);
  c.insertAdjacentHTML("beforeend", `<p class="muted" style="margin:0">« Automatique » suit le
    réglage d'Android. En salle, le sombre tient l'écran discret : le forcer évite qu'il
    repasse en clair au lever du jour.</p>`);
  return c;
}

function vMaj(){
  const d = el("div");
  const ecran = el("div");
  ecran.id = "maj-ecran";
  d.append(bar("Application"), ecran, carteTheme());
  NET.maj.verifier();          // sans effet si une vérification tourne déjà
  setTimeout(peindreMaj);
  return d;
}

/* -------------------------------- moteur -------------------------------- */
const VIEWS = { home, parc:vParc, outils:vOutils, ups:vUps, dist:vDist,
                proj:vProj, mach:vMach, haut:vHaut, mdg:vMdg, dmx:vPatch, tel:vPatch,
                tcd:vPatch, gel:vGel, cab:vCable, ndi:vNdi, net:vNet, art:vArt, maj:vMaj };
let VUE_AV = null;              // l'écran du rendu précédent
function render(){
  if(STOP){ STOP(); STOP = null; }
  /* Un rendu détruit les champs : on note lequel avait le curseur pour le rendre. */
  const avant = document.activeElement;
  const marque = avant && avant.dataset ? avant.dataset.focus : null;
  let pos = null;
  try { pos = avant ? avant.selectionStart : null; } catch(e){ pos = null; }

  /* Un filtre ne fait pas remonter la page : quand on reste sur le même écran,
     on repose le défilement — celui de la page et celui du bandeau de filtres,
     que le rendu vient de recréer au début. */
  const r = S.route;
  const meme = VUE_AV === r.v;
  VUE_AV = r.v;
  const pav = document.querySelector(".pills");
  const sx = pav ? pav.scrollLeft : 0;
  const sy = window.scrollY;

  const node = r.v === "fiche" ? vFiche(r.p)
             : r.v === "edit" ? vEdit(r.k, r.i)
             : r.v === "manuel" ? vManuel(r.i)
             : VIEWS[r.v]();
  $("#app").replaceChildren(node);

  /* Rendre le curseur avant de reposer le défilement, et sans que le champ se
     ramène lui-même à l'écran : c'est ce `focus` qui faisait sauter la page en
     haut dès qu'on touchait un filtre en ayant écrit dans la recherche. */
  if(marque){
    const n = document.querySelector('[data-focus="' + marque + '"]');
    if(n){
      n.focus({ preventScroll:true });
      try { if(pos != null) n.setSelectionRange(pos, pos); } catch(e){ }
    }
  }

  if(meme){
    const pap = $(".pills");
    if(pap && sx) pap.scrollLeft = sx;
    /* Le contenu neuf n'est pas encore mesuré : sans cette lecture, le
       navigateur rabat le défilement à zéro faute de savoir jusqu'où il va. */
    if(sy){ void document.body.offsetHeight; window.scrollTo(0, sy); }
  }
  const q = $("#q");
  if(q){
    q.addEventListener("input", e => { S.q = e.target.value; const pos = e.target.selectionStart; render();
      const n = $("#q"); if(n){ n.focus({ preventScroll:true }); n.setSelectionRange(pos, pos); } });
  }
  const t = ["parc", "proj", "mach", "haut", "mdg", "manuel", "fiche", "edit"].includes(r.v) ? "parc"
          : r.v === "home" ? "home" : "tools";
  document.querySelectorAll(".tb").forEach(b => b.setAttribute("aria-current", b.dataset.t === t ? "true" : "false"));
  peindreMaj();          // le rendu a jeté le bandeau : on le repose s'il a lieu d'être
  peindreReseau();
}
/* Chaque onglet ouvre sa famille, pas son premier élément : « Outils » tombait
   sur l'écran du patch, et restait allumé sur des écrans où il ne ramenait pas. */
document.querySelectorAll(".tb").forEach(b => b.onclick = () => {
  S.q = "";
  toucher();
  go({ v:b.dataset.t === "home" ? "home" : b.dataset.t === "parc" ? "parc" : "outils" });
});
/* Un seul suivi pour toute l'application : le bandeau et l'écran s'y branchent
   quand ils existent. Il ne passe pas par poser(), qui est remis à zéro à
   chaque changement d'écran. */
NET.maj.suivre(e => { MAJ.e = e; peindreMaj(); });
render();
</script>
</body>
