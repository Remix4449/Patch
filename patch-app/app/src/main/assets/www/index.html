<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Patch — inventaire régie</title>
<style>
  /* Polices embarquées : aucune requête réseau, l'app tourne sans internet. */
  @font-face{font-family:'Bricolage Grotesque';font-style:normal;font-weight:600 800;
    font-display:swap;src:url(fonts/bricolage.woff2) format('woff2')}
  @font-face{font-family:'Chivo';font-style:normal;font-weight:400 700;
    font-display:swap;src:url(fonts/chivo.woff2) format('woff2')}
  @font-face{font-family:'Chivo Mono';font-style:normal;font-weight:400 600;
    font-display:swap;src:url(fonts/chivo-mono.woff2) format('woff2')}

  :root{
    --bg:#FFFFFF; --sur:#F3F4F7; --sur2:#E8EAF0; --line:#DDE0E8;
    --ink:#0F1116; --ink2:#5A6070; --ink3:#8990A0;
    --proj:#2F4BFF; --mach:#00998D; --haut:#E0218A; --mdg:#7A3FF2;
    --dmx:#E2761C; --gel:#C2185B; --ndi:#0E7BC4; --net:#128A45; --art:#5B3FD6;
    --tel:#0F7C8C;
    --ok:#128A45; --ko:#D22B2B;
    --disp:"Bricolage Grotesque",system-ui,sans-serif;
    --body:"Chivo",system-ui,sans-serif;
    --mono:"Chivo Mono",ui-monospace,Menlo,monospace;
    color-scheme:light dark;
  }
  @media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]){
      --bg:#0B0C10; --sur:#15171E; --sur2:#1E212B; --line:#2A2E3A;
      --ink:#EDEFF4; --ink2:#A0A7B8; --ink3:#767E90;
      --proj:#7B90FF; --mach:#31C9BA; --haut:#FF6BB5; --mdg:#A987FF;
      --dmx:#FFA34D; --gel:#FF6E9E; --ndi:#4FB2EC; --net:#45C47B; --art:#9384FF;
      --tel:#3FC7DC;
      --ok:#45C47B; --ko:#FF6B63;
    }
  }
  :root[data-theme="dark"]{
    --bg:#0B0C10; --sur:#15171E; --sur2:#1E212B; --line:#2A2E3A;
    --ink:#EDEFF4; --ink2:#A0A7B8; --ink3:#767E90;
    --proj:#7B90FF; --mach:#31C9BA; --haut:#FF6BB5; --mdg:#A987FF;
    --dmx:#FFA34D; --gel:#FF6E9E; --ndi:#4FB2EC; --net:#45C47B; --art:#9384FF;
    --tel:#3FC7DC;
    --ok:#45C47B; --ko:#FF6B63;
  }
  *{box-sizing:border-box}
  [hidden]{display:none!important}
  body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--body);
       -webkit-font-smoothing:antialiased}
  button,input{font:inherit;color:inherit}
  :focus-visible{outline:2px solid var(--proj);outline-offset:2px}

  .shell{max-width:560px;margin:0 auto;padding:0 16px
         calc(86px + env(safe-area-inset-bottom,0px));min-height:100%}

  .head{padding:18px 0 10px;display:flex;align-items:center;gap:11px}
  .head>div{flex:1;min-width:0}
  .head h1{font:800 27px/1 var(--disp);letter-spacing:-.025em;margin:0}
  .head .badge{margin-left:auto;font:700 10px/1 var(--body);letter-spacing:.14em;text-transform:uppercase;
       background:var(--sur2);color:var(--ink2);padding:5px 8px;border-radius:99px;white-space:nowrap}
  .head p{margin:0;color:var(--ink2);font-size:13.5px}

  .sbar{display:flex;align-items:center;gap:9px;background:var(--sur);border:1.5px solid var(--line);
        border-radius:14px;padding:12px 14px;margin:6px 0 18px}
  .sbar input{background:none;border:0;outline:none;width:100%;font-size:16px}
  .sbar input::placeholder{color:var(--ink3)}

  .tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .tile{border:0;border-radius:18px;padding:16px;cursor:pointer;text-align:left;color:#fff;
        min-height:104px;display:flex;flex-direction:column;justify-content:space-between;
        background:var(--c);position:relative;overflow:hidden}
  .tile:active{transform:scale(.985)}
  .tile b{font:800 19px/1.1 var(--disp);letter-spacing:-.02em}
  .tile span{font:500 12.5px/1.25 var(--body);opacity:.9}
  .tile .n{position:absolute;right:12px;top:10px;font:600 13px/1 var(--mono);opacity:.55}
  .tile.wide{grid-column:1/-1;min-height:78px;flex-direction:row;align-items:center;gap:12px}
  .tile.wide b{font-size:17px}
  .tile.sm{min-height:84px;border-radius:16px;padding:13px}
  .tile.sm b{font-size:16px}

  h2.sec{font:700 11px/1 var(--body);letter-spacing:.18em;text-transform:uppercase;color:var(--ink3);
         margin:24px 0 10px}

  .bar{display:flex;align-items:center;gap:10px;padding:14px 0 12px;position:sticky;
       top:env(safe-area-inset-top,0px);background:var(--bg);z-index:4;border-bottom:1px solid var(--line);
       margin-bottom:14px}
  .bk{border:0;background:var(--sur);border-radius:99px;width:34px;height:34px;cursor:pointer;
      display:grid;place-items:center;flex:none;font-size:17px;line-height:1}
  .bar h2{font:800 20px/1.1 var(--disp);letter-spacing:-.02em;margin:0;flex:1;min-width:0}
  .bar .cnt{font:500 12px/1 var(--mono);color:var(--ink3)}

  .rowlist{display:flex;flex-direction:column;gap:8px}
  .row{display:flex;align-items:center;gap:12px;background:var(--sur);border:1px solid transparent;
       border-radius:14px;padding:12px 14px;cursor:pointer;text-align:left;width:100%}
  .row:hover{border-color:var(--line)}
  .row .av{width:38px;height:38px;border-radius:11px;flex:none;display:grid;place-items:center;
           font:700 12px/1 var(--mono);color:#fff;background:var(--c,var(--proj))}
  .row .g{flex:1;min-width:0}
  .row .g b{display:block;font:700 15px/1.2 var(--body)}
  .row .g span{font-size:12.5px;color:var(--ink2)}
  .row .r{text-align:right;font:500 13px/1.3 var(--mono);color:var(--ink2);
          font-variant-numeric:tabular-nums;white-space:nowrap}
  .row .r i{display:block;font-style:normal;font-size:11px;color:var(--ink3)}

  .pills{display:flex;gap:7px;overflow-x:auto;padding-bottom:12px;margin:0 -16px 6px;padding-inline:16px}
  .pill{border:1.5px solid var(--line);background:var(--bg);border-radius:99px;padding:7px 13px;
        font:600 13px/1 var(--body);white-space:nowrap;cursor:pointer;color:var(--ink2)}
  .pill[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}

  .hero{border-radius:20px;padding:20px;color:#fff;background:var(--c);margin-bottom:14px}
  .hero .kick{font:700 10.5px/1 var(--body);letter-spacing:.16em;text-transform:uppercase;opacity:.75}
  .hero h3{font:800 28px/1.05 var(--disp);letter-spacing:-.03em;margin:8px 0 4px}
  .hero p{margin:0;opacity:.85;font-size:14px}
  .hero .stats{display:flex;gap:20px;margin-top:16px;padding-top:14px;border-top:1px solid rgba(255,255,255,.25)}
  .hero .stats div b{display:block;font:600 20px/1 var(--mono)}
  .hero .stats div span{font-size:11px;opacity:.8;letter-spacing:.08em;text-transform:uppercase}

  .card{background:var(--sur);border-radius:16px;padding:16px;margin-bottom:10px}
  .card h4{font:700 11px/1 var(--body);letter-spacing:.16em;text-transform:uppercase;color:var(--ink3);margin:0 0 12px}
  .kv{display:flex;justify-content:space-between;gap:14px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
  .kv:last-child{border-bottom:0}
  .kv span{color:var(--ink2)}
  .kv b{font:500 15px/1 var(--mono);font-variant-numeric:tabular-nums}
  .chipdemo{display:inline-block;font:700 10px/1 var(--body);letter-spacing:.14em;text-transform:uppercase;
       color:var(--dmx);border:1.5px solid var(--dmx);border-radius:99px;padding:4px 8px}
  .chipok{display:inline-block;font:700 10px/1 var(--body);letter-spacing:.14em;text-transform:uppercase;
       color:var(--ok);border:1.5px solid var(--ok);border-radius:99px;padding:4px 8px}
  .muted{color:var(--ink3);font-size:13.5px}

  .f{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
  .f label{font:700 10.5px/1 var(--body);letter-spacing:.14em;text-transform:uppercase;color:var(--ink3)}
  .f input{background:var(--bg);border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;
           font:500 17px/1 var(--mono);outline:none;width:100%}
  .f input:focus{border-color:var(--dmx)}
  .f select{background:var(--bg);border:1.5px solid var(--line);border-radius:12px;
            padding:11px 12px;font:500 15px/1.2 var(--body);outline:none;width:100%}
  .f select:focus{border-color:var(--dmx)}
  .card h4 .sup{float:right;border:0;background:none;color:var(--ko);cursor:pointer;padding:0;
       font:700 10px/1 var(--body);letter-spacing:.12em;text-transform:uppercase}
  .kv input[type="checkbox"]{width:22px;height:22px;accent-color:var(--dmx)}

  .adr{display:grid;grid-template-columns:24px minmax(0,1fr) auto 50px 50px;gap:7px;
       align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
  .adr:last-of-type{border-bottom:0}
  .adr .no{font:500 12px/1 var(--mono);color:var(--ink3);text-align:right}
  .adr .ap{min-width:0}
  .adr .ap b{display:block;font:700 13.5px/1.2 var(--body);overflow:hidden;
             text-overflow:ellipsis;white-space:nowrap}
  .adr .ap span{font-size:11px;color:var(--ink3)}
  .adr .ad{font:500 11.5px/1.15 var(--mono);color:var(--ink3);text-align:right;white-space:nowrap}
  .adr .ad b{font-size:14.5px;color:var(--ink);margin-left:3px}
  .adr .ad i{display:block;font-style:normal;font-size:10.5px}
  .adr .cc{width:100%;min-width:0;background:var(--bg);border:1.5px solid var(--line);
           border-radius:9px;padding:8px 4px;font:500 12.5px/1 var(--mono);text-align:center;outline:none}
  .adr .cc:focus{border-color:var(--dmx)}
  .modes{display:flex;flex-direction:column;gap:7px;margin-bottom:12px}
  .mode{display:flex;align-items:center;gap:10px;background:var(--bg);border:1px solid var(--line);
        border-radius:10px;padding:9px 12px}
  .mode b{flex:1;font:700 13.5px/1.2 var(--body)}
  .mode span{font:500 13px/1 var(--mono);color:var(--dmx)}
  .mode button{border:0;background:none;color:var(--ink3);cursor:pointer;font-size:15px;padding:0 2px}
  .ff{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .big{border-radius:16px;padding:18px;background:var(--sur2);text-align:center;margin-bottom:12px}
  .big b{display:block;font:600 40px/1 var(--mono);color:var(--dmx);font-variant-numeric:tabular-nums}
  .big span{font:700 10.5px/1 var(--body);letter-spacing:.16em;text-transform:uppercase;color:var(--ink2)}

  /* ----------------------------- télécommande -------------------------- */
  .tel-ec{background:var(--bg);border:1.5px solid var(--line);border-radius:14px;
          padding:14px 16px;margin-bottom:12px;display:grid;
          grid-template-columns:1fr auto;align-items:center;gap:4px 12px}
  .tel-ec b{font:600 42px/1 var(--mono);color:var(--tel);font-variant-numeric:tabular-nums;
            letter-spacing:-.02em}
  .tel-ec i{font-style:normal;font:600 26px/1 var(--mono);text-align:right;
            font-variant-numeric:tabular-nums}
  .tel-ec span{grid-column:1/-1;font-size:12.5px;color:var(--ink2)}
  .kp{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}
  .kp button{border:0;border-radius:14px;padding:15px 0;background:var(--sur2);
             font:600 21px/1 var(--mono);cursor:pointer}
  .kp button:active{transform:scale(.97)}
  .kp button.acc{background:var(--tel);color:#fff}
  .kbig{padding:13px 0;font:600 15px/1 var(--body)}
  .kbig.on{background:var(--tel);border-color:var(--tel);color:#fff}
  .gr{display:grid;grid-template-columns:40px 54px minmax(0,1fr) minmax(0,1fr);gap:7px;
      align-items:center;padding:6px 0;border-bottom:1px solid var(--line)}
  .gr:last-of-type{border-bottom:0}
  .gr .gn{border:1.5px solid var(--line);background:var(--bg);border-radius:10px;padding:9px 0;
          font:600 13px/1 var(--mono);cursor:pointer;color:var(--ink2)}
  .gr.on .gn{background:var(--tel);border-color:var(--tel);color:#fff}
  .gr .ga{font:500 11px/1.15 var(--mono);color:var(--ink3);white-space:nowrap}
  .gr .ga b{display:block;font-size:13.5px;color:var(--ink)}
  .gr .cc{width:100%;min-width:0;background:var(--bg);border:1.5px solid var(--line);
          border-radius:9px;padding:8px 6px;font:500 12.5px/1 var(--mono);text-align:center;outline:none}
  .gr .cc:focus{border-color:var(--tel)}
  .gr .cc.note{font:400 12px/1 var(--body)}
  details.card>summary{font:700 11px/1 var(--body);letter-spacing:.16em;text-transform:uppercase;
       color:var(--ink3);cursor:pointer;list-style:none;display:flex;justify-content:space-between}
  details.card>summary::-webkit-details-marker{display:none}
  details.card>summary:after{content:"+";font:600 13px/1 var(--mono)}
  details.card[open]>summary{margin-bottom:12px}
  details.card[open]>summary:after{content:"−"}
  #g-solo{accent-color:var(--tel)}
  .hero .chipdemo{color:#fff;border-color:rgba(255,255,255,.55)}
  .circ{display:flex;flex-wrap:wrap;gap:7px}
  .circ button{border:1.5px solid var(--line);background:var(--bg);border-radius:11px;
               padding:8px 11px;cursor:pointer;text-align:left;font:500 12px/1.3 var(--mono);color:var(--ink2)}
  .circ button b{display:block;font:700 14px/1.2 var(--body);color:var(--ink)}

  .swg{display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:8px}
  .sw{border:0;padding:0;border-radius:14px;overflow:hidden;cursor:pointer;background:var(--sur);text-align:left}
  .sw .c{height:52px}
  .sw .t{padding:6px 8px;font:600 11.5px/1.3 var(--mono)}
  .sw .t span{display:block;font:400 10px/1.2 var(--body);color:var(--ink3);
              white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .sw[aria-pressed="true"]{outline:2.5px solid var(--ink);outline-offset:-2.5px}
  .mix{display:flex;flex-direction:column;gap:10px}
  .ml{display:grid;grid-template-columns:54px 1fr 48px;align-items:center;gap:10px;font-size:13px}
  .ml .t{height:18px;border-radius:99px;background:var(--sur2);overflow:hidden}
  .ml .t>div{height:100%;border-radius:99px}
  .ml b{text-align:right;font:500 13.5px/1 var(--mono);font-variant-numeric:tabular-nums}

  .scale{display:flex;flex-direction:column-reverse;margin:4px 0 0 58px;border-left:2px solid var(--line)}
  .st{position:relative;padding:9px 0 9px 14px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .st:before{content:"";position:absolute;left:0;top:50%;width:10px;height:2px;background:var(--line)}
  .st .m{position:absolute;left:-58px;width:48px;text-align:right;font:500 13px/1 var(--mono);
         color:var(--ink2);font-variant-numeric:tabular-nums}
  .st b{font:700 14.5px/1.2 var(--body)}
  .st em{font-style:normal;font-size:12px;color:var(--ink3)}
  .st.pemp b{color:var(--haut)}

  .u512{display:grid;grid-template-columns:repeat(32,1fr);gap:1.5px;margin-top:10px}
  .c512{aspect-ratio:1;background:var(--sur2);border-radius:1px}

  .steps{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:9px;font-size:14.5px}
  .steps li::marker{font-weight:700;color:var(--mdg)}
  .alert{background:var(--sur2);border-left:3px solid var(--ko);border-radius:0 10px 10px 0;
         padding:12px 14px;font-size:14px}

  nav.tabbar{position:fixed;left:0;right:0;bottom:0;background:color-mix(in srgb,var(--bg) 92%,transparent);
    backdrop-filter:blur(12px);border-top:1px solid var(--line);display:flex;justify-content:center;
    padding:8px 0 calc(8px + env(safe-area-inset-bottom,0px));z-index:10}
  .tabbar .in{display:flex;gap:4px;width:100%;max-width:560px;padding:0 16px}
  .tb{flex:1;border:0;background:none;cursor:pointer;display:flex;flex-direction:column;align-items:center;
      gap:4px;padding:6px 0;color:var(--ink3);font:600 10.5px/1 var(--body);letter-spacing:.04em}
  .tb[aria-current="true"]{color:var(--ink)}
  .tb .ic{width:23px;height:23px;opacity:.55}
  .tb[aria-current="true"] .ic{opacity:1}

  /* ------------------------------ pictogrammes ------------------------- */
  .sprite{position:absolute;width:0;height:0;overflow:hidden}
  .ic{fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;
      flex:none;display:block}
  .mark{width:36px;height:36px;border-radius:12px;flex:none;display:grid;place-items:center;color:#fff;
        background:linear-gradient(140deg,var(--proj),var(--haut))}
  .mark .ic{width:21px;height:21px;stroke-width:1.6}
  .tile .ic{width:27px;height:27px;opacity:.92;stroke-width:1.6}
  .tile.sm .ic{width:23px;height:23px}
  .tile .tx{display:flex;flex-direction:column;gap:3px;min-width:0}
  .tile.wide .tx{flex:1}
  .row .av .ic{width:20px;height:20px;stroke-width:1.8}
  .bk .ic{width:17px;height:17px}
  .sbar .ic{width:18px;height:18px;color:var(--ink3);stroke-width:1.9}
  .st .ic,.kv .ic{width:17px;height:17px;color:var(--ink3)}
</style>
</head>

  <symbol id="i-poursuite" viewBox="0 0 24 24"><rect x="2.5" y="8.5" width="7" height="6" rx="1.4"/><path d="M6 14.5v4.5M3.5 21h5"/><path d="M9.5 9.5l11-4v13l-11-4z"/></symbol>
  <symbol id="i-power" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M13.2 8l-3.4 4.6h3.6L11 16.6"/></symbol>
  <symbol id="i-moteur" viewBox="0 0 24 24"><rect x="6.5" y="2.5" width="11" height="6.5" rx="1.5"/><path d="M12 9v2.5M12 12.5v2.5"/><path d="M9.8 17.8a2.4 2.4 0 1 0 4.4-1.3V15"/></symbol>
  <symbol id="i-structure" viewBox="0 0 24 24"><path d="M2 6.5h20M2 17.5h20"/><path d="M5 17.5L8.5 6.5 12 17.5l3.5-11L19 17.5"/></symbol>

<script>
const $ = (s, r=document) => r.querySelector(s);
const el = (t, c, h) => { const n = document.createElement(t); if(c) n.className = c; if(h!=null) n.innerHTML = h; return n; };
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const vg = n => String(n).replace(".", ",");
const S = { tab:"home", route:{ v:"home" }, q:"", marque:null, gel:LEE.find(g => g.ref === "L128") || LEE[0] };

const ic = (n, cls="ic") => `<svg class="${cls}" aria-hidden="true"><use href="#i-${n}"/></svg>`;
const ICO_FAM = {
  "Lyre découpe":"lyre", "Lyre wash":"lyre", "Lyre beam":"lyre", "Lyre hybride":"lyre",
  "Découpe":"decoupe", "Découpe LED":"decoupe", "Poursuite":"poursuite",
  "PC":"pc", "Fresnel LED":"pc",
  "Wash LED":"wash", "Wash LED IP":"wash", "Cyclo LED":"wash",
  "Barre LED":"barre", "Tube LED":"tube",
  "Machine à brume":"fumee", "Machine à fumée lourde":"fumee", "Accessoire":"power"
};
const ICO_MACH = {
  Structure:"structure", Accroche:"collier", Moteurs:"moteur", "Mono tube":"barre",
  "Tapis de danse":"tapis", Frises:"textile", Pendrillon:"textile", Fond:"textile",
  "Demi fond":"textile", Cyclorama:"textile", Inter:"textile"

const ICO_HAUT = { Passerelle:"passerelle", "Plateforme élévatrice":"nacelle" };

const CATS = [

  { k:"haut", t:"Hauteurs", s:"Passerelles & PEMP", c:"var(--haut)", n:HAUTEURS.length, i:"passerelle" },
  { k:"mdg", t:"MDG", s:"Procédure brume", c:"var(--mdg)", n:null, i:"mdg" }

const TOOLS = [

const go = r => { S.route = r; window.scrollTo(0, 0); render(); };

/* -------------------------------- écrans -------------------------------- */
function home(){
  const d = el("div");
  d.innerHTML = `<div class="head"><span class="mark">${ic("dmx")}</span>
      <div><h1>Patch</h1><p>Tout le matériel du plateau, en deux touches.</p></div>

    <label class="sbar">${ic("search")}
      <input id="q" value="${esc(S.q)}" placeholder="Ghibli, moteur, passerelle, L201…" autocomplete="off"></label>`;
  setTimeout(() => {
    const b = $("#etat-res"), w = NET.wifi();
    if(b) b.textContent = NET.natif ? (w && w.ip ? w.ip : "hors réseau") : "démo";
  });
  if(S.q.trim()) { d.append(resultats()); return d; }
  d.insertAdjacentHTML("beforeend", `<h2 class="sec">Inventaire</h2>`);
  const g = el("div", "tiles");
  CATS.forEach(c => {
    const b = el("button", "tile");
    b.style.setProperty("--c", c.c);
    b.innerHTML = `${c.n ? `<span class="n">${c.n}</span>` : ""}${ic(c.i)}
      <span class="tx"><b>${c.t}</b><span>${c.s}</span></span>`;
    b.onclick = () => go({ v:c.k });
    g.append(b);
  });
  d.append(g);
  d.insertAdjacentHTML("beforeend", `<h2 class="sec">Outils</h2>`);
  const g2 = el("div", "tiles");
  TOOLS.forEach((c, i) => {
    const b = el("button", "tile sm" + (i === TOOLS.length - 1 && TOOLS.length % 2 ? " wide" : ""));
    b.style.setProperty("--c", c.c);
    b.innerHTML = `${ic(c.i)}<span class="tx"><b>${c.t}</b><span>${c.s}</span></span>`;
    b.onclick = () => go({ v:c.k });
    g2.append(b);
  });
  d.append(g2);
  return d;
}

function resultats(){
  const q = S.q.toLowerCase();
  const d = el("div");
  const proj = PROJECTEURS.filter(p => (p.nom + " " + p.marque + " " + p.fam).toLowerCase().includes(q));
  const mach = MACHINERIE.filter(m => (m.nom + " " + m.type).toLowerCase().includes(q));
  const haut = HAUTEURS.filter(h => h.nom.toLowerCase().includes(q));
  const gel = LEE.filter(g => (g.ref + " " + g.nom).toLowerCase().includes(q));
  const bloc = (titre, items, fn) => {
    if(!items.length) return;
    d.insertAdjacentHTML("beforeend", `<h2 class="sec">${titre} · ${items.length}</h2>`);
    const l = el("div", "rowlist");
    items.slice(0, 8).forEach(x => l.append(fn(x)));
    d.append(l);
  };
  bloc("Projecteurs", proj, p => rowProj(p));
  bloc("Machinerie", mach, m => rowSimple(m.nom, m.type, m.nb ? "×" + m.nb : "", m.charge || m.l || "",
    "var(--mach)", ICO_MACH[m.type] || "structure"));
  bloc("Hauteurs", haut, h => rowSimple(h.nom, h.type, vg(h.h.toFixed(2)) + " m", h.charge ? h.charge + " kg" : "",
    "var(--haut)", ICO_HAUT[h.type] || "passerelle"));
  bloc("Gélatines", gel, g => { const r = rowSimple(g.ref, g.nom, "", "", g.hex, "gel");
    r.onclick = () => { S.gel = g; go({ v:"gel" }); }; return r; });
  if(!proj.length && !mach.length && !haut.length && !gel.length)
    d.insertAdjacentHTML("beforeend", `<p class="muted" style="margin-top:20px">Rien pour « ${esc(S.q)} ».</p>`);
  return d;
}

function rowProj(p){
  const b = el("button", "row");
  b.style.setProperty("--c", "var(--proj)");
  b.innerHTML = `<span class="av">${ic(ICO_FAM[p.fam] || "lyre")}</span>
    <span class="g"><b>${esc(p.nom)}</b><span>${esc(p.marque)} · ${esc(p.fam)}</span></span>
    <span class="r">${esc(p.w)}<i>${p.nb ? "×" + p.nb : esc(p.kg)}</i></span>`;
  b.onclick = () => go({ v:"fiche", p });
  return b;
}
function rowSimple(t, s, r, r2, c, icone){
  const b = el("button", "row");
  b.style.setProperty("--c", c);
  b.innerHTML = `<span class="av">${icone ? ic(icone) : esc(String(t).slice(0, 2).toUpperCase())}</span>
    <span class="g"><b>${esc(t)}</b><span>${esc(s)}</span></span>
    <span class="r">${esc(r)}<i>${esc(r2)}</i></span>`;
  return b;
}
function bar(titre, cnt, back){
  const d = el("div", "bar");
  const b = el("button", "bk", ic("back"));
  b.setAttribute("aria-label", "Retour");
  b.onclick = back || (() => go({ v:"home" }));
  d.append(b, el("h2", null, esc(titre)));
  if(cnt) d.append(el("span", "cnt", cnt));
  return d;
}

function vProj(){
  const d = el("div");
  d.append(bar("Projecteurs", PROJECTEURS.length + " réf."));
  const p = el("div", "pills");
  const mk = (lab, on, fn) => { const b = el("button", "pill", lab);
    b.setAttribute("aria-pressed", on ? "true" : "false"); b.onclick = fn; return b; };
  p.append(mk("Tout", !S.marque, () => { S.marque = null; render(); }));
  MARQUES.forEach(m => p.append(mk(m, S.marque === m, () => { S.marque = S.marque === m ? null : m; render(); })));
  d.append(p);
  const l = el("div", "rowlist");
  PROJECTEURS.filter(x => !S.marque || x.marque === S.marque).forEach(x => l.append(rowProj(x)));
  d.append(l);
  return d;
}

function vFiche(p){
  const d = el("div");
  d.append(bar(p.marque, null, () => go({ v:"proj" })));
  const h = el("div", "hero");
  h.style.setProperty("--c", "var(--proj)");
  h.innerHTML = `<div class="kick">${esc(p.fam)}</div><h3>${esc(p.nom)}</h3>
    <p>${esc(p.marque)}</p>
    <div class="stats"><div><b>${esc(p.w)}</b><span>Puissance</span></div>
      <div><b>${esc(p.kg)}</b><span>Poids</span></div>
      <div><b>${p.nb ?? "—"}</b><span>Au parc</span></div></div>`;
  d.append(h);
  d.append(carteModes(p));
  const a = el("div", "card");
  a.innerHTML = `<h4>Accroche</h4>
    <div class="kv"><span>Collier</span><b>Double Doughty</b></div>
    <div class="kv"><span>Charge collier</span><b>750 kg</b></div>
    <div class="kv"><span>Perche basse</span><b>7,75 m</b></div>`;
  d.append(a);
  return d;
}

/* Bibliothèque de modes : saisie à la main ou import d'un fichier GDTF. */
function carteModes(p){
  const k = cleApp(p);
  const modes = BIB[k] || [];
  const c = el("div", "card");
  c.innerHTML = `<h4>Modes DMX</h4>`;
  const l = el("div", "modes");
  if(modes.length){
    modes.forEach((m, i) => {
      const r = el("div", "mode");
      r.innerHTML = `<b>${esc(m.nom)}</b><span>${m.ch} ch</span>
        ${m.demo ? '<span class="chipdemo">démo</span>' : ""}
        <button aria-label="Retirer le mode ${esc(m.nom)}">✕</button>`;
      r.querySelector("button").onclick = () => {
        modes.splice(i, 1); BIB[k] = modes; sauverBib(); render();
      };
      l.append(r);
    });
  } else {
    l.append(el("p", "muted", "Aucun mode enregistré. Saisir le nom et l'empreinte, ou importer le fichier GDTF de l'appareil."));
  }
  c.append(l);

  const form = el("div", "ff");
  form.innerHTML = `<div class="f"><label for="m-nom">Nom du mode</label>
      <input id="m-nom" placeholder="Standard"></div>
    <div class="f"><label for="m-ch">Canaux</label>
      <input id="m-ch" type="text" inputmode="numeric" placeholder="20"></div>`;
  c.append(form);

  const add = el("button", "pill");
  add.style.cssText = "padding:12px;width:100%;margin-bottom:8px";
  add.textContent = "Ajouter ce mode";
  add.onclick = () => {
    const nom = $("#m-nom", c).value.trim(), ch = +$("#m-ch", c).value;
    if(!nom || !ch) return;
    BIB[k] = [...(BIB[k] || []), { nom, ch }];
    sauverBib(); render();
  };
  c.append(add);

  if(NET.natif){
    const imp = el("button", "pill");
    imp.style.cssText = "padding:12px;width:100%";
    imp.textContent = "Importer un fichier GDTF";
    imp.onclick = () => {
      imp.textContent = "Ouverture du fichier…";
      NET.gdtf(r => {
        if(r.erreur){ imp.textContent = "Échec : " + r.erreur; return; }
        if(!r.pret) return;
        if(!r.modes || !r.modes.length){ imp.textContent = "Aucun mode trouvé dans ce fichier"; return; }
        BIB[k] = r.modes.map(m => ({ nom:m.nom, ch:m.ch }));
        sauverBib(); render();
      });
    };
    c.append(imp);
    const note = el("p", "muted", "Le fichier se télécharge sur gdtf-share.com quand tu as du réseau ; une fois importé il reste dans l'application.");
    note.style.margin = "10px 0 0";
    c.append(note);
  }
  return c;
}

function vMdg(){

  const b = el("div", "card");

/* ------------------------------- patch ---------------------------------- */
/* Le patch et la bibliothèque de modes vivent dans le stockage local :
   ils survivent au redémarrage de l'application et ne quittent jamais le
   téléphone. */

const CLE_PATCH = "patch.v1", CLE_BIB = "bibliotheque.v1";

function lireLocal(cle, defaut){
  try { const v = localStorage.getItem(cle); return v ? JSON.parse(v) : defaut; }
  catch(e){ return defaut; }
}
function ecrireLocal(cle, val){
  try { localStorage.setItem(cle, JSON.stringify(val)); } catch(e){ }
}

const cleApp = p => p.marque + " " + p.nom;

let PATCH = lireLocal(CLE_PATCH, { nom:"", lignes:[], fiches:{} });
let BIB = lireLocal(CLE_BIB, {});
PROJECTEURS.forEach(p => {
  if(p.modes && !BIB[cleApp(p)])
    BIB[cleApp(p)] = p.modes.map(m => ({ nom:m.mode, ch:m.ch, demo:!!p.modesDemo }));
});

const sauverPatch = () => ecrireLocal(CLE_PATCH, PATCH);
const sauverBib = () => ecrireLocal(CLE_BIB, BIB);

/* Chaîne les adresses : un appareil ne chevauche jamais deux univers. */
function calculerPatch(){
  const out = [];
  let u = 1, ch = 1, n = 0;
  PATCH.lignes.forEach(l => {
    if(!l.suite){ u = Math.max(1, l.u || 1); ch = Math.min(512, Math.max(1, l.adr || 1)); }
    const foot = Math.min(512, Math.max(1, l.ch || 1));
    for(let i = 0; i < Math.max(0, l.nb || 0); i++){
      if(ch + foot - 1 > 512){ u++; ch = 1; }
      n++;
      out.push({ n, ligne:l.id, i, app:l.app, mode:l.mode, ch:foot, u, adr:ch, fin:ch + foot - 1 });
      ch += foot;
    }
  });
  return out;
}

const cleFiche = (ligne, i) => ligne + ":" + i;
function fiche(ligne, i){
  const k = cleFiche(ligne, i);
  if(!PATCH.fiches[k]) PATCH.fiches[k] = { circuit:"", patch:"" };
  return PATCH.fiches[k];
}

function vDmx(){
  const d = el("div");
  d.append(bar("Patch"));

      ch: modes.length ? modes[0].ch : 1,

  };

  d.append(zoneAdr);

  /* Rafraîchit ce qui dépend des nombres saisis, sans reconstruire les cartes
     de lignes : le champ en cours de saisie garde son curseur. */
  const rafraichir = () => {
    const liste = calculerPatch();
    const univ = [...new Set(liste.map(x => x.u))];
    h.innerHTML = `<div class="kick">${esc(PATCH.nom || "sans titre")}</div>
      <h3>${liste.length} appareil${liste.length > 1 ? "s" : ""}</h3>
      <p>${univ.length ? "univers " + univ.map(u => "U" + u).join(", ") : "aucune ligne"}</p>
      <div class="stats">
        <div><b>${liste.reduce((a, x) => a + x.ch, 0)}</b><span>canaux</span></div>
        <div><b>${univ.length}</b><span>univers</span></div>
        <div><b>${puissanceTotale(liste)}</b><span>puissance</span></div>
      </div>`;
    zoneAdr.replaceChildren(...blocsAdresses(liste, univ));
  };

  $("#p-nom", titre).oninput = e => {
    PATCH.nom = e.target.value; sauverPatch();
    const k = h.querySelector(".kick");
    if(k) k.textContent = PATCH.nom || "sans titre";
  };

  PATCH.lignes.forEach((l, idx) => zoneLignes.append(carteLigne(l, idx, rafraichir)));
  rafraichir();
  return d;
}

function blocsAdresses(liste, univ){
  if(!liste.length) return [];
  const out = [];

  const t = el("div", "card");
  t.innerHTML = `<h4>Adresses</h4>
    <p class="muted" style="margin:-6px 0 12px">Circuit et numéro de patch sont à toi : ils partent dans le PDF.</p>`;
  liste.forEach(x => {
    const f = fiche(x.ligne, x.i);
    const r = el("div", "adr");
    r.innerHTML = `
      <span class="no">${x.n}</span>
      <span class="ap"><b>${esc(courtNom(x.app))}</b><span>${esc(x.mode || x.ch + " ch")}</span></span>
      <span class="ad">U${x.u}<b>${x.adr}</b><i>→ ${x.fin}</i></span>
      <input class="cc" inputmode="numeric" placeholder="circ" value="${esc(f.circuit)}"
             data-focus="c${x.ligne}-${x.i}" aria-label="Circuit appareil ${x.n}">
      <input class="cc" inputmode="numeric" placeholder="patch" value="${esc(f.patch)}"
             data-focus="p${x.ligne}-${x.i}" aria-label="Numéro de patch appareil ${x.n}">`;
    const [ci, pa] = r.querySelectorAll("input");
    ci.oninput = () => { f.circuit = ci.value; sauverPatch(); };
    pa.oninput = () => { f.patch = pa.value; sauverPatch(); };
    t.append(r);
  });
  out.push(t);

  const act = el("div", "ff");
  act.style.margin = "4px 0 12px";
  const pdf = el("button", "pill");
  pdf.style.padding = "13px";
  pdf.textContent = "Exporter en PDF";
  pdf.onclick = () => exporterPdf(calculerPatch());
  const vide = el("button", "pill");
  vide.style.padding = "13px";
  vide.textContent = "Vider le patch";
  vide.onclick = () => {
    if(!confirm("Effacer toutes les lignes et les circuits saisis ?")) return;
    PATCH = { nom:"", lignes:[], fiches:{} }; sauverPatch(); render();
  };
  act.append(pdf, vide);
  out.push(act);

  const c = el("div", "card");
  c.innerHTML = `<h4>Correspondances réseau</h4>` + univ.map(u => {
    const a = artnet(u), sa = sacn(u);
    return `<div class="kv"><span>U${u}</span><b>${a.net}.${a.sub}.${a.uni} · ${sa.ip}</b></div>`;
  }).join("");
  out.push(c);
  return out;
}

function courtNom(nomComplet){
  const p = PROJECTEURS.find(x => cleApp(x) === nomComplet);
  return p ? p.nom : nomComplet;
}

function puissanceTotale(liste){
  let w = 0, sur = false;
  liste.forEach(x => {
    const p = PROJECTEURS.find(y => cleApp(y) === x.app);
    if(!p){ sur = true; return; }
    const m = String(p.w).replace(",", ".").match(/([\d.]+)\s*(k?)/i);
    if(!m){ sur = true; return; }
    w += parseFloat(m[1]) * (m[2] ? 1000 : 1);
  });
  if(!liste.length) return "—";
  return (w >= 1000 ? (w / 1000).toFixed(1).replace(".", ",") + " kW" : Math.round(w) + " W") + (sur ? "*" : "");
}

function carteLigne(l, idx, rafraichir){
  const c = el("div", "card");
  const modes = BIB[l.app] || [];
  c.innerHTML = `<h4>Ligne ${idx + 1}
      <button class="sup" aria-label="Supprimer la ligne">retirer</button></h4>
    <div class="f"><label>Appareil</label>
      <select class="sel-app">${MARQUES.map(m =>
        `<optgroup label="${esc(m)}">${PROJECTEURS.filter(p => p.marque === m).map(p =>
          `<option value="${esc(cleApp(p))}"${cleApp(p) === l.app ? " selected" : ""}>${esc(p.nom)}</option>`
        ).join("")}</optgroup>`).join("")}</select></div>
    <div class="ff">
      <div class="f"><label>Mode</label>
        ${modes.length
          ? `<select class="sel-mode">${modes.map(m =>
              `<option value="${esc(m.nom)}"${m.nom === l.mode ? " selected" : ""}>${esc(m.nom)} — ${m.ch} ch</option>`
             ).join("")}</select>`
          : `<input class="in-ch" data-focus="${l.id}-ch" type="text" inputmode="numeric" value="${l.ch}" aria-label="Empreinte en canaux">`}
      </div>
      <div class="f"><label>Quantité</label>
        <input class="in-nb" data-focus="${l.id}-nb" type="text" inputmode="numeric" value="${l.nb}"></div>
    </div>
    ${modes.length ? "" : `<p class="muted" style="margin:-4px 0 12px">
       Aucun mode enregistré pour cet appareil : saisir l'empreinte, ou l'ajouter depuis sa fiche.</p>`}
    <div class="kv" style="border:0;padding-top:0">
      <span>À la suite de la ligne précédente</span>
      <input class="in-suite" type="checkbox"${l.suite ? " checked" : ""} aria-label="Enchaîner">
    </div>
    <div class="ff dep"${l.suite ? ' hidden' : ""}>
      <div class="f"><label>Univers</label>
        <input class="in-u" data-focus="${l.id}-u" type="text" inputmode="numeric" value="${l.u}"></div>
      <div class="f"><label>Adresse de départ</label>
        <input class="in-adr" data-focus="${l.id}-adr" type="text" inputmode="numeric" value="${l.adr}"></div>
    </div>`;

  const q = sel => c.querySelector(sel);
  q(".sup").onclick = () => {
    PATCH.lignes.splice(idx, 1); sauverPatch(); render();
  };
  q(".sel-app").onchange = e => {
    l.app = e.target.value;
    const m = BIB[l.app] || [];
    l.mode = m.length ? m[0].nom : "";
    l.ch = m.length ? m[0].ch : l.ch;
    sauverPatch(); render();
  };
  if(q(".sel-mode")) q(".sel-mode").onchange = e => {
    l.mode = e.target.value;
    const m = (BIB[l.app] || []).find(x => x.nom === l.mode);
    if(m) l.ch = m.ch;
    sauverPatch(); render();
  };
  if(q(".in-ch")) q(".in-ch").oninput = e => { l.ch = +e.target.value || 1; sauverPatch(); rafraichir(); };
  q(".in-nb").oninput = e => {
    const v = e.target.value.replace(/\D/g, "");
    l.nb = v === "" ? 0 : Math.min(500, +v);
    sauverPatch(); rafraichir();
  };
  q(".in-suite").onchange = e => { l.suite = e.target.checked; sauverPatch(); render(); };
  if(q(".in-u")) q(".in-u").oninput = e => { l.u = +e.target.value || 1; sauverPatch(); rafraichir(); };
  if(q(".in-adr")) q(".in-adr").oninput = e => { l.adr = +e.target.value || 1; sauverPatch(); rafraichir(); };
  return c;
}

  });
  const arretNoeuds = NET.noeuds(e => {
    const ns = e.noeuds || [];
    noeuds.replaceChildren(el("h4", null, "Nœuds Art-Net"));
    if(!ns.length){ noeuds.append(el("p", "muted", "Aucune réponse à l'ArtPoll.")); return; }
    ns.forEach(n => {
      const c = el("div");
      c.innerHTML = `<div class="kv"><span>${esc(n.long || n.court)}</span><b>${esc(n.ip)}</b></div>
        <div class="kv"><span class="muted">${esc(n.mac || "")}</span>
          <b>${(n.ports || []).map(p => "U" + p.univers).join(" · ") || "—"}</b></div>`;
      noeuds.append(c);
    });
  });
  return d;
}

/* Testeur d'adresse : émet une trame Art-Net sur un canal, sans console. */
function testeur(){
  const c = el("div", "card");
  c.innerHTML = `<h4>Testeur d'adresse</h4>
    <p class="muted" style="margin:0 0 12px">Émet une trame Art-Net en diffusion. À utiliser quand la console est éteinte.</p>
    <div class="ff">
      <div class="f"><label for="t-u">Univers</label><input id="t-u" type="number" min="1" value="1"></div>
      <div class="f"><label for="t-c">Canal</label><input id="t-c" type="number" min="1" max="512" value="1"></div>
    </div>
    <div class="f"><label for="t-n">Niveau — <span id="t-v">255</span></label>
      <input id="t-n" type="range" min="0" max="255" value="255"></div>
    <div class="ff">
      <button class="pill" id="t-go" style="padding:12px">Envoyer</button>
      <button class="pill" id="t-off" style="padding:12px">Tout à zéro</button>
    </div>`;
  const trame = (canal, niveau) => {
    const n = new Array(512).fill(0);
    if(canal >= 1 && canal <= 512) n[canal - 1] = niveau;
    return n;
  };
  setTimeout(() => {
    const maj = () => $("#t-v", c).textContent = $("#t-n", c).value;
    $("#t-n", c).addEventListener("input", maj);
    $("#t-go", c).onclick = () => NET.emettre(+$("#t-u", c).value,
      trame(+$("#t-c", c).value, +$("#t-n", c).value));
    $("#t-off", c).onclick = () => NET.emettre(+$("#t-u", c).value, new Array(512).fill(0));
  });
  return c;
}

/* --------------------- télécommande des gradateurs ---------------------- */
/* Le geste du plateau : on appelle un gradateur au clavier, il s'allume, on lit
   sur scène quel circuit s'est allumé, et on l'écrit dans la feuille. L'appli
   tient le flux sACN tant que l'écran est ouvert — un niveau envoyé une seule
   fois retombe au bout de quelques secondes. */

const CLE_GRADA = "gradateurs.v1";
let GRADA = lireLocal(CLE_GRADA, { proto:"sACN", u:1, adr:1, premier:1, nb:96,
                                   prio:100, cible:"", pas:5, solo:true, fiches:{} });
const sauverGrada = () => ecrireLocal(CLE_GRADA, GRADA);

let REG_OUVERT = false;   // le volet des réglages survit aux rendus de la vue
let NIV = {};        // n° de gradateur → niveau en %, le temps de la session
let SEL = 0;         // gradateur tenu par le clavier
let SAISIE = "";     // chiffres en cours de frappe

const ficheGrada = n => GRADA.fiches[n] || (GRADA.fiches[n] = { circuit:"", note:"" });
const circuitDe = n => String((GRADA.fiches[n] || {}).circuit || "").trim();
const noteDe = n => String((GRADA.fiches[n] || {}).note || "");

/* Adresse DMX d'un gradateur : celle du premier, décalée d'un rang par
   gradateur, et l'univers suivant dès qu'on dépasse 512. */
function adrGrada(n){
  const i = (GRADA.adr - 1) + (n - GRADA.premier);
  if(i < 0) return null;
  return { u:GRADA.u + Math.floor(i / 512), canal:(i % 512) + 1 };
}

const allumes = () => Object.keys(NIV).filter(k => NIV[k] > 0).map(Number).sort((a, b) => a - b);

/* Range les gradateurs allumés par univers et pose le tout sur le flux. */
function envoyerGradas(){
  const t = {};
  Object.keys(NIV).forEach(k => {
    const pct = NIV[k] | 0;
    if(pct <= 0) return;
    const a = adrGrada(+k);
    if(!a) return;
    (t[a.u] = t[a.u] || new Array(512).fill(0))[a.canal - 1] = Math.round(pct * 255 / 100);
  });
  /* L'univers du gradateur appelé part même à zéro : il faut bien qu'il retombe. */
  const a = SEL ? adrGrada(SEL) : null;
  if(a && !t[a.u]) t[a.u] = new Array(512).fill(0);
  NET.emission(t, GRADA.proto, GRADA.prio, GRADA.cible);
}

/* Regroupe la feuille par circuit — un circuit porte souvent plusieurs gradateurs. */
function parCircuit(){
  const m = new Map();
  Object.keys(GRADA.fiches).forEach(k => {
    const c = circuitDe(k);
    if(!c) return;
    if(!m.has(c)) m.set(c, []);
    m.get(c).push(+k);
  });
  return [...m.entries()]
    .map(([c, g]) => [c, g.sort((x, y) => x - y)])
    .sort((a, b) => (parseInt(a[0], 10) || 0) - (parseInt(b[0], 10) || 0) || a[0].localeCompare(b[0]));
}

function vTel(){
  const d = el("div");
  d.append(bar("Télécommande", null, () => go({ v:"dmx" })));

  const h = el("div", "hero");
  h.style.setProperty("--c", "var(--tel)");
  d.append(h);

  /* ------------------------------- clavier ----------------------------- */
  const cle = el("div", "card");
  cle.innerHTML = `<h4>Gradateur</h4>
    <div class="tel-ec"><b id="g-n">—</b><i id="g-v">0 %</i><span id="g-c"></span></div>
    <div class="kp" id="g-kp"></div>
    <div class="ff" style="margin-bottom:9px">
      <button class="pill kbig" id="g-moins">− ${GRADA.pas} %</button>
      <button class="pill kbig" id="g-plus">+ ${GRADA.pas} %</button>
    </div>
    <div class="ff" style="margin-bottom:9px">
      <button class="pill kbig" id="g-noir">Noir</button>
      <button class="pill kbig" id="g-full">Full</button>
    </div>
    <div class="ff">
      <button class="pill kbig" id="g-prec">◀ précédent</button>
      <button class="pill kbig" id="g-suiv">suivant ▶</button>
    </div>
    <div class="kv" style="border:0;padding-bottom:0">
      <span>Un seul gradateur à la fois</span>
      <input id="g-solo" type="checkbox"${GRADA.solo ? " checked" : ""} aria-label="Un seul gradateur à la fois">
    </div>`;
  d.append(cle);

  /* ------------------------------- feuille ----------------------------- */
  const feuille = el("div", "card");
  feuille.innerHTML = `<h4>Feuille de patch</h4>
    <p class="muted" style="margin:-6px 0 12px">Un numéro de gradateur, le circuit
      qu'il alimente, et de quoi noter ce qui y est branché. Plusieurs gradateurs
      peuvent porter le même circuit.</p>`;
  const lignes = [];
  for(let n = GRADA.premier; n < GRADA.premier + GRADA.nb; n++){
    const a = adrGrada(n) || { u:"—", canal:"—" };
    const r = el("div", "gr");
    r.innerHTML = `<button class="gn" aria-label="Appeler le gradateur ${n}">${n}</button>
      <span class="ga">U${a.u}<b>${a.canal}</b></span>
      <input class="cc" inputmode="numeric" placeholder="circuit" value="${esc(circuitDe(n))}"
             data-focus="gc${n}" aria-label="Circuit du gradateur ${n}">
      <input class="cc note" placeholder="repère" value="${esc(noteDe(n))}"
             data-focus="gr${n}" aria-label="Repère du gradateur ${n}">`;
    const [ci, no] = r.querySelectorAll("input");
    r.querySelector(".gn").onclick = () => choisir(n);
    ci.oninput = () => { ficheGrada(n).circuit = ci.value; sauverGrada(); majCircuits(); };
    no.oninput = () => { ficheGrada(n).note = no.value; sauverGrada(); };
    lignes.push({ n, r });
    feuille.append(r);
  }
  d.append(feuille);

  /* --------------------------- vue par circuit ------------------------- */
  const circuits = el("div", "card");
  d.append(circuits);

  /* ------------------------------- actions ----------------------------- */
  const act = el("div", "ff");
  act.style.margin = "4px 0 12px";
  const pdf = el("button", "pill");
  pdf.style.padding = "13px";
  pdf.textContent = "Exporter en PDF";
  pdf.onclick = () => exporterGradas();
  const zero = el("button", "pill");
  zero.style.padding = "13px";
  zero.textContent = "Tout à zéro";
  zero.onclick = () => { NIV = {}; SEL = 0; SAISIE = ""; envoyerGradas(); rafraichir(); };
  act.append(pdf, zero);
  d.append(act);

  /* ------------------------------ réglages ----------------------------- */
  const reg = el("details", "card");
  reg.open = REG_OUVERT;
  reg.ontoggle = () => { REG_OUVERT = reg.open; };
  reg.innerHTML = `<summary>Réglages du flux</summary>
    <div class="ff">
      <div class="f"><label>Protocole</label>
        <select class="r-proto">
          <option value="sACN"${GRADA.proto === "sACN" ? " selected" : ""}>sACN</option>
          <option value="Art-Net"${GRADA.proto === "Art-Net" ? " selected" : ""}>Art-Net</option>
        </select></div>
      <div class="f"><label>Univers</label>
        <input class="r-u" data-focus="r-u" type="text" inputmode="numeric" value="${GRADA.u}"></div>
    </div>
    <div class="ff">
      <div class="f"><label>Premier gradateur</label>
        <input class="r-prem" data-focus="r-prem" type="text" inputmode="numeric" value="${GRADA.premier}"></div>
      <div class="f"><label>Son adresse DMX</label>
        <input class="r-adr" data-focus="r-adr" type="text" inputmode="numeric" value="${GRADA.adr}"></div>
    </div>
    <div class="ff">
      <div class="f"><label>Nombre de gradateurs</label>
        <input class="r-nb" data-focus="r-nb" type="text" inputmode="numeric" value="${GRADA.nb}"></div>
      <div class="f"><label>Pas du + / −</label>
        <input class="r-pas" data-focus="r-pas" type="text" inputmode="numeric" value="${GRADA.pas}"></div>
    </div>
    <div class="ff">
      <div class="f"><label>Priorité sACN</label>
        <input class="r-prio" data-focus="r-prio" type="text" inputmode="numeric" value="${GRADA.prio}"></div>
      <div class="f"><label>Destination</label>
        <input class="r-cible" data-focus="r-cible" type="text" inputmode="url"
               value="${esc(GRADA.cible)}" placeholder="multicast"></div>
    </div>
    <p class="muted" style="margin:0">Sans destination, sACN part en multicast et Art-Net
      en diffusion — le cas normal. Une adresse IP force l'envoi vers ce seul nœud.</p>`;
  cle.after(reg);

  const nombre = (v, mini, maxi, defaut) => {
    const x = parseInt(String(v).replace(/\D/g, ""), 10);
    return isNaN(x) ? defaut : Math.max(mini, Math.min(maxi, x));
  };
  const q = sel => reg.querySelector(sel);
  /* L'événement d'ouverture d'un volet arrive en différé : on relève l'état
     juste avant de reconstruire la vue, sinon le volet se referme sous les doigts. */
  const refaire = () => { REG_OUVERT = reg.open; render(); };
  q(".r-proto").onchange = e => { GRADA.proto = e.target.value; sauverGrada(); envoyerGradas(); rafraichir(); };
  q(".r-u").oninput = e => { GRADA.u = nombre(e.target.value, 1, 63999, 1); sauverGrada(); refaire(); };
  q(".r-prem").oninput = e => { GRADA.premier = nombre(e.target.value, 1, 9999, 1); sauverGrada(); refaire(); };
  q(".r-adr").oninput = e => { GRADA.adr = nombre(e.target.value, 1, 512, 1); sauverGrada(); refaire(); };
  q(".r-nb").oninput = e => { GRADA.nb = nombre(e.target.value, 1, 512, 96); sauverGrada(); refaire(); };
  q(".r-pas").oninput = e => { GRADA.pas = nombre(e.target.value, 1, 100, 5); sauverGrada(); refaire(); };
  q(".r-prio").oninput = e => { GRADA.prio = nombre(e.target.value, 1, 200, 100); sauverGrada(); envoyerGradas(); };
  q(".r-cible").oninput = e => { GRADA.cible = e.target.value.trim(); sauverGrada(); envoyerGradas(); };

  /* -------------------------- gestes du clavier ------------------------ */
  function choisir(n){
    if(!n || n < 1) return;
    if(GRADA.solo) Object.keys(NIV).forEach(k => { if(+k !== n) NIV[k] = 0; });
    SEL = n; SAISIE = "";
    if(!NIV[n]) NIV[n] = 100;      // on appelle un gradateur pour le voir s'allumer
    envoyerGradas(); rafraichir();
  }
  function mettre(pct){
    if(!SEL) return;
    NIV[SEL] = Math.max(0, Math.min(100, pct));
    envoyerGradas(); rafraichir();
  }
  function valider(){
    if(SAISIE) choisir(parseInt(SAISIE, 10));
  }

  const kp = $("#g-kp", cle);
  ["1", "2", "3", "4", "5", "6", "7", "8", "9", "C", "0", "✓"].forEach(t => {
    const b = el("button", t === "✓" ? "acc" : null, t);
    b.onclick = () => {
      if(t === "C"){ SAISIE = ""; rafraichir(); return; }
      if(t === "✓"){ valider(); return; }
      if(SAISIE.length < 4) SAISIE += t;
      rafraichir();
    };
    kp.append(b);
  });
  $("#g-moins", cle).onclick = () => { valider(); mettre((NIV[SEL] || 0) - GRADA.pas); };
  $("#g-plus", cle).onclick = () => { valider(); mettre((NIV[SEL] || 0) + GRADA.pas); };
  $("#g-noir", cle).onclick = () => { valider(); mettre(0); };
  $("#g-full", cle).onclick = () => { valider(); mettre(100); };
  $("#g-prec", cle).onclick = () => choisir(Math.max(1, (SEL || GRADA.premier + 1) - 1));
  $("#g-suiv", cle).onclick = () => choisir((SEL || GRADA.premier - 1) + 1);
  $("#g-solo", cle).onchange = e => {
    GRADA.solo = e.target.checked; sauverGrada();
    if(GRADA.solo && SEL) choisir(SEL);
  };

  /* ------------------------------ affichage ---------------------------- */
  function majCircuits(){
    const liste = parCircuit();
    circuits.replaceChildren(el("h4", null, "Par circuit"));
    if(!liste.length){
      circuits.append(el("p", "muted", "Aucun circuit renseigné pour l'instant."));
      return;
    }
    const z = el("div", "circ");
    liste.forEach(([c, g]) => {
      const b = el("button", null,
        `<b>Circuit ${esc(c)}</b>${g.map(x => "grada " + x).join(" · ")}`);
      b.onclick = () => {
        Object.keys(NIV).forEach(k => NIV[k] = 0);
        g.forEach(x => NIV[x] = 100);
        SEL = g[0]; SAISIE = "";
        envoyerGradas(); rafraichir();
      };
      z.append(b);
    });
    circuits.append(z);
    circuits.append(el("p", "muted",
      "Toucher un circuit allume tous ses gradateurs — de quoi vérifier un branchement double."));
  }

  function rafraichir(){
    const on = allumes();
    const etat = NET.emissionEtat();
    h.innerHTML = `<div class="kick">${esc(GRADA.proto)} · univers ${GRADA.u}${
        GRADA.proto === "sACN" ? " · priorité " + GRADA.prio : ""}</div>
      <h3>${on.length} gradateur${on.length > 1 ? "s" : ""} ${on.length > 1 ? "allumés" : "allumé"}</h3>
      <p>${etat.demo ? `<span class="chipdemo">Démo</span> rien ne part du navigateur`
                     : `${GRADA.cible ? "vers " + esc(GRADA.cible) : "en direct sur le réseau"}`}</p>
      <div class="stats">
        <div><b>${SEL || "—"}</b><span>appelé</span></div>
        <div><b>${SEL ? (NIV[SEL] || 0) + " %" : "—"}</b><span>niveau</span></div>
        <div><b>${SEL && adrGrada(SEL) ? "U" + adrGrada(SEL).u + "." + adrGrada(SEL).canal : "—"}</b>
          <span>adresse</span></div>
      </div>`;

    $("#g-n", cle).textContent = SAISIE ? SAISIE : (SEL || "—");
    $("#g-v", cle).textContent = (SEL && !SAISIE ? (NIV[SEL] || 0) : 0) + " %";
    const c = SEL && !SAISIE ? circuitDe(SEL) : "";
    $("#g-c", cle).textContent = SAISIE ? "gradateur en cours de frappe — valider avec ✓"
      : SEL ? (c ? "circuit " + c : "circuit à relever") : "aucun gradateur appelé";
    $("#g-moins", cle).textContent = "− " + GRADA.pas + " %";
    $("#g-plus", cle).textContent = "+ " + GRADA.pas + " %";
    ["g-noir", "g-full"].forEach(id => $("#" + id, cle).classList.remove("on"));
    if(SEL && (NIV[SEL] || 0) === 0) $("#g-noir", cle).classList.add("on");
    if(SEL && (NIV[SEL] || 0) === 100) $("#g-full", cle).classList.add("on");

    lignes.forEach(x => x.r.classList.toggle("on", (NIV[x.n] || 0) > 0));
  }

  majCircuits();
  rafraichir();
  envoyerGradas();
  poser(() => NET.emissionArret());
  return d;
}

/* -------------------------------- moteur -------------------------------- */
const VIEWS = { home, proj:vProj, mach:vMach, haut:vHaut, mdg:vMdg, dmx:vDmx, tel:vTel,
                gel:vGel, ndi:vNdi, net:vNet, art:vArt };
function render(){
  if(STOP){ STOP(); STOP = null; }
  /* Un rendu détruit les champs : on note lequel avait le curseur pour le rendre. */
  const avant = document.activeElement;
  const marque = avant && avant.dataset ? avant.dataset.focus : null;
  let pos = null;
  try { pos = avant ? avant.selectionStart : null; } catch(e){ pos = null; }

  const r = S.route;
  const node = r.v === "fiche" ? vFiche(r.p) : VIEWS[r.v]();
  $("#app").replaceChildren(node);

  if(marque){
    const n = document.querySelector('[data-focus="' + marque + '"]');
    if(n){ n.focus(); try { if(pos != null) n.setSelectionRange(pos, pos); } catch(e){ } }
  }
  const q = $("#q");
  if(q){
    q.addEventListener("input", e => { S.q = e.target.value; const pos = e.target.selectionStart; render();
      const n = $("#q"); if(n){ n.focus(); n.setSelectionRange(pos, pos); } });
  }
  const t = ["proj", "mach", "haut", "mdg", "fiche"].includes(r.v) ? "parc"
          : r.v === "home" ? "home" : "tools";
  document.querySelectorAll(".tb").forEach(b => b.setAttribute("aria-current", b.dataset.t === t ? "true" : "false"));
}
document.querySelectorAll(".tb").forEach(b => b.onclick = () => {
  S.q = "";
  go({ v:b.dataset.t === "home" ? "home" : b.dataset.t === "parc" ? "proj" : "dmx" });
});
render();
