<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Patch — inventaire régie</title>
<style>
  /* Polices embarquées : aucune requête réseau, l'app tourne sans internet. */
  @font-face{font-family:'Bricolage Grotesque';font-style:normal;font-weight:600 800;
    font-display:swap;src:url(fonts/bricolage.woff2) format('woff2')}
  @font-face{font-family:'Chivo';font-style:normal;font-weight:400 700;
    font-display:swap;src:url(fonts/chivo.woff2) format('woff2')}
  @font-face{font-family:'Chivo Mono';font-style:normal;font-weight:400 600;
    font-display:swap;src:url(fonts/chivo-mono.woff2) format('woff2')}

  :root{
    --bg:#FFFFFF; --sur:#F3F4F7; --sur2:#E8EAF0; --line:#DDE0E8;
    --ink:#0F1116; --ink2:#5A6070; --ink3:#8990A0;
    --proj:#2F4BFF; --mach:#00998D; --haut:#E0218A; --mdg:#7A3FF2;
    --dmx:#E2761C; --gel:#C2185B; --ndi:#0E7BC4; --net:#128A45; --art:#5B3FD6;
    --tel:#0F7C8C; --tcd:#6E6100; --maj:#3D4757; --cab:#A34E1D;
    /* Assombris : en petites capitales sur une surface claire, ils passaient
       sous le seuil lisible — ici et partout où ils servent de texte. */
    --ok:#0C6E36; --ko:#B01F1A;
    --disp:"Bricolage Grotesque",system-ui,sans-serif;
    --body:"Chivo",system-ui,sans-serif;
    --mono:"Chivo Mono",ui-monospace,Menlo,monospace;
    color-scheme:light dark;
  }
  @media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]){
      --bg:#0B0C10; --sur:#15171E; --sur2:#1E212B; --line:#2A2E3A;
      --ink:#EDEFF4; --ink2:#A0A7B8; --ink3:#767E90;
      --proj:#7B90FF; --mach:#31C9BA; --haut:#FF6BB5; --mdg:#A987FF;
      --dmx:#FFA34D; --gel:#FF6E9E; --ndi:#4FB2EC; --net:#45C47B; --art:#9384FF;
      --tel:#3FC7DC; --tcd:#D9C55A; --maj:#9AA6BC; --cab:#F2856B;
      --ok:#45C47B; --ko:#FF6B63;
    }
  }
  :root[data-theme="dark"]{
    --bg:#0B0C10; --sur:#15171E; --sur2:#1E212B; --line:#2A2E3A;
    --ink:#EDEFF4; --ink2:#A0A7B8; --ink3:#767E90;
    --proj:#7B90FF; --mach:#31C9BA; --haut:#FF6BB5; --mdg:#A987FF;
    --dmx:#FFA34D; --gel:#FF6E9E; --ndi:#4FB2EC; --net:#45C47B; --art:#9384FF;
    --tel:#3FC7DC; --tcd:#D9C55A; --maj:#9AA6BC; --cab:#F2856B;
    --ok:#45C47B; --ko:#FF6B63;
  }
  *{box-sizing:border-box}
  [hidden]{display:none!important}
  body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--body);
       -webkit-font-smoothing:antialiased}
  button,input{font:inherit;color:inherit}
  :focus-visible{outline:2px solid var(--proj);outline-offset:2px}

  .shell{max-width:560px;margin:0 auto;padding:0 16px
         calc(86px + env(safe-area-inset-bottom,0px));min-height:100%}

  .head{padding:18px 0 10px;display:flex;align-items:center;gap:11px}
  .head>div{flex:1;min-width:0}
  .head h1{font:800 27px/1 var(--disp);letter-spacing:-.025em;margin:0}
  /* L'état du réseau : c'est ce qu'on vient vérifier d'un coup d'œil avant
     d'envoyer du sACN, donc il porte sa couleur, et il s'ouvre sur l'outil
     Réseau. Hauteur 44 px : c'est une cible, pas une étiquette. */
  .head .badge{margin-left:auto;font:700 10px/1 var(--body);letter-spacing:.14em;text-transform:uppercase;
       background:var(--sur2);color:var(--ink2);border:1.5px solid transparent;padding:0 13px;
       min-height:44px;display:inline-flex;align-items:center;border-radius:99px;white-space:nowrap;
       cursor:pointer;flex:none}
  .head .badge.ok{color:var(--ok);border-color:var(--ok)}
  .head .badge.ko{color:var(--ko);border-color:var(--ko)}
  .head .badge:active{transform:scale(.97)}
  .head p{margin:0;color:var(--ink2);font-size:13.5px}
  .head p b{font-weight:700;color:var(--ink)}

  .sbar{display:flex;align-items:center;gap:9px;background:var(--sur);border:1.5px solid var(--line);
        border-radius:14px;padding:12px 14px;margin:6px 0 18px}
  .sbar input{background:none;border:0;outline:none;width:100%;font-size:16px}
  .sbar input::placeholder{color:var(--ink3)}

  .tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}

  /* En thème sombre, le blanc sur ces couleurs éclaircies tombait à 2:1 — et
     douze pavés saturés dans une salle éteinte, c'est l'écran qui éclaire la
     régie. La tuile devient donc une surface sombre, la couleur passe sur le
     pictogramme et un filet, et le texte reprend l'encre du thème.
     Ces jetons vivent sur la tuile et non sur `:root` : ils lisent `--c`, la
     couleur de famille, qui n'est posée que sur l'élément — déclarés plus haut
     ils se résoudraient contre un `--c` inexistant, et la tuile n'aurait plus
     de fond du tout. */
  .tile{--t-fond:var(--c); --t-ink:#fff; --t-ink2:rgba(255,255,255,.9);
        --t-n:rgba(255,255,255,.55); --t-filet:transparent; --t-ico:currentColor}
  @media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]) .tile{--t-fond:var(--sur); --t-ink:var(--ink);
      --t-ink2:var(--ink2); --t-n:var(--ink3); --t-filet:var(--c); --t-ico:var(--c)}
  }
  :root[data-theme="dark"] .tile{--t-fond:var(--sur); --t-ink:var(--ink);
    --t-ink2:var(--ink2); --t-n:var(--ink3); --t-filet:var(--c); --t-ico:var(--c)}

  .tile{border:0;border-radius:18px;padding:16px;cursor:pointer;text-align:left;
        color:var(--t-ink);box-shadow:inset 3px 0 0 var(--t-filet);
        min-height:104px;display:flex;flex-direction:column;justify-content:space-between;
        background:var(--t-fond);position:relative;overflow:hidden}
  .tile:active{transform:scale(.985)}
  .tile b{font:800 19px/1.1 var(--disp);letter-spacing:-.02em;color:var(--t-ink)}
  .tile span{font:500 12.5px/1.25 var(--body);color:var(--t-ink2)}
  .tile .n{position:absolute;right:12px;top:10px;font:600 13px/1 var(--mono);color:var(--t-n)}
  .tile .n.mot{font:700 9.5px/1 var(--body);letter-spacing:.13em;text-transform:uppercase}
  .tile.wide{grid-column:1/-1;min-height:78px;flex-direction:row;align-items:center;gap:12px}
  .tile.wide b{font-size:17px}
  .tile.sm{min-height:84px;border-radius:16px;padding:13px}
  .tile.sm b{font-size:16px}
  .tile.sm.wide{min-height:78px}

  /* La mise à jour n'est pas un outil de plateau : une ligne sous la grille,
     avec une pastille quand une version attend, plutôt qu'une tuile pleine. */
  .appli{display:flex;align-items:center;gap:11px;background:var(--sur);border:0;width:100%;
         border-radius:14px;padding:13px 15px;margin-top:10px;cursor:pointer;text-align:left;
         min-height:52px;color:inherit}
  .appli .ic{width:20px;height:20px;color:var(--maj);flex:none}
  .appli .g{flex:1;min-width:0}
  .appli b{display:block;font:700 14px/1.25 var(--body)}
  .appli span{font-size:12.5px;color:var(--ink2)}
  .appli .pt{width:9px;height:9px;border-radius:99px;background:var(--dmx);flex:none}

  /* Une recherche qui n'affiche que les huit premiers doit dire où sont les
     autres, et y emmener avec le même mot. */
  .voir{border:1.5px dashed var(--line);background:none;border-radius:14px;padding:12px 14px;
        width:100%;cursor:pointer;text-align:left;color:var(--ink2);font:600 13.5px/1 var(--body);
        min-height:48px}
  .voir:active{border-color:var(--ink3)}

  /* Choix du thème : l'application suivait le réglage d'Android, impossible à
     forcer en sombre le temps d'un service. */
  .tri{display:flex;gap:7px;margin-bottom:12px}
  .tri button{flex:1;border:1.5px solid var(--line);background:var(--bg);border-radius:12px;
              padding:13px 8px;font:600 13.5px/1 var(--body);cursor:pointer;color:var(--ink2);
              min-height:48px}
  .tri button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}

  h2.sec{font:700 11px/1 var(--body);letter-spacing:.18em;text-transform:uppercase;color:var(--ink2);
         margin:24px 0 10px}

  .bar{display:flex;align-items:center;gap:10px;padding:14px 0 12px;position:sticky;
       top:env(safe-area-inset-top,0px);background:var(--bg);z-index:4;border-bottom:1px solid var(--line);
       margin-bottom:14px}
  /* 44 px : c'est le retour de secours quand le geste d'Android ne suffit pas,
     et il était sous le minimum touchable. */
  .bk{border:0;background:var(--sur);border-radius:99px;width:44px;height:44px;cursor:pointer;
      display:grid;place-items:center;flex:none;font-size:17px;line-height:1}
  .bar h2{font:800 20px/1.1 var(--disp);letter-spacing:-.02em;margin:0;flex:1;min-width:0}
  .bar .cnt{font:500 12px/1 var(--mono);color:var(--ink3)}

  .rowlist{display:flex;flex-direction:column;gap:8px}
  .row{display:flex;align-items:center;gap:12px;background:var(--sur);border:1px solid transparent;
       border-radius:14px;padding:12px 14px;cursor:pointer;text-align:left;width:100%}
  .row:hover{border-color:var(--line)}
  .row .av{width:38px;height:38px;border-radius:11px;flex:none;display:grid;place-items:center;
           font:700 12px/1 var(--mono);color:#fff;background:var(--c,var(--proj))}
  .row .g{flex:1;min-width:0}
  .row .g b{display:block;font:700 15px/1.2 var(--body)}
  .row .g span{font-size:12.5px;color:var(--ink2)}
  .row .r{text-align:right;font:500 13px/1.3 var(--mono);color:var(--ink2);
          font-variant-numeric:tabular-nums;white-space:nowrap}
  .row .r i{display:block;font-style:normal;font-size:11px;color:var(--ink3)}

  .pills{display:flex;gap:7px;overflow-x:auto;padding-bottom:12px;margin:0 -16px 6px;padding-inline:16px}
  .pill{border:1.5px solid var(--line);background:var(--bg);border-radius:99px;padding:7px 13px;
        font:600 13px/1 var(--body);white-space:nowrap;cursor:pointer;color:var(--ink2)}
  .pill[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}

  .hero{border-radius:20px;padding:20px;color:#fff;background:var(--c);margin-bottom:14px}
  .hero .kick{font:700 10.5px/1 var(--body);letter-spacing:.16em;text-transform:uppercase;opacity:.75}
  .hero h3{font:800 28px/1.05 var(--disp);letter-spacing:-.03em;margin:8px 0 4px}
  .hero p{margin:0;opacity:.85;font-size:14px}
  .hero .stats{display:flex;gap:20px;margin-top:16px;padding-top:14px;border-top:1px solid rgba(255,255,255,.25)}
  .hero .stats div b{display:block;font:600 20px/1 var(--mono)}
  .hero .stats div span{font-size:11px;opacity:.8;letter-spacing:.08em;text-transform:uppercase}

  .card{background:var(--sur);border-radius:16px;padding:16px;margin-bottom:10px}
  .card h4{font:700 11px/1 var(--body);letter-spacing:.16em;text-transform:uppercase;color:var(--ink3);margin:0 0 12px}
  .kv{display:flex;justify-content:space-between;gap:14px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
  .kv:last-child{border-bottom:0}
  .kv span{color:var(--ink2)}
  .kv b{font:500 15px/1 var(--mono);font-variant-numeric:tabular-nums}
  .chipdemo{display:inline-block;font:700 10px/1 var(--body);letter-spacing:.14em;text-transform:uppercase;
       color:var(--dmx);border:1.5px solid var(--dmx);border-radius:99px;padding:4px 8px}
  .chipok{display:inline-block;font:700 10px/1 var(--body);letter-spacing:.14em;text-transform:uppercase;
       color:var(--ok);border:1.5px solid var(--ok);border-radius:99px;padding:4px 8px}
  .muted{color:var(--ink3);font-size:13.5px}

  .f{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
  .f label{font:700 10.5px/1 var(--body);letter-spacing:.14em;text-transform:uppercase;color:var(--ink3)}
  .f input,.f select{background:var(--bg);border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;
           font:500 17px/1 var(--mono);outline:none;width:100%}
  .f input:focus{border-color:var(--dmx)}
  .f select{background:var(--bg);border:1.5px solid var(--line);border-radius:12px;
            padding:11px 12px;font:500 15px/1.2 var(--body);outline:none;width:100%}
  .f select:focus{border-color:var(--dmx)}
  .card h4 .sup{float:right;border:0;background:none;color:var(--ko);cursor:pointer;padding:0;
       font:700 10px/1 var(--body);letter-spacing:.12em;text-transform:uppercase}
  .kv input[type="checkbox"]{width:22px;height:22px;accent-color:var(--dmx)}

  .modes{display:flex;flex-direction:column;gap:7px;margin-bottom:12px}
  .mode{display:flex;align-items:center;gap:10px;background:var(--bg);border:1px solid var(--line);
        border-radius:10px;padding:9px 12px}
  .mode b{flex:1;font:700 13.5px/1.2 var(--body)}
  .mode span{font:500 13px/1 var(--mono);color:var(--dmx)}
  .mode button{border:0;background:none;color:var(--ink3);cursor:pointer;font-size:15px;padding:0 2px}
  .ff{display:grid;grid-template-columns:1fr 1fr;gap:10px}

  .hero .chipdemo{color:#fff;border-color:rgba(255,255,255,.55)}

  .swg{display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:8px}
  .sw{border:0;padding:0;border-radius:14px;overflow:hidden;cursor:pointer;background:var(--sur);text-align:left}
  .sw .c{height:52px}
  .sw .t{padding:6px 8px;font:600 11.5px/1.3 var(--mono)}
  .sw .t span{display:block;font:400 10px/1.2 var(--body);color:var(--ink3);
              white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .sw[aria-pressed="true"]{outline:2.5px solid var(--ink);outline-offset:-2.5px}
  .mix{display:flex;flex-direction:column;gap:10px}
  .ml{display:grid;grid-template-columns:54px 1fr 48px;align-items:center;gap:10px;font-size:13px}
  .ml .t{height:18px;border-radius:99px;background:var(--sur2);overflow:hidden}
  .ml .t>div{height:100%;border-radius:99px}
  .ml b{text-align:right;font:500 13.5px/1 var(--mono);font-variant-numeric:tabular-nums}

  .scale{display:flex;flex-direction:column-reverse;margin:4px 0 0 58px;border-left:2px solid var(--line)}
  .st{position:relative;padding:9px 0 9px 14px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .st:before{content:"";position:absolute;left:0;top:50%;width:10px;height:2px;background:var(--line)}
  .st .m{position:absolute;left:-58px;width:48px;text-align:right;font:500 13px/1 var(--mono);
         color:var(--ink2);font-variant-numeric:tabular-nums}
  .st b{font:700 14.5px/1.2 var(--body)}
  .st em{font-style:normal;font-size:12px;color:var(--ink3)}
  .st.pemp b{color:var(--haut)}

  .u512{display:grid;grid-template-columns:repeat(32,1fr);gap:1.5px;margin-top:10px}
  .c512{aspect-ratio:1;background:var(--sur2);border-radius:1px}

  /* ------------------------------ onduleur ----------------------------- */
  /* La couleur vit avec l'écran plutôt qu'avec la palette du haut : elle ne
     sert qu'ici et sur la tuile. */
  :root{--ups:#935D00}
  @media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){--ups:#F2B84B} }
  :root[data-theme="dark"]{--ups:#F2B84B}
  /* La réponse en tête, comme la section de câble : rouvert en régie, l'écran
     redonne le calibre sans qu'on descende sous les réglages. */
  .ups .res{background:var(--sur);border-radius:18px;padding:16px;margin-bottom:10px;
       box-shadow:inset 3px 0 0 var(--ups)}
  .ups .res .kick{font:700 10.5px/1 var(--body);letter-spacing:.16em;text-transform:uppercase;
       color:var(--ink3)}
  .ups .res .big{display:flex;align-items:baseline;gap:8px;margin:10px 0 4px}
  .ups .res .big b{font:600 44px/1 var(--mono);color:var(--ups);font-variant-numeric:tabular-nums}
  .ups .res .big span{font:600 16px/1 var(--mono);color:var(--ink2)}
  .ups .res>p{margin:0 0 6px;font-size:13.5px;color:var(--ink2)}
  .ups .f small{font-size:12px;line-height:1.4;color:var(--ink3)}
  .ups .f input:focus{border-color:var(--ups)}
  .ups .formule{font:500 12px/1.6 var(--mono);color:var(--ink3);margin:0}

  /* ------------------------- distance de projection --------------------- */
  :root{--dpj:#5F7A00}
  @media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){--dpj:#B5D045} }
  :root[data-theme="dark"]{--dpj:#B5D045}
  .dpj .res{background:var(--sur);border-radius:18px;padding:16px;margin-bottom:10px;
       box-shadow:inset 3px 0 0 var(--dpj)}
  .dpj .res .kick{font:700 10.5px/1 var(--body);letter-spacing:.16em;text-transform:uppercase;
       color:var(--ink3)}
  .dpj .res .big{display:flex;align-items:baseline;flex-wrap:wrap;gap:8px;margin:10px 0 4px}
  .dpj .res .big b{font:600 44px/1 var(--mono);color:var(--dpj);font-variant-numeric:tabular-nums}
  .dpj .res .big span{font:600 16px/1 var(--mono);color:var(--ink2)}
  .dpj .res>p{margin:0 0 6px;font-size:13.5px;color:var(--ink2)}
  .dpj .f small{font-size:12px;line-height:1.4;color:var(--ink3)}
  .dpj .f input:focus{border-color:var(--dpj)}
  .dpj .tri{margin:0}
  .dpj .tri button{padding-left:4px;padding-right:4px}
  .dpj .onglets{display:flex;gap:4px;background:var(--sur);border-radius:14px;padding:4px;margin:0 0 10px}
  .dpj .onglets button{flex:1;border:0;background:none;border-radius:10px;padding:11px 4px;cursor:pointer;
       font:700 13.5px/1 var(--body);color:var(--ink2)}
  .dpj .onglets button[aria-selected="true"]{background:var(--dpj);color:var(--bg)}
  .dpj .formules summary{font:700 11px/1 var(--body);letter-spacing:.16em;text-transform:uppercase;
       color:var(--ink3);cursor:pointer}
  .dpj .formules[open] summary{margin-bottom:12px}
  .dpj .formule{font:500 12px/1.6 var(--mono);color:var(--ink3);margin:0}

  /* ------------------------------ mise à jour -------------------------- */
  .maj{display:flex;align-items:center;gap:12px;background:var(--sur);
       border:1.5px solid var(--maj);border-radius:14px;padding:12px 14px;margin:0 0 18px}
  .maj .g{flex:1;min-width:0}
  .maj b{display:block;font:700 14.5px/1.25 var(--body)}
  .maj span{font-size:12.5px;color:var(--ink2)}
  .maj button{border:0;background:var(--maj);color:var(--bg);border-radius:99px;
              padding:10px 15px;font:700 13px/1 var(--body);cursor:pointer;flex:none}
  .maj button:active{transform:scale(.97)}
  .jauge{height:5px;border-radius:99px;background:var(--sur2);overflow:hidden;margin-top:8px}
  .jauge>div{height:100%;background:var(--maj);border-radius:99px;transition:width .2s}

  .steps{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:9px;font-size:14.5px}
  .steps li::marker{font-weight:700;color:var(--mdg)}
  .alert{background:var(--sur2);border-left:3px solid var(--ko);border-radius:0 10px 10px 0;
         padding:12px 14px;font-size:14px}
  .card.man>*{margin:0}
  .card.man>*+*{margin-top:12px}
  .card.man p{font-size:14.5px}
  .puces{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px;font-size:14.5px}
  .puces li::marker{color:var(--mdg)}
  .man-note{background:var(--sur2);border-left:3px solid var(--mdg);border-radius:0 10px 10px 0;
         padding:12px 14px;font-size:14px}
  .man-tab{overflow-x:auto;margin-inline:-4px}
  .man-tab table{border-collapse:collapse;width:100%;font-size:13.5px}
  .man-tab th{text-align:left;font:700 10.5px/1.2 var(--body);letter-spacing:.12em;text-transform:uppercase;
         color:var(--ink3);padding:0 8px 8px 4px}
  .man-tab td{padding:8px 8px 8px 4px;border-top:1px solid var(--line);vertical-align:top}
  .man-tab td:first-child{font:500 13.5px/1.3 var(--mono);white-space:nowrap}
  .man-pied{margin:14px 2px 0}

  nav.tabbar{position:fixed;left:0;right:0;bottom:0;background:color-mix(in srgb,var(--bg) 92%,transparent);
    backdrop-filter:blur(12px);border-top:1px solid var(--line);display:flex;justify-content:center;
    padding:8px 0 calc(8px + env(safe-area-inset-bottom,0px));z-index:10}
  .tabbar .in{display:flex;gap:4px;width:100%;max-width:560px;padding:0 16px}
  .tb{flex:1;border:0;background:none;cursor:pointer;display:flex;flex-direction:column;align-items:center;
      gap:4px;padding:6px 0;color:var(--ink2);font:600 10.5px/1 var(--body);letter-spacing:.04em}
  .tb[aria-current="true"]{color:var(--ink)}
  .tb .ic{width:23px;height:23px;opacity:.55}
  .tb[aria-current="true"] .ic{opacity:1}

  /* ------------------------------ pictogrammes ------------------------- */
  .sprite{position:absolute;width:0;height:0;overflow:hidden}
  .ic{fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;
      flex:none;display:block}
  .mark{width:36px;height:36px;border-radius:12px;flex:none;display:grid;place-items:center;color:#fff;
        background:linear-gradient(140deg,var(--proj),var(--haut))}
  .mark .ic{width:21px;height:21px;stroke-width:1.6}
  .tile .ic{width:27px;height:27px;opacity:.92;stroke-width:1.6;color:var(--t-ico)}
  .tile.sm .ic{width:23px;height:23px}
  .tile .tx{display:flex;flex-direction:column;gap:3px;min-width:0}
  .tile.wide .tx{flex:1}
  .row .av .ic{width:20px;height:20px;stroke-width:1.8}
  .bk .ic{width:17px;height:17px}
  .sbar .ic{width:18px;height:18px;color:var(--ink3);stroke-width:1.9}
  .st .ic,.kv .ic{width:17px;height:17px;color:var(--ink3)}
  /* ------------------------- patch & plateau --------------------------- */
  /* L'écran unique : une liste au centre, la télécommande en barre au-dessus,
     deux volets qui la recouvrent à moitié. Tout est préfixé — `.pecr` pour
     l'écran, `.p-volet` pour les volets, qui vivent hors de lui. */

  .pecr .p-haut{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;
       background:var(--bg);padding:8px 0 2px;margin:0 -2px}
  .pecr .p-entete{display:flex;align-items:center;gap:10px;padding:2px 0 8px}
  .pecr .p-entete .bk{width:44px;height:44px;font-size:16px}
  .pecr .p-entete .bk .ic{width:18px;height:18px}
  .pecr .p-titre{display:flex;align-items:center;gap:8px;flex:1;min-width:0;border:0;
       background:none;padding:4px 2px;text-align:left;color:inherit;cursor:pointer}
  .pecr .p-titre b{font:800 17px/1.15 var(--disp);letter-spacing:-.02em;overflow:hidden;
       text-overflow:ellipsis;white-space:nowrap}
  .pecr .p-titre .ch{font:600 11px/1 var(--mono);color:var(--ink3)}
  .pecr .p-titre .n{margin-left:auto;font:500 10.5px/1 var(--mono);color:var(--ink3);white-space:nowrap}

  /* Bandeau d'onglets sur une seule ligne : le compte passe en pastille. */
  .pecr .ongl{display:flex;background:var(--sur2);border-radius:10px;padding:2px;gap:2px;
       margin-bottom:8px}
  .pecr .ongl button{flex:1;border:0;background:none;border-radius:8px;padding:6px 4px;
       font:700 12px/1.2 var(--body);color:var(--ink2);cursor:pointer;
       display:flex;align-items:center;justify-content:center;gap:5px;min-width:0}
  .pecr .ongl button[aria-pressed="true"]{background:var(--bg);color:var(--ink);
       box-shadow:0 1px 2px rgba(0,0,0,.12)}
  .pecr .ongl button em{font-style:normal;font:600 10px/1 var(--mono);color:var(--ink3);
       background:var(--bg);border-radius:99px;padding:3px 5px}
  .pecr .ongl button[aria-pressed="true"] em{background:var(--sur2);color:var(--dmx)}

  /* La télécommande en barre, resserrée, et repliable sur une seule ligne. */
  .tl{display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding:7px 10px;
      background:var(--sur);border:1.5px solid var(--line);border-radius:13px;margin-bottom:8px}
  .tl .led{flex:none;width:9px;height:9px;border-radius:99px;background:var(--line)}
  .tl .led.on{background:var(--ok);box-shadow:0 0 0 3px color-mix(in srgb,var(--ok) 25%,transparent)}
  .tl .ap{display:flex;align-items:baseline;gap:6px;min-width:92px}
  .tl .ap b{font:600 20px/1 var(--mono);color:var(--tel);font-variant-numeric:tabular-nums}
  .tl .ap span{font:500 10.5px/1.2 var(--mono);color:var(--ink3)}
  .tl .niv{font:600 15px/1 var(--mono);min-width:44px;text-align:right;font-variant-numeric:tabular-nums}
  .tl button{border:1.5px solid var(--line);background:var(--bg);border-radius:9px;padding:6px 8px;
      font:600 11.5px/1 var(--body);color:var(--ink2);min-width:34px;cursor:pointer}
  .tl button.on{background:var(--tel);border-color:var(--tel);color:#fff}
  .tl .chev{min-width:30px;padding:6px 7px;border-style:dashed}
  .tl .hl{border-color:var(--dmx);color:var(--dmx);font:600 11px/1 var(--mono);white-space:nowrap}
  .tl input[type="range"]{-webkit-appearance:none;appearance:none;flex:1;min-width:84px;height:26px;
      background:none;margin:0}
  .tl input[type="range"]::-webkit-slider-runnable-track{height:26px;border-radius:9px;background:var(--sur2)}
  .tl input[type="range"]::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:26px;
      border-radius:8px;background:var(--tel);border:0}
  .tl.mini{flex-wrap:nowrap;padding:5px 10px;gap:8px}
  .tl.mini .ap{flex:1;min-width:0}
  .tl.mini .ap span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  /* Le logo télécommande, en tête de la barre : il ouvre la télécommande DMX,
     celle qui parle en canaux là où la barre parle en gradateurs. */
  .tl .lgo{flex:none;min-width:30px;padding:5px 6px;display:grid;place-items:center;
      border-color:var(--tel);color:var(--tel);background:var(--bg)}
  .tl .lgo .ic{width:17px;height:17px}
  .tl .lgo.on{background:var(--tel);color:#fff}
  .tl.mini .lgo{padding:4px 6px}

  /* Les rangées : un appareil et un gradateur se lisent pareil. */
  .pile{background:var(--sur);border-radius:16px;overflow:hidden;margin-bottom:10px}
  .pile>h4{margin:0;padding:11px 14px;background:var(--sur2);font:700 10.5px/1 var(--body);
       letter-spacing:.14em;text-transform:uppercase;color:var(--ink3);
       display:flex;justify-content:space-between;align-items:center;gap:10px}
  .pile>h4 span{font:500 11px/1 var(--mono);text-transform:none;letter-spacing:0}
  .pile>h4 button{border:1.5px solid var(--line);background:var(--bg);border-radius:99px;
       padding:4px 9px;font:600 10px/1 var(--body);letter-spacing:.06em;text-transform:uppercase;
       color:var(--ink2);cursor:pointer}
  .pile .rien{padding:14px;font-size:13px;color:var(--ink3);margin:0}
  .rg{display:grid;grid-template-columns:24px minmax(0,1fr) auto auto;gap:10px;align-items:center;
      padding:9px 14px;border-top:1px solid var(--line);font-size:13.5px}
  .rg .bd{width:24px;height:24px;border-radius:7px;display:grid;place-items:center;
      font:700 10px/1 var(--mono);color:var(--bg);background:var(--tel)}
  .rg .bd.ap{background:var(--dmx)}
  .rg .tx{min-width:0}
  .rg .tx b{display:block;font:600 13.5px/1.25 var(--body);overflow:hidden;
      text-overflow:ellipsis;white-space:nowrap}
  .rg .tx span{font-size:11.5px;color:var(--ink3)}
  .rg .dm{font:500 11.5px/1.3 var(--mono);color:var(--ink3);text-align:right;white-space:nowrap}
  .rg .dm b{display:block;font-size:13px;color:var(--ink)}
  .rg .ac{border:1.5px solid var(--line);background:var(--bg);border-radius:9px;padding:8px 10px;
      font:600 11.5px/1 var(--body);color:var(--ink2);white-space:nowrap;min-width:62px;cursor:pointer}
  .rg .ac.on{background:var(--tel);border-color:var(--tel);color:#fff}
  .rg .ac.vide{border-style:dashed;color:var(--ink3)}
  .rg.on{background:color-mix(in srgb,var(--tel) 10%,transparent)}
  .rg.cliquable{cursor:pointer}
  .rg.pointe{outline:2px solid var(--tel);outline-offset:-2px;border-radius:10px;
      scroll-margin-top:132px}

  /* Les deux actions, au-dessus de la barre d'onglets de l'application. */
  .pecr .p-bas{position:fixed;left:0;right:0;z-index:9;
      bottom:calc(66px + env(safe-area-inset-bottom,0px));
      background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(10px);
      border-top:1.5px solid var(--line);padding:7px 16px}
  .pecr .p-bas .in{max-width:560px;margin:0 auto;display:flex;gap:7px}
  .pecr .p-bas button{flex:1;border:0;border-radius:11px;padding:9px 10px;
      font:700 12.5px/1.2 var(--body);background:var(--tel);color:#fff;cursor:pointer;
      display:flex;align-items:center;justify-content:center;gap:7px;min-width:0}
  .pecr .p-bas button .et{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .pecr .p-bas button.dmx{background:var(--dmx)}
  .pecr .p-bas button.pdf{flex:none;background:var(--sur2);color:var(--ink2);padding:9px 12px}
  .pecr .p-bas button .cpt{font:600 10.5px/1 var(--mono);background:rgba(255,255,255,.22);
      border-radius:99px;padding:3px 6px}
  .pecr .p-bas button[aria-expanded="true"]{box-shadow:inset 0 0 0 2px rgba(255,255,255,.45)}
  /* La place que prend la barre du bas, rendue à la liste. */
  .pecr{padding-bottom:52px}

  /* ------------------------------ volets -------------------------------- */
  /* À mi-écran : la liste reste visible au-dessus et se met à jour pendant
     qu'on écrit dedans. Un appui sur le fond, ou la poignée, referme. */
  .p-fond{position:fixed;inset:0;z-index:20;background:rgba(8,9,12,.34);opacity:0;
      transition:opacity .16s}
  .p-fond.on{opacity:1}
  .p-volet{position:fixed;left:0;right:0;bottom:0;z-index:21;background:var(--sur);
      border-top:1.5px solid var(--line);border-radius:20px 20px 0 0;
      box-shadow:0 -14px 40px rgba(8,9,12,.22);max-height:min(72vh,620px);
      display:flex;flex-direction:column;transform:translateY(102%);transition:transform .2s ease-out}
  .p-volet.on{transform:translateY(0)}
  @media (prefers-reduced-motion:reduce){ .p-volet,.p-fond{transition:none} }
  .p-volet .poignee{flex:none;padding:9px 16px 4px;cursor:pointer}
  .p-volet .poignee .barre{display:block;width:38px;height:4px;border-radius:99px;
      background:var(--line);margin:0 auto}
  .p-volet .tete{flex:none;display:flex;align-items:baseline;gap:10px;padding:2px 16px 10px;
      border-bottom:1px solid var(--line)}
  .p-volet .tete h3{font:800 17px/1.1 var(--disp);letter-spacing:-.02em;margin:0}
  .p-volet .tete .cpt{margin-left:auto;font:500 11.5px/1 var(--mono);color:var(--ink3)}
  .p-volet .tete .x{border:0;background:var(--sur2);border-radius:99px;width:30px;height:30px;
      color:var(--ink2);font-size:15px;line-height:1;cursor:pointer}
  .p-volet .corps{flex:1;min-height:0;overflow-y:auto;padding:12px 16px
      calc(14px + env(safe-area-inset-bottom,0px))}
  .p-volet .aide{font:500 12.5px/1.5 var(--body);color:var(--ink3);margin:10px 2px}
  .p-volet .alert{font:500 13px/1.5 var(--body);color:var(--ink2);margin:14px 0 0}
  .p-volet .alert b{color:var(--ko)}
  .p-volet .route{font:500 11.5px/1.4 var(--mono);color:var(--ink3);margin:10px 2px 0;text-align:center}
  .p-volet .rang{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:9px}
  .p-volet .rang2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
  .p-volet .mini{border:1.5px solid var(--line);background:var(--bg);border-radius:12px;
      padding:12px 6px;font:600 12.5px/1 var(--body);color:var(--ink2);cursor:pointer}
  .p-volet .mini.on{background:var(--tel);border-color:var(--tel);color:#fff}
  .p-volet .gros{width:100%;border:0;border-radius:14px;padding:16px;font:700 16px/1 var(--body);
      background:var(--tel);color:#fff;margin-bottom:9px;cursor:pointer}
  .p-volet .act{border:0;border-radius:13px;padding:14px;font:700 13.5px/1 var(--body);
      background:var(--dmx);color:#fff;cursor:pointer;width:100%;margin-top:8px}
  .p-volet .rang2 .act{margin-top:0}
  .p-volet .act.sec{background:var(--bg);border:1.5px solid var(--line);color:var(--ink2)}
  .p-volet .act.sup{background:var(--bg);border:1.5px solid var(--ko);color:var(--ko)}
  .p-volet .kv input[type="checkbox"]{width:22px;height:22px;accent-color:var(--tel)}
  .p-volet h5{font:700 10px/1 var(--body);letter-spacing:.14em;text-transform:uppercase;
      color:var(--ink3);margin:16px 0 9px}

  /* Le relevé : l'écran d'appel, le pavé, la jauge. */
  .rel .avanc{height:5px;border-radius:99px;background:var(--sur2);overflow:hidden;margin-bottom:10px}
  .rel .avanc i{display:block;height:100%;background:var(--tel);transition:width .2s}
  .rel .ecr{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 14px;align-items:center;
      background:var(--sur2);border-radius:14px;padding:12px 14px;margin-bottom:10px}
  .rel .ecr .n{grid-row:1/3;font:600 42px/1 var(--mono);color:var(--tel);border:0;background:none;
      font-variant-numeric:tabular-nums;min-width:74px;text-align:center;cursor:pointer;
      border-radius:11px;padding:2px}
  .rel .ecr .n small{display:block;font:600 9px/1.6 var(--body);letter-spacing:.1em;
      text-transform:uppercase;color:var(--ink3)}
  .rel .ecr .ad{font:500 11.5px/1.3 var(--mono);color:var(--ink3);align-self:end}
  .rel .ecr .cir{background:var(--bg);border:1.5px solid var(--line);border-radius:11px;
      padding:11px 12px;font:600 22px/1 var(--mono);outline:none;width:100%;align-self:start}
  .rel .ecr .cir:focus{border-color:var(--tel)}
  .rel .note{width:100%;background:var(--bg);border:1.5px solid var(--line);border-radius:11px;
      padding:10px 12px;font:500 14px/1 var(--body);outline:none;margin-bottom:10px}
  /* `.jauge` sert aussi de barre de progression, haute de 5 pixels et rognée :
     la jauge de niveau, elle, est une rangée — sans quoi le curseur est coupé. */
  .rel .jauge,.tcd .jauge{display:flex;align-items:center;gap:11px;margin-bottom:10px;
      height:auto;overflow:visible;background:none;border-radius:0}
  .rel .jauge input,.tcd .jauge input{-webkit-appearance:none;appearance:none;flex:1;height:34px;
      background:none;margin:0}
  .rel .jauge input::-webkit-slider-runnable-track,
  .tcd .jauge input::-webkit-slider-runnable-track{height:34px;border-radius:11px;background:var(--sur2)}
  .rel .jauge input::-webkit-slider-thumb,
  .tcd .jauge input::-webkit-slider-thumb{-webkit-appearance:none;width:30px;height:34px;
      border-radius:10px;background:var(--tel);border:0}
  .rel .jauge b,.tcd .jauge b{font:600 17px/1 var(--mono);min-width:54px;text-align:right;
      font-variant-numeric:tabular-nums}
  .pave .saisie{background:var(--sur2);border-radius:14px;padding:14px;margin-bottom:10px;
      font:600 40px/1 var(--mono);text-align:center;color:var(--tel);font-variant-numeric:tabular-nums}
  .pave .saisie.vide{color:var(--ink3);font-size:20px}
  .pave .touches{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .pave .touches button{border:0;border-radius:13px;padding:15px 0;background:var(--sur2);
      font:600 21px/1 var(--mono);color:var(--ink);cursor:pointer}
  .pave .touches button.acc{background:var(--tel);color:#fff}
  .pave .touches button.sec{background:var(--bg);border:1.5px solid var(--line);
      font:600 14px/1 var(--body);color:var(--ink2)}

  /* La télécommande DMX : l'univers et le canal se tapent au pavé, le niveau se
     tient, et l'écran dit ce que la feuille a posé à cette adresse. */
  .tcd .ecr{display:grid;grid-template-columns:1fr auto;gap:6px 10px;background:var(--sur2);
      border-radius:14px;padding:12px 14px;margin-bottom:10px;align-items:baseline}
  .tcd .ecr .adr{display:flex;align-items:baseline;gap:9px;min-width:0}
  .tcd .ecr .adr b{font:600 30px/1 var(--mono);color:var(--tel);font-variant-numeric:tabular-nums}
  .tcd .ecr .adr i{font:600 11px/1.2 var(--mono);color:var(--ink3);font-style:normal}
  .tcd .ecr .lv{text-align:right;font:600 21px/1 var(--mono);font-variant-numeric:tabular-nums}
  .tcd .ecr .lv small{display:block;font:500 10px/1.8 var(--mono);color:var(--ink3)}
  .tcd .ecr .oc{grid-column:1/-1;font:500 12.5px/1.4 var(--body);color:var(--ink2)}
  .tcd .ecr .ad{grid-column:1/-1;font:500 11px/1.4 var(--mono);color:var(--ink3)}
  /* La ligne de commande, comme sur un pupitre : ce qui est tapé, en clair. */
  .tcd .cmd{display:flex;align-items:center;gap:3px;background:var(--sur2);border-radius:12px;
      padding:11px 14px;margin-bottom:8px;min-height:44px;overflow-x:auto;white-space:nowrap;
      font:600 17px/1.2 var(--mono);color:var(--tel)}
  .tcd .cmd.vide{font:500 12.5px/1.2 var(--body);color:var(--ink3)}
  .tcd .msg{font:500 11.5px/1.4 var(--mono);color:var(--ink3);margin:-3px 4px 8px}
  .tcd .cmd .cur{flex:none;width:9px;height:19px;border-radius:2px;background:var(--tel);
      animation:clign 1.1s steps(2,start) infinite}
  @keyframes clign{50%{opacity:0}}
  @media (prefers-reduced-motion:reduce){ .tcd .cmd .cur{animation:none} }
  /* Le clavier : trois colonnes de chiffres, une de fonctions, comme un pupitre. */
  .tcd .clav{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
  .tcd .clav button{border:0;border-radius:12px;padding:13px 0;background:var(--sur2);
      font:600 20px/1 var(--mono);color:var(--ink);cursor:pointer}
  .tcd .clav button.fn{background:var(--bg);border:1.5px solid var(--line);
      font:600 12.5px/1 var(--body);color:var(--ink2)}
  .tcd .clav button.acc{background:var(--tel);border-color:var(--tel);color:#fff}
  .tcd .clav button:active{transform:scale(.97)}
  .tcd .tenus{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0 0}
  .tcd .tenus button{border:1.5px solid var(--tel);border-radius:99px;padding:7px 11px;
      background:color-mix(in srgb,var(--tel) 12%,transparent);color:var(--tel);cursor:pointer;
      font:600 11px/1 var(--mono);font-variant-numeric:tabular-nums}
  .tcd .tenus button.ici{background:var(--tel);color:#fff}

  /* Le tableau d'ajout de lignes. */
  .pf{border:1.5px solid var(--line);border-radius:14px;overflow:hidden;margin-bottom:12px;
      background:var(--bg)}
  .pf .lg{display:grid;grid-template-columns:minmax(0,1fr) 84px 30px;gap:7px;
      grid-template-areas:"app app x" "mode qte x" "ua ua x" "et et et";
      padding:9px 12px;border-top:1px solid var(--line)}
  .pf .lg:first-of-type{border-top:0}
  .pf select,.pf .lg input{background:var(--sur);border:1.5px solid var(--line);border-radius:9px;
      padding:8px 9px;outline:none;width:100%;font:500 13px/1.2 var(--body);min-width:0}
  .pf .lg input{font-family:var(--mono);text-align:center}
  /* Chaque champ porte son libellé : deux nombres nus côte à côte ne disaient
     pas lequel était l'empreinte et lequel la quantité. */
  .pf .lg .cf{display:flex;flex-direction:column;gap:4px;min-width:0}
  .pf .lg .cf i{font:700 9.5px/1 var(--body);letter-spacing:.1em;text-transform:uppercase;
      color:var(--ink3);font-style:normal;padding-left:3px;white-space:nowrap;
      overflow:hidden;text-overflow:ellipsis}
  .pf .lg .c-app{grid-area:app}
  .pf .lg .c-mode{grid-area:mode}
  .pf .lg .c-qte{grid-area:qte}
  /* L'univers et la première adresse s'écrivent : basculer « à la suite » ne
     laissait pas le choix de l'endroit. */
  .pf .lg .c-ua{grid-area:ua;display:grid;grid-template-columns:1fr 1fr;gap:7px;min-width:0}
  .pf .lg .x{grid-area:x;align-self:center;border:0;background:none;color:var(--ink3);
      font-size:15px;padding:8px 2px;cursor:pointer}
  .pf .lg .rg{grid-area:et;display:flex;gap:7px;align-items:stretch}
  .pf .lg .et{flex:1;min-width:0;text-align:left;border:1px solid var(--line);background:var(--sur);
      border-radius:9px;padding:7px 10px;display:flex;justify-content:space-between;
      align-items:baseline;gap:10px;font:500 11px/1.3 var(--mono);color:var(--ink3);cursor:pointer}
  .pf .lg .et b{color:var(--ink);font-size:12px}
  .pf .lg .et.ko b{color:var(--ko)}
  .pf .lg .lib{flex:none;border:1px solid var(--ko);background:var(--sur);border-radius:9px;
      padding:7px 10px;font:600 11px/1.2 var(--body);color:var(--ko);cursor:pointer;
      white-space:nowrap}
  .pf .pied{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:10px 12px;
      background:var(--sur2);border-top:1px solid var(--line)}
  .pf .pied button{border:1.5px solid var(--line);background:var(--bg);border-radius:10px;
      padding:9px 13px;font:600 12.5px/1 var(--body);color:var(--ink2);cursor:pointer}
  .pf .pied .tot{margin-left:auto;font:500 11.5px/1.4 var(--mono);color:var(--ink3);text-align:right}
  .pf .pied .tot b{color:var(--ink)}
  .pf .pied .tot b.ko{color:var(--ko)}

  /* Les patchs. */
  .pat .plage{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:4px}
  .pat .plage .f{margin-bottom:0}
  .pat .plage .dest{grid-column:1/-1}
  .pat .liste2{display:flex;flex-direction:column;gap:7px;margin-bottom:4px}
  .pat .p{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:9px;align-items:center;
      border:1.5px solid var(--line);border-radius:13px;padding:11px 12px;background:var(--bg)}
  .pat .p.ici{border-color:var(--tel);background:color-mix(in srgb,var(--tel) 8%,transparent)}
  .pat .p b{display:block;font:700 14.5px/1.2 var(--body);overflow:hidden;
      text-overflow:ellipsis;white-space:nowrap}
  .pat .p span span{font:500 11px/1.4 var(--mono);color:var(--ink3)}
  .pat .p .ouv{border:1.5px solid var(--line);background:var(--sur);border-radius:9px;
      padding:8px 11px;font:600 11.5px/1 var(--body);color:var(--ink2);white-space:nowrap;cursor:pointer}
  .pat .p.ici .ouv{border-color:var(--tel);color:var(--tel)}
  .pat .p .sup{border:0;background:none;color:var(--ink3);font-size:15px;padding:4px 2px;cursor:pointer}

  /* ------------------- inventaire : recherche, ajout, fiche ------------- */
  /* Les trois listes du parc se tiennent pareil : une recherche, un bandeau
     de filtres, les rangées avec leur crayon, un ajout en pied de liste. */
  .sbar.inv{margin:0 0 10px}
  .rowed{display:flex;align-items:stretch;gap:6px}
  .rowed .row{flex:1;min-width:0}
  .rowed .ed{flex:none;width:44px;border:1.5px solid var(--line);background:var(--bg);
       border-radius:14px;cursor:pointer;color:var(--ink2);display:grid;place-items:center}
  .rowed .ed:active{transform:scale(.97)}
  .rowed .ed .ic{width:18px;height:18px}
  .ajout{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;
       border:1.5px dashed var(--line);background:none;border-radius:14px;padding:13px;
       margin-top:12px;color:var(--ink2);font:700 13.5px/1 var(--body);cursor:pointer}
  .ajout .ic{width:17px;height:17px}
  .ajout:active{transform:scale(.99)}
  .vide{color:var(--ink3);font-size:13.5px;padding:14px 2px;margin:0}
  .fin{display:flex;gap:10px;margin:16px 0 4px}
  .fin button{flex:1;border:0;border-radius:14px;padding:14px;cursor:pointer;
       font:700 14px/1 var(--body)}
  .fin .val{background:var(--ink);color:var(--bg)}
  .fin .ann{background:var(--sur);color:var(--ink2)}
  .fin button:active{transform:scale(.99)}
  .sup-tot{width:100%;border:1.5px solid var(--ko);background:none;color:var(--ko);
       border-radius:14px;padding:13px;margin-top:8px;cursor:pointer;
       font:700 13px/1 var(--body)}
  .err{color:var(--ko);font-size:13px;margin:8px 0 0}

  /* ---------------------------- section de câble ----------------------- */
  /* La réponse en tête : rouvert sur le plateau, l'écran redonne la section
     sans qu'on ait à descendre sous les réglages. */
  .cab .res{background:var(--sur);border-radius:18px;padding:16px;margin-bottom:10px;
       box-shadow:inset 3px 0 0 var(--cab)}
  .cab .res .kick{font:700 10.5px/1 var(--body);letter-spacing:.16em;text-transform:uppercase;
       color:var(--ink3)}
  .cab .res .big{display:flex;align-items:baseline;gap:8px;margin:10px 0 4px}
  .cab .res .big b{font:600 44px/1 var(--mono);color:var(--cab);font-variant-numeric:tabular-nums}
  .cab .res .big span{font:600 16px/1 var(--mono);color:var(--ink2)}
  .cab .res>p{margin:0 0 6px;font-size:13.5px;color:var(--ink2)}
  .cab .res .alert{margin:10px 0 0}
  .cab .f .tri{margin:0}
  .cab .f small{font-size:12px;line-height:1.4;color:var(--ink3)}
  .cab .f input:focus,.cab .f select:focus{border-color:var(--cab)}
  .cab .formule{font:500 12px/1.6 var(--mono);color:var(--ink3);margin:0}
</style>
</head>

<script>
const $ = (s, r=document) => r.querySelector(s);
const el = (t, c, h) => { const n = document.createElement(t); if(c) n.className = c; if(h!=null) n.innerHTML = h; return n; };
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const vg = n => String(n).replace(".", ",");
const S = { tab:"home", route:{ v:"home" }, q:"", marque:null, typeMach:null,
            qs:{ proj:"", mach:"", haut:"", gel:"" },
            gel:GEL_PAR_REF.L201 || GELS[0], gelMode:null, gelMarque:"L" };

const ic = (n, cls="ic") => `<svg class="${cls}" aria-hidden="true"><use href="#i-${n}"/></svg>`;
const ICO_FAM = {
  "Lyre découpe":"lyre", "Lyre wash":"lyre", "Lyre beam":"lyre", "Lyre hybride":"lyre",
  "Découpe":"decoupe", "Découpe LED":"decoupe", "Poursuite":"poursuite",
  "PC":"pc", "Fresnel LED":"pc",
  "Wash LED":"wash", "Wash LED IP":"wash", "Cyclo LED":"wash",
  "Barre LED":"barre", "Tube LED":"tube",
  "Machine à brume":"fumee", "Machine à fumée lourde":"fumee", "Accessoire":"power"
};
const ICO_MACH = {
  Structure:"structure", Accroche:"collier", Moteurs:"moteur", "Mono tube":"barre",
  "Tapis de danse":"tapis", Frises:"textile", Pendrillon:"textile", Fond:"textile",
  "Demi fond":"textile", Cyclorama:"textile", Inter:"textile"
};
const ICO_HAUT = { Passerelle:"passerelle", "Plateforme élévatrice":"nacelle" };

/* Le compte est une fonction : l'inventaire se modifie depuis l'application,
   la tuile doit dire ce qu'il contient maintenant. */
const CATS = [
  { k:"proj", t:"Projecteurs", s:"Parc lumière", c:"var(--proj)", n:() => PROJECTEURS.length, i:"lyre" },
  { k:"mach", t:"Machinerie", s:"Structure & textile", c:"var(--mach)", n:() => MACHINERIE.length, i:"structure" },
  { k:"haut", t:"Hauteurs", s:"Passerelles & PEMP", c:"var(--haut)", n:() => HAUTEURS.length, i:"passerelle" },
  /* La bibliothèque garde la clé et la couleur de l'ancien écran MDG, qui en
     est devenu la première fiche. */
  { k:"mdg", t:"Manuels", s:"Notes de fonctionnement", c:"var(--mdg)", n:() => MANUELS.length, i:"manuel" }
];
/* Le patch prend la tuile large : c'est l'outil qu'on ouvre le plus, et ça met
   les deux télécommandes côte à côte sur la rangée suivante, où on les compare.
   Elles portaient la même couleur et le même pictogramme, et leurs noms ne
   différaient que par un suffixe. */
const TOOLS = [
  { k:"dmx", t:"Patch", s:"Adresses & export PDF", c:"var(--dmx)", i:"dmx", large:true },
  { k:"tel", t:"Télécommande", s:"Circuits, gradateurs sACN", c:"var(--tel)", i:"remote" },
  { k:"tcd", t:"Canal DMX", s:"Un canal à la main", c:"var(--tcd)", i:"fader" },
  { k:"gel", t:"Gélatines", s:"Lee, GAM, Rosco → LED", c:"var(--gel)", i:"gel" },
  { k:"dist", t:"Projection", s:"Distance, optique, lumens", c:"var(--dpj)", i:"projo" },
  { k:"ndi", t:"Flux NDI", s:"Sources vidéo", c:"var(--ndi)", i:"ndi" },
  /* Les deux calculateurs électriques côte à côte, le réseau sur la rangée
     suivante. */
  { k:"ups", t:"Onduleur", s:"Capacité UPS, VA", c:"var(--ups)", i:"ups" },
  { k:"cab", t:"Section câble", s:"Chute de tension, mm²", c:"var(--cab)", i:"cable" },
  { k:"net", t:"Réseau", s:"Ping & hôtes", c:"var(--net)", i:"reseau" },
  { k:"art", t:"Art-Net / sACN", s:"Univers en direct", c:"var(--art)", i:"artnet" }
];
/* Tout ce que l'accueil sait ouvrir, y compris les outils : taper « réseau »
   ou « patch » répondait « rien pour… » alors que la tuile était juste dessous. */
const DESTINATIONS = () => [...CATS, ...TOOLS,
  { k:"maj", t:"Application", s:"Version & thème", c:"var(--maj)", i:"maj" }];

/* --------------------------- aller et revenir ---------------------------- */
/* Le geste de retour d'Android fermait l'application depuis n'importe quel
   écran, y compris en plein patch : il n'y avait d'historique ni dans la page
   ni dans la coque. Chaque changement d'écran empile donc une entrée, que
   `popstate` dépile ; la coque rend la main à Android quand la pile est vide. */
const PILE = [];
const VUES_PATCH = ["dmx", "tel", "tcd"];
const memeRoute = (a, b) => a.v === b.v && a.k === b.k && a.i === b.i && a.p === b.p;

/* Quitter l'écran du patch relâche tous les circuits — c'est voulu, mais rien
   ne le disait : on tenait un gradateur à 50 %, on touchait « Accueil » pour
   vérifier une gélatine, et tout retombait sans un mot. */
function peutQuitterPatch(v){
  if(!VUES_PATCH.includes(S.route.v) || VUES_PATCH.includes(v)) return true;
  let actif = false;
  try { actif = !!(NET.emissionEtat() || {}).actif; } catch(e){ }
  return !actif || confirm("Une émission DMX tourne. Quitter l'écran relâche "
    + "tous les circuits. Quitter quand même ?");
}

const go = r => {
  if(memeRoute(S.route, r)){ window.scrollTo(0, 0); render(); return; }
  if(!peutQuitterPatch(r.v)) return;
  PILE.push({ r:S.route, y:window.scrollY });
  try { history.pushState({ n:PILE.length }, ""); } catch(e){ }
  S.route = r; window.scrollTo(0, 0); render();
};

/* Le chevron prend le même chemin que le geste, au lieu d'empiler un retour de
   plus : deux allers et deux retours ramènent d'où l'on vient. */
const retour = defaut => { if(PILE.length) history.back(); else go(defaut || { v:"home" }); };

window.addEventListener("popstate", () => {
  const p = PILE[PILE.length - 1];
  if(!p) return;                    // pile vide : la coque laisse Android fermer
  if(!peutQuitterPatch(p.r.v)){     // refusé : on repose l'entrée qu'Android vient de retirer
    try { history.pushState({ n:PILE.length }, ""); } catch(e){ }
    return;
  }
  PILE.pop();
  S.route = p.r;
  render();
  /* Le contenu neuf n'est pas encore mesuré : sans cette lecture, le navigateur
     rabat le défilement à zéro faute de savoir jusqu'où il va. */
  void document.body.offsetHeight;
  window.scrollTo(0, p.y || 0);
});

/* -------------------------------- écrans -------------------------------- */
/* Dans le noir, avec un gant, un appui se sent mieux qu'il ne se voit. */
function toucher(){ try { if(navigator.vibrate) navigator.vibrate(8); } catch(e){ } }

function tuile(c, petite){
  const b = el("button", "tile" + (c.large ? " wide" : petite ? " sm" : ""));
  b.style.setProperty("--c", c.c);
  const coin = c.n ? `<span class="n">${c.n()}</span>`
             : c.mot ? `<span class="n mot">${esc(c.mot)}</span>` : "";
  b.innerHTML = `${coin}${ic(c.i)}<span class="tx"><b>${esc(c.t)}</b><span>${esc(c.s)}</span></span>`;
  b.onclick = () => { toucher(); go({ v:c.k }); };
  return b;
}
function grille(liste, petite){
  const g = el("div", "tiles");
  liste.forEach(c => g.append(tuile(c, petite)));
  /* Une petite tuile seule sur sa rangée laissait un trou dans la grille :
     elle prend la largeur. */
  const seules = [...g.children].filter(t => !t.classList.contains("wide"));
  if(petite && seules.length % 2) seules[seules.length - 1].classList.add("wide");
  return g;
}

/* L'état du réseau : lu au plus une fois toutes les deux secondes — chaque
   frappe de recherche rendait la page entière et repassait par le pont — et
   repeint tout seul, pour qu'un Wi-Fi tombé se voie sans changer d'écran. */
const RESEAU = { t:0, v:null };
function etatReseau(){
  const m = Date.now();
  if(m - RESEAU.t > 2000){ RESEAU.t = m; try { RESEAU.v = NET.wifi(); } catch(e){ RESEAU.v = null; } }
  return RESEAU.v;
}
function peindreReseau(){
  const b = $("#etat-res");
  if(!b) return;
  if(!NET.natif){ b.textContent = "démo"; b.className = "badge"; return; }
  const w = etatReseau(), ok = !!(w && w.ip);
  b.textContent = ok ? w.ip : "hors réseau";
  b.className = "badge " + (ok ? "ok" : "ko");
  b.setAttribute("aria-label", (ok ? "Réseau " + w.ip : "Hors réseau") + ", ouvrir l'outil Réseau");
}
setInterval(peindreReseau, 3000);

/* La mise à jour est un réglage, pas un outil de plateau : une ligne sous la
   grille, avec une pastille quand une version attend. */
function ligneAppli(){
  const e = MAJ.e || {};
  const attend = ["disponible", "telechargement", "pret", "autorisation"].includes(e.phase);
  const dit = attend ? nomVer(e) + (e.phase === "pret" ? " prête à installer"
                                  : e.phase === "telechargement" ? " en téléchargement" : " disponible")
                     : e.nomInstalle ? "Version " + e.nomInstalle : "Version & thème";
  const b = el("button", "appli");
  b.innerHTML = `${ic("maj")}<span class="g"><b>Application</b><span>${esc(dit)}</span></span>
    ${attend ? `<span class="pt"></span>` : ""}`;
  b.onclick = () => { toucher(); go({ v:"maj" }); };
  return b;
}
function zoneAppli(){
  const z = el("div");
  z.id = "appli-zone";
  z.append(ligneAppli());
  return z;
}

function home(){
  const d = el("div");
  const nb = adresser(P.lignes).length;
  /* L'accroche de vitrine passait à deux ou trois lignes sur un téléphone pour
     ne rien dire : à sa place, le patch ouvert, qui est ce qu'on vient voir. */
  d.innerHTML = `<div class="head"><span class="mark">${ic("dmx")}</span>
      <div><h1>Patch</h1><p><b>${esc(P.nom || "Sans titre")}</b> · ${nb} appareil${nb > 1 ? "s" : ""}</p></div>
      <button class="badge" id="etat-res" aria-label="État du réseau">hors réseau</button></div>

      <input id="q" value="${esc(S.q)}" placeholder="Ghibli, moteur, passerelle, L201, réseau…" autocomplete="off"></label>
    <div id="maj-zone"></div>`;
  const badge = d.querySelector("#etat-res");

  d.append(grille(TOOLS, true), zoneAppli());

}

/* « reseau » doit trouver « Réseau » : sur un clavier de téléphone, à une main,
   l'accent est la première chose qu'on laisse tomber. */
const plat = s => String(s ?? "").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "");

function resultats(){
  const q = plat(S.q);
  const d = el("div");
  const ecr = DESTINATIONS().filter(x => plat(x.t + " " + x.s).includes(q));
  const proj = PROJECTEURS.filter(p => plat(p.nom + " " + p.marque + " " + p.fam).includes(q));
  const mach = MACHINERIE.filter(m => plat(m.nom + " " + m.type).includes(q));
  const haut = HAUTEURS.filter(h => plat(h.nom).includes(q));
  const gel = GELS.filter(g => plat(g.ref + " " + g.nom).includes(q));
  const man = MANUELS.filter(m => texteCherche(m).includes(q));
  /* Le titre annonçait le compte complet et la liste n'en posait que huit,
     sans rien qui dise où étaient les autres : la dernière ligne y emmène,
     avec le même mot déjà tapé. */
  const bloc = (titre, items, fn, tout) => {
    if(!items.length) return;
    d.insertAdjacentHTML("beforeend", `<h2 class="sec">${titre} · ${items.length}</h2>`);
    const l = el("div", "rowlist");
    items.slice(0, 8).forEach(x => l.append(fn(x)));
    if(tout && items.length > 8){
      const b = el("button", "voir", `Voir les ${items.length} ${titre.toLowerCase()}`);
      b.onclick = () => { toucher(); tout(); };
      l.append(b);
    }
    d.append(l);
  };
  bloc("Écrans", ecr, x => { const r = rowSimple(x.t, x.s, "", "", x.c, x.i);
    r.onclick = () => { toucher(); go({ v:x.k }); }; return r; });
  bloc("Projecteurs", proj, p => rowProj(p), () => { S.qs.proj = S.q; go({ v:"proj" }); });
  bloc("Machinerie", mach, m => rowMach(m), () => { S.qs.mach = S.q; go({ v:"mach" }); });
  bloc("Hauteurs", haut, h => rowHaut(h), () => { S.qs.haut = S.q; go({ v:"haut" }); });
  bloc("Gélatines", gel, g => { const r = rowSimple(g.ref, g.nom, "", MARQUES_GEL[g.m],
      g.hex || "var(--ink3)", "gel");
    r.onclick = () => { S.gel = g; go({ v:"gel" }); }; return r; },
    () => { S.qs.gel = S.q; S.gelMarque = null; go({ v:"gel" }); });
  bloc("Manuels", man, m => rowManuel(m), () => { S.qs.man = S.q; go({ v:"mdg" }); });
  if(!ecr.length && !proj.length && !mach.length && !haut.length && !gel.length && !man.length)
    d.insertAdjacentHTML("beforeend", `<p class="muted" style="margin-top:20px">Rien pour « ${esc(S.q)} ».</p>`);
  return d;
}

function rowProj(p){
  const b = el("button", "row");
  b.style.setProperty("--c", "var(--proj)");
  b.innerHTML = `<span class="av">${ic(ICO_FAM[p.fam] || "lyre")}</span>
    <span class="g"><b>${esc(p.nom)}</b><span>${esc(p.marque)} · ${esc(p.fam)}</span></span>
    <span class="r">${esc(p.w)}<i>${p.nb ? "×" + p.nb : esc(p.kg)}</i></span>`;
  b.onclick = () => go({ v:"fiche", p });
  return b;
}
function rowSimple(t, s, r, r2, c, icone){
  const b = el("button", "row");
  b.style.setProperty("--c", c);
  b.innerHTML = `<span class="av">${icone ? ic(icone) : esc(String(t).slice(0, 2).toUpperCase())}</span>
    <span class="g"><b>${esc(t)}</b><span>${esc(s)}</span></span>
    <span class="r">${esc(r)}<i>${esc(r2)}</i></span>`;
  return b;
}
function rowMach(m){
  return rowSimple(m.nom,
    [m.l && "L " + m.l, m.h && "H " + m.h, m.vit, m.trust].filter(Boolean).join(" · ") || "—",
    m.nb ? "×" + m.nb : "", m.charge || "", "var(--mach)", ICO_MACH[m.type] || "structure");
}
function rowHaut(h){
  return rowSimple(h.nom, [h.type, h.pos].filter(Boolean).join(" · ") || "—",
    metres(h.h) + " m", h.charge ? h.charge + " kg" : "",
    "var(--haut)", ICO_HAUT[h.type] || "passerelle");
}
function bar(titre, cnt, back){
  const d = el("div", "bar");
  const b = el("button", "bk", ic("back"));
  b.setAttribute("aria-label", "Retour");
  b.onclick = back || (() => retour());
  d.append(b, el("h2", null, esc(titre)));
  if(cnt) d.append(el("span", "cnt", cnt));
  return d;
}

/* Bibliothèque de modes : saisie à la main ou import d'un fichier GDTF. */
function carteModes(p){
  const k = cleApp(p);
  const modes = BIB[k] || [];
  const c = el("div", "card");
  c.innerHTML = `<h4>Modes DMX</h4>`;
  const l = el("div", "modes");
  if(modes.length){
    modes.forEach((m, i) => {
      const r = el("div", "mode");
      r.innerHTML = `<b>${esc(m.nom)}</b><span>${m.ch} ch</span>
        ${m.demo ? '<span class="chipdemo">démo</span>' : ""}
        <button aria-label="Retirer le mode ${esc(m.nom)}">✕</button>`;
      r.querySelector("button").onclick = () => {
        modes.splice(i, 1); BIB[k] = modes; sauverBib(); render();
      };
      l.append(r);
    });
  } else {
    l.append(el("p", "muted", "Aucun mode enregistré. Saisir le nom et l'empreinte, ou importer le fichier GDTF de l'appareil."));
  }
  c.append(l);

  const form = el("div", "ff");
  form.innerHTML = `<div class="f"><label for="m-nom">Nom du mode</label>
      <input id="m-nom" placeholder="Standard"></div>
    <div class="f"><label for="m-ch">Canaux</label>
      <input id="m-ch" type="text" inputmode="numeric" placeholder="20"></div>`;
  c.append(form);

  const add = el("button", "pill");
  add.style.cssText = "padding:12px;width:100%;margin-bottom:8px";
  add.textContent = "Ajouter ce mode";
  add.onclick = () => {
    const nom = $("#m-nom", c).value.trim(), ch = +$("#m-ch", c).value;
    if(!nom || !ch) return;
    BIB[k] = [...(BIB[k] || []), { nom, ch }];
    sauverBib(); render();
  };
  c.append(add);

  if(NET.natif){
    const imp = el("button", "pill");
    imp.style.cssText = "padding:12px;width:100%";
    imp.textContent = "Importer un fichier GDTF";
    imp.onclick = () => {
      imp.textContent = "Ouverture du fichier…";
      NET.gdtf(r => {
        if(r.erreur){ imp.textContent = "Échec : " + r.erreur; return; }
        if(!r.pret) return;
        if(!r.modes || !r.modes.length){ imp.textContent = "Aucun mode trouvé dans ce fichier"; return; }
        BIB[k] = r.modes.map(m => ({ nom:m.nom, ch:m.ch }));
        sauverBib(); render();
      });
    };
    c.append(imp);
    const note = el("p", "muted", "Le fichier se télécharge sur gdtf-share.com quand tu as du réseau ; une fois importé il reste dans l'application.");
    note.style.margin = "10px 0 0";
    c.append(note);
  }
  return c;
}

/* ------------------------- la bibliothèque de manuels ------------------- */
/* Les fiches vivent dans `manuels/`, une par appareil, et s'écrivent en texte
   presque brut — le mode d'emploi est dans `manuels/README.md`. Elles sont
   livrées avec l'APK : on les lit sur le plateau sans réseau. */
const typesManuels = () => [...new Set(MANUELS.map(m => m.type || "Divers"))].sort();
const texteCherche = m => plat([m.titre, m.marque, m.type, m.resume, m.texte,
  (m.reperes || []).flat().join(" ")].join(" "));
const icoManuel = m => ICO_FAM[m.type] || "manuel";

function rowManuel(m){
  const r = rowSimple(m.titre, [m.marque !== m.titre && m.marque, m.type].filter(Boolean).join(" · ") || "—",
    "", "", "var(--mdg)", icoManuel(m));
  r.onclick = () => { toucher(); go({ v:"manuel", i:m.id }); };
  return r;
}

function vMdg(){
  const d = el("div");
  const n = MANUELS.length;
  d.append(bar("Manuels", n + " fiche" + (n > 1 ? "s" : "")));
  d.append(recherche("man", "brume, pression, purge, DMX…"));
  const types = typesManuels();
  if(types.length > 1) d.append(bandeau(types, S.typeMan || null, v => { S.typeMan = v; render(); }));
  const q = plat((S.qs.man || "").trim());
  const liste = MANUELS.filter(m => (!S.typeMan || (m.type || "Divers") === S.typeMan)
                                 && (!q || texteCherche(m).includes(q)))
    .sort((a, b) => a.titre.localeCompare(b.titre, "fr"));
  types.forEach(t => {
    const lot = liste.filter(m => (m.type || "Divers") === t);
    if(!lot.length) return;
    d.insertAdjacentHTML("beforeend", `<h2 class="sec">${esc(t)}</h2>`);
    const l = el("div", "rowlist");
    lot.forEach(m => l.append(rowManuel(m)));
    d.append(l);
  });
  if(!liste.length) d.append(el("p", "vide", n ? "Aucun manuel ne correspond." : "Aucun manuel pour l'instant."));
  d.append(el("p", "muted man-pied", "Les manuels sont livrés avec l'application et se lisent sans "
    + "réseau. Une nouvelle fiche arrive avec la mise à jour suivante."));
  return d;
}

/* Le texte d'une fiche : `## titre` ouvre une carte, `1.` une étape, `-` une
   puce, `!` une alerte, `>` une remarque, `|` une ligne de tableau, `**gras**`.
   Le reste fait des paragraphes. */
function blocsManuel(texte){
  const cartes = [];
  let carte = null, bloc = null;
  const enLigne = t => esc(t).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>");
  const ouvrir = titre => { carte = { titre, blocs:[] }; cartes.push(carte); bloc = null; };
  const ajouter = (genre, contenu) => {
    if(!carte) ouvrir("");
    if(!bloc || bloc.genre !== genre || genre === "alerte" || genre === "note"){
      bloc = { genre, lignes:[] }; carte.blocs.push(bloc);
    }
    bloc.lignes.push(contenu);
  };
  String(texte || "").split("\n").forEach(brute => {
    const l = brute.trim();
    let m;
    if(!l){ bloc = null; return; }
    if((m = l.match(/^#{2,3}\s+(.*)$/))) ouvrir(m[1]);
    else if((m = l.match(/^\d+[.)]\s+(.*)$/))) ajouter("etapes", m[1]);
    else if((m = l.match(/^[-*•]\s+(.*)$/))) ajouter("puces", m[1]);
    else if((m = l.match(/^!\s*(.*)$/))) ajouter("alerte", m[1]);
    else if((m = l.match(/^>\s*(.*)$/))) ajouter("note", m[1]);
    else if(l.startsWith("|")){ if(!/^\|[\s:|-]+\|?$/.test(l)) ajouter("tableau", l); }
    else ajouter("texte", l);
  });
  return cartes.map(c => {
    const corps = c.blocs.map(b => {
      if(b.genre === "etapes") return `<ol class="steps">${b.lignes.map(x => `<li>${enLigne(x)}</li>`).join("")}</ol>`;
      if(b.genre === "puces") return `<ul class="puces">${b.lignes.map(x => `<li>${enLigne(x)}</li>`).join("")}</ul>`;
      if(b.genre === "alerte") return `<div class="alert">${enLigne(b.lignes[0])}</div>`;
      if(b.genre === "note") return `<div class="man-note">${enLigne(b.lignes[0])}</div>`;
      if(b.genre === "tableau"){
        const rangs = b.lignes.map(x => x.replace(/^\||\|$/g, "").split("|").map(v => v.trim()));
        const [tete, ...reste] = rangs;
        return `<div class="man-tab"><table><thead><tr>${tete.map(v => `<th>${enLigne(v)}</th>`).join("")}</tr></thead>
          <tbody>${reste.map(r => `<tr>${r.map(v => `<td>${enLigne(v)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
      }
      return `<p>${enLigne(b.lignes.join(" "))}</p>`;
    }).join("");
    return `<div class="card man">${c.titre ? `<h4>${enLigne(c.titre)}</h4>` : ""}${corps}</div>`;
  }).join("");
}

function vManuel(id){
  const m = MANUELS.find(x => x.id === id);
  const d = el("div");
  d.append(bar("Manuels"));
  if(!m){ d.append(el("p", "vide", "Ce manuel n'est plus dans la bibliothèque.")); return d; }
  const h = el("div", "hero");
  h.style.setProperty("--c", "var(--mdg)");
  const rep = (m.reperes || []).slice(0, 3);
  h.innerHTML = `<div class="kick">${esc([m.marque !== m.titre && m.marque, m.type].filter(Boolean).join(" · "))}</div>
    <h3>${esc(m.titre)}</h3>${m.resume ? `<p>${esc(m.resume)}</p>` : ""}
    ${rep.length ? `<div class="stats">${rep.map(([v, l]) =>
      `<div><b>${esc(v)}</b><span>${esc(l)}</span></div>`).join("")}</div>` : ""}`;
  d.append(h);
  d.insertAdjacentHTML("beforeend", blocsManuel(m.texte));
  const pied = [m.source, m.maj && "mis à jour le " + m.maj].filter(Boolean).join(" · ");
  if(pied) d.append(el("p", "muted man-pied", esc(pied)));
  return d;
}

/* --------------------------- patch & plateau ----------------------------- */
/* Un seul écran pour ce qui en occupait deux. Le patch et la télécommande
   partageaient un même travail — savoir ce qui est branché où — sans jamais se
   parler : le circuit s'écrivait deux fois, et le clavier disparaissait dès
   qu'on descendait dans la feuille pour le noter. Ici la liste est au centre,
   la télécommande tient en une barre au-dessus d'elle, et les deux actions —
   relever les gradateurs, ajouter des appareils — s'ouvrent en volets qui
   recouvrent la liste à moitié : on voit la rangée se remplir pendant qu'on
   écrit.

   Le patch appartient au spectacle : chaque création a le sien, avec ses
   appareils, ses circuits relevés et ses réglages de flux. */

const CLE_PATCHS = "patchs.v2", CLE_BIB = "bibliotheque.v1";
const CLE_PATCH_V1 = "patch.v1", CLE_GRADA_V1 = "gradateurs.v1";

function lireLocal(cle, defaut){
  try { const v = localStorage.getItem(cle); return v ? JSON.parse(v) : defaut; }
  catch(e){ return defaut; }
}
function ecrireLocal(cle, val){
  try { localStorage.setItem(cle, JSON.stringify(val)); } catch(e){ }
}

/* Le CSS savait déjà lire `data-theme`, mais rien ne le posait : le thème
   suivait Android, et on ne pouvait pas le tenir en sombre le temps d'un
   service. */
const CLE_THEME = "theme.v1";
function appliquerTheme(v){
  const r = document.documentElement;
  if(v === "clair") r.setAttribute("data-theme", "light");
  else if(v === "sombre") r.setAttribute("data-theme", "dark");
  else r.removeAttribute("data-theme");
}
let THEME = lireLocal(CLE_THEME, "auto");
appliquerTheme(THEME);

const cleApp = p => p.marque + " " + p.nom;

/* ------------------------- l'inventaire modifiable ----------------------- */
/* Les trois listes de `common.js` sont le parc d'origine. Ce qu'on ajoute,
   corrige ou retire depuis l'application est gardé en local et remplace la
   liste au chargement : le matériel bouge, le fichier livré avec l'APK non.
   Les tableaux sont modifiés sur place — tout le reste du code les lit par
   leur nom, sans avoir à savoir d'où ils viennent. */
const CLE_INV = "inventaire.v1";
const INV = {
  proj:{ liste:PROJECTEURS, titre:"Projecteurs", un:"projecteur" },
  mach:{ liste:MACHINERIE, titre:"Machinerie", un:"matériel" },
  haut:{ liste:HAUTEURS, titre:"Hauteurs", un:"niveau" }
};
(function chargerInv(){
  const sauv = lireLocal(CLE_INV, null);
  if(!sauv) return;
  Object.keys(INV).forEach(k => {
    if(Array.isArray(sauv[k])) INV[k].liste.splice(0, INV[k].liste.length, ...sauv[k]);
  });
})();
const sauverInv = () => ecrireLocal(CLE_INV,
  { proj:PROJECTEURS, mach:MACHINERIE, haut:HAUTEURS });

/* La bibliothèque de modes se garnit après : elle suit l'inventaire en place,
   pas celui livré avec l'APK. */
let BIB = lireLocal(CLE_BIB, {});
PROJECTEURS.forEach(p => {
  if(p.modes && !BIB[cleApp(p)])
    BIB[cleApp(p)] = p.modes.map(m => ({ nom:m.mode, ch:m.ch, demo:!!p.modesDemo }));
});
const sauverBib = () => ecrireLocal(CLE_BIB, BIB);

/* Recalculés à la demande : `MARQUES` et `FAMILLES` de common.js ont été figés
   au chargement, avant que l'inventaire local ne soit relu. */
const marques = () => [...new Set(PROJECTEURS.map(p => p.marque))].sort();
const familles = () => [...new Set(PROJECTEURS.map(p => p.fam))].sort();
const typesMach = () => [...new Set(MACHINERIE.map(m => m.type))];
const typesHaut = () => [...new Set(HAUTEURS.map(h => h.type))];
const metres = v => vg(Number(v || 0).toFixed(2));

/* Renommer un projecteur déplace ce qui le désignait : ses modes DMX et les
   lignes d'appareils des patchs, qui le nomment « marque + nom ». */
function renommerApp(ancien, neuf){
  if(ancien === neuf) return;
  if(BIB[ancien]){ BIB[neuf] = BIB[ancien]; delete BIB[ancien]; sauverBib(); }
  let touche = false;
  PATCHS.forEach(x => (x.lignes || []).forEach(l => {
    if(l.app === ancien){ l.app = neuf; touche = true; }
  }));
  if(touche) sauverPatchs();
}
function oublierApp(cle){
  if(BIB[cle]){ delete BIB[cle]; sauverBib(); }
}

/* Les champs d'une fiche. `t` dit comment la valeur se range — texte, entier,
   décimal — et `liste` propose ce qui existe déjà sans interdire autre chose. */

  proj:[

    { c:"type", l:"Type", ph:"Structure", req:true, liste:typesMach },
    { c:"nb", l:"Quantité", ph:"19", t:"entier" },
    { c:"l", l:"Longueur", ph:"2 m" },

  ],

/* ----------------------- les morceaux communs aux listes ----------------- */
/* La recherche traverse tous les champs de la fiche : « 1000 W », « 2 m » ou
   « Doughty » trouvent aussi bien qu'un nom. */
function filtrer(k, garde){
  const q = (S.qs[k] || "").trim().toLowerCase();
  return INV[k].liste.map((x, i) => ({ x, i })).filter(({ x }) =>
    (!garde || garde(x)) && (!q || Object.keys(x).some(c =>

}
function recherche(k, ph){

      placeholder="${esc(ph)}" autocomplete="off" aria-label="Rechercher">`;
  lab.querySelector("input").addEventListener("input", e => {
    S.qs[k] = e.target.value; render();
  });

}
function bandeau(vals, actif, fn){

  const mk = (lab, v) => {
    const b = el("button", "pill", esc(lab));
    b.setAttribute("aria-pressed", v === actif ? "true" : "false");

function avecCrayon(rangee, k, i){
