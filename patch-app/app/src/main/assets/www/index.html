  b.onclick = () => go({ v:"edit", k, i:null });
  return b;
}

/* ------------------------- la fiche : ajout, édition, retrait ------------- */
function vEdit(k, i){
  const def = INV[k];
  const neuf = i == null;
  const src = neuf ? {} : (def.liste[i] || {});
  const d = el("div");
  d.append(bar(neuf ? "Nouveau " + def.un : (src.nom || "Fiche"), null, () => go({ v:k })));

  const c = el("div", "card");
  c.innerHTML = `<h4>${neuf ? "Ajouter" : "Modifier"}</h4>`;
  CHAMPS[k].forEach(f => {
    const id = "ch-" + f.c;
    const val = src[f.c] == null ? "" : (f.t === "decimal" ? vg(src[f.c]) : String(src[f.c]));
    c.insertAdjacentHTML("beforeend",
      `<div class="f"><label for="${id}">${esc(f.l)}${f.req ? " *" : ""}</label>
        <input id="${id}" value="${esc(val)}" placeholder="${esc(f.ph)}" autocomplete="off"${
          f.liste ? ` list="dl-${f.c}"` : ""}${
          f.t ? ` inputmode="${f.t === "decimal" ? "decimal" : "numeric"}"` : ""}>${
        f.liste ? `<datalist id="dl-${f.c}">${
          f.liste().map(v => `<option value="${esc(v)}"></option>`).join("")}</datalist>` : ""}</div>`);
  });
  const err = el("p", "err");
  err.hidden = true;
  c.append(err);
  d.append(c);

  const fin = el("div", "fin");
  const ann = el("button", "ann", "Annuler");
  ann.onclick = () => go({ v:k });
  const val = el("button", "val", neuf ? "Ajouter" : "Enregistrer");
  val.onclick = () => {
    const o = {}, manque = [];
    CHAMPS[k].forEach(f => {
      const v = $("#ch-" + f.c, c).value.trim();
      if(!v){ if(f.req) manque.push(f.l); else o[f.c] = null; return; }
      if(f.t){
        const x = parseFloat(v.replace(",", ".").replace(/[^\d.\-]/g, ""));
        if(!isFinite(x)){ manque.push(f.l); return; }
        o[f.c] = f.t === "entier" ? Math.round(x) : x;
      } else o[f.c] = v;
    });
    if(manque.length){
      err.textContent = "À remplir : " + manque.join(", ") + ".";
      err.hidden = false;
      return;
    }
    const fiche = { ...src, ...o };
    if(k === "proj" && !neuf) renommerApp(cleApp(src), cleApp(fiche));
    if(neuf) def.liste.push(fiche); else def.liste[i] = fiche;
    sauverInv();
    go({ v:k });
  };
  fin.append(ann, val);
  d.append(fin);

  if(!neuf){
    /* Deux touches pour retirer une fiche : la première demande, la seconde
       exécute. Pas de boîte de dialogue — la WebView n'en veut pas. */
    const sup = el("button", "sup-tot", "Retirer de l'inventaire");
    sup.onclick = () => {
      if(sup.dataset.sur !== "1"){
        sup.dataset.sur = "1";
        sup.textContent = "Confirmer le retrait de « " + (src.nom || "cette fiche") + " »";
        return;
      }
      if(k === "proj") oublierApp(cleApp(src));
      def.liste.splice(i, 1);
      sauverInv();
      go({ v:k });
    };
    d.append(sup);
  }
  return d;
}

/* ------------------------------ le modèle -------------------------------- */
/* Un patch : ses lignes d'appareils, le circuit de chacun, la plage de
   gradateurs avec leurs circuits et repères, et les réglages du flux. */
const REG_DEFAUT = { proto:"sACN", u:1, adr:1, premier:1, nb:96, prio:100,
                     cible:"", pas:5, solo:true, hlTout:false };

function patchVide(nom){
  return { nom:nom || "", lignes:[], fiches:{}, grada:{}, reperes:{},
           reg:{ ...REG_DEFAUT }, exclus:[] };
}

let PATCHS = [], iPatch = 0, P = null;

/* Reprise de l'ancien format : le patch et la feuille de gradateurs vivaient
   dans deux clés séparées, et le circuit y était écrit deux fois. On en fait un
   premier spectacle, sans rien perdre — les anciennes clés restent en place,
   au cas où il faudrait revenir en arrière. */
function reprendreAncien(){
  const vieuxPatch = lireLocal(CLE_PATCH_V1, null);
  const vieuxGrada = lireLocal(CLE_GRADA_V1, null);
  if(!vieuxPatch && !vieuxGrada) return null;

  const p = patchVide((vieuxPatch && vieuxPatch.nom) || "Patch repris");
  if(vieuxPatch && Array.isArray(vieuxPatch.lignes)){
    p.lignes = vieuxPatch.lignes;
    /* Les circuits étaient rangés par « ligne:rang » ; ils le sont désormais
       par numéro d'appareil, qui est ce que la liste affiche. */
    const liste = adresser(p.lignes);
    liste.forEach(x => {
      const f = (vieuxPatch.fiches || {})[x.ligne + ":" + x.i];
      if(f && String(f.circuit || "").trim()) p.fiches[x.n] = String(f.circuit).trim();
    });
  }
  if(vieuxGrada){
    ["proto", "u", "adr", "premier", "nb", "prio", "cible", "pas", "solo"].forEach(k => {
      if(vieuxGrada[k] !== undefined) p.reg[k] = vieuxGrada[k];
    });
    Object.keys(vieuxGrada.fiches || {}).forEach(n => {
      const f = vieuxGrada.fiches[n];
      if(f && (f.circuit || f.note)) p.grada[n] = { circuit:f.circuit || "", note:f.note || "" };
    });
  }
  return p;
}

function chargerPatchs(){
  const d = lireLocal(CLE_PATCHS, null);
  if(d && Array.isArray(d.p) && d.p.length){
    PATCHS = d.p.map(p => ({ ...patchVide(), ...p, reg:{ ...REG_DEFAUT, ...(p.reg || {}) } }));
    iPatch = Math.min(Math.max(0, d.i || 0), PATCHS.length - 1);
  } else {
    const repris = reprendreAncien();
    PATCHS = [repris || patchVide("Patch")];
    iPatch = 0;
  }
  P = PATCHS[iPatch];
}
chargerPatchs();

let minuteriePatchs = null;
function sauverPatchs(){
  clearTimeout(minuteriePatchs);
  /* L'écriture est reportée : elle ne suit pas la frappe touche à touche. */
  minuteriePatchs = setTimeout(() => ecrireLocal(CLE_PATCHS, { i:iPatch, p:PATCHS }), 300);
}

/* ------------------------------- calculs --------------------------------- */
/* Chaîne les adresses : un appareil ne chevauche jamais deux univers. */
function adresser(lignes){
  const out = [];
  let u = 1, ch = 1, n = 0;
  lignes.forEach(l => {
    if(!l.suite){ u = Math.max(1, l.u || 1); ch = Math.min(512, Math.max(1, l.adr || 1)); }
    const foot = Math.min(512, Math.max(1, l.ch || 1));
    for(let i = 0; i < Math.max(0, l.nb || 0); i++){
      if(ch + foot - 1 > 512){ u++; ch = 1; }
      n++;
      out.push({ n, ligne:l.id, i, app:l.app, mode:l.mode, ch:foot, u, adr:ch, fin:ch + foot - 1 });
      ch += foot;
    }
  });
  return out;
}

/* Deux appareils qui se marchent dessus dans le même univers. */
function collisions(liste){
  const occ = new Map(), ko = new Set();
  liste.forEach(x => {
    for(let c = x.adr; c <= x.fin; c++){
      const k = x.u + ":" + c;
      if(occ.has(k)){ ko.add(x.n); ko.add(occ.get(k)); }
      else occ.set(k, x.n);
    }
  });
  return ko;
}

/* Les appareils qui mordent sur celui-ci : même univers, plages qui se croisent. */
function chevauchants(n){
  const liste = appareils();
  const x = liste.find(y => y.n === n);
  if(!x) return [];
  return liste.filter(y => y.n !== n && y.u === x.u && y.adr <= x.fin && y.fin >= x.adr)
              .map(y => y.n);
}

/* La première adresse où un appareil de `foot` canaux tient sans croiser ni un
   autre appareil ni un gradateur de la feuille. C'est ce qu'on propose quand on
   ajoute une ligne : se chaîner à l'aveugle posait les nouveaux appareils sur
   des adresses déjà occupées. */
function premiereLibre(foot, liste){
  const f = Math.min(512, Math.max(1, foot || 1));
  const pris = new Set();
  let uMax = 1;
  const prendre = (u, c) => { pris.add(u + ":" + c); uMax = Math.max(uMax, u); };
  (liste || []).forEach(x => { for(let c = x.adr; c <= x.fin; c++) prendre(x.u, c); });
  gradas().forEach(n => { const a = adrGrada(n); if(a) prendre(a.u, a.canal); });
  for(let u = 1; u <= uMax + 1; u++){
    let a = 1;
    while(a + f - 1 <= 512){
      let bute = 0;
      for(let c = a; c <= a + f - 1; c++) if(pris.has(u + ":" + c)) bute = c;
      if(!bute) return { u, adr:a };
      a = bute + 1;
    }
  }
  return { u:uMax + 1, adr:1 };
}

let nLigne = 0;
const idLigne = () => "l" + Date.now().toString(36) + (nLigne++).toString(36);

/* Épingler la ligne d'après là où elle se trouve : toucher à une ligne ne doit
   pas emmener tout le reste du patch avec elle. Ce qui suit reste en place ;
   s'il y a chevauchement, la fiche et le tableau le disent. */
function figerSuivante(l, liste){
  const k = P.lignes.findIndex(y => y.id === l.id);
  const sv = P.lignes[k + 1];
  if(!sv || !sv.suite) return;
  const y = (liste || []).find(z => z.ligne === sv.id);
  if(y){ sv.suite = false; sv.u = y.u; sv.adr = y.adr; }
}

/* Un appareil pris seul dans sa ligne : si la ligne en porte plusieurs, elle se
   scinde en trois — ce qui précède, lui, ce qui suit. L'ordre ne change pas,
   donc ni les numéros d'appareil ni les circuits qui y sont attachés ne
   bougent. */
function isolerAppareil(x){
  const liste = appareils();
  const k = P.lignes.findIndex(y => y.id === x.ligne);
  if(k < 0) return null;
  const l = P.lignes[k];
  const nb = Math.max(1, l.nb || 1);
  figerSuivante(l, liste);
  if(nb <= 1) return l;

  const avant = x.i, apres = nb - x.i - 1;
  const seul = { ...l, id:idLigne(), nb:1, suite:avant > 0 ? true : l.suite };
  const suivants = apres ? { ...l, id:idLigne(), nb:apres, suite:true } : null;
  const rmp = [];
  if(avant) rmp.push({ ...l, nb:avant });
  rmp.push(seul);
  if(suivants) rmp.push(suivants);
  P.lignes.splice(k, 1, ...rmp);
  /* Les exemplaires d'après gardent leur adresse du moment, eux aussi. */
  if(suivants){
    const y = liste.find(z => z.n === x.n + 1);
    if(y){ suivants.suite = false; suivants.u = y.u; suivants.adr = y.adr; }
  }
  return seul;
}

/* Changer le type ou le mode d'un seul appareil, sans toucher aux autres
   exemplaires de sa ligne. */
function changerAppareil(x, maj){
  const l = isolerAppareil(x);
  if(!l) return;
  l.app = maj.app;
  l.mode = maj.mode || "";
  l.ch = Math.min(512, Math.max(1, maj.ch || 1));
}

/* Poser cet appareil à l'adresse demandée, sans emmener ses voisins : sa ligne
   se scinde, celles qui suivent restent où elles sont. */
function placerAppareil(x, u, adr){
  const l = isolerAppareil(x);
  if(!l) return;
  l.suite = false;
  l.u = Math.max(1, Math.min(63999, u || 1));
  l.adr = Math.max(1, Math.min(512, adr || 1));
}

/* Poser cet appareil à la première adresse qui ne gêne personne. */
function placerAppareilLibre(x){
  const l = isolerAppareil(x);
  if(!l) return;
  const libre = premiereLibre(l.ch, appareils().filter(y => y.n !== x.n));
  l.suite = false; l.u = libre.u; l.adr = libre.adr;
}

const appareils = () => adresser(P.lignes);
const exclu = n => P.exclus.includes(n);
/* Les gradateurs de la feuille : la plage, moins ceux qu'on a retirés. */
function gradas(){
  const out = [];
  for(let n = P.reg.premier; n < P.reg.premier + P.reg.nb; n++) if(!exclu(n)) out.push(n);
  return out;
}
const ficheGrada = n => P.grada[n] || (P.grada[n] = { circuit:"", note:"" });
const circuitGrada = n => String((P.grada[n] || {}).circuit || "").trim();
const noteGrada = n => String((P.grada[n] || {}).note || "");
const circuitApp = n => String(P.fiches[n] || "").trim();
const restantsG = () => gradas().filter(n => !circuitGrada(n)).length;
const relevesG = () => gradas().filter(n => circuitGrada(n)).length;
const restantsA = () => appareils().filter(x => !circuitApp(x.n)).length;

/* Adresse DMX d'un gradateur : celle du premier, décalée d'un rang par
   gradateur, et l'univers suivant dès qu'on dépasse 512. */
function adrGrada(n){
  const i = (P.reg.adr - 1) + (n - P.reg.premier);
  if(i < 0) return null;
  return { u:P.reg.u + Math.floor(i / 512), canal:(i % 512) + 1 };
}

/* Ce que porte un circuit : ses gradateurs d'un côté, ses appareils de
   l'autre. Le lien entre les deux, c'est le numéro de circuit et rien d'autre —
   c'est toute la différence avec les deux feuilles d'avant. */
function parCircuit(){
  const m = new Map();
  const c = k => m.get(k) || m.set(k, { circuit:k, gradas:[], apps:[] }).get(k);
  gradas().forEach(n => { const x = circuitGrada(n); if(x) c(x).gradas.push(n); });
  appareils().forEach(a => { const x = circuitApp(a.n); if(x) c(x).apps.push(a); });
  return [...m.values()].sort((a, b) =>
    (parseInt(a.circuit, 10) || 0) - (parseInt(b.circuit, 10) || 0)
    || a.circuit.localeCompare(b.circuit));
}

function courtNom(nomComplet){
  const p = PROJECTEURS.find(x => cleApp(x) === nomComplet);
  return p ? p.nom : nomComplet;
}

function puissanceTotale(liste){
  let w = 0, sur = false;
  liste.forEach(x => {
    const p = PROJECTEURS.find(y => cleApp(y) === x.app);
    if(!p){ sur = true; return; }
    const m = String(p.w).replace(",", ".").match(/([\d.]+)\s*(k?)/i);
    if(!m){ sur = true; return; }
    w += parseFloat(m[1]) * (m[2] ? 1000 : 1);
  });
  if(!liste.length) return "—";
  return (w >= 1000 ? (w / 1000).toFixed(1).replace(".", ",") + " kW" : Math.round(w) + " W")
       + (sur ? "*" : "");
}

/* ------------------------------- émission -------------------------------- */
/* L'émission est tenue, pas envoyée une fois : le natif répète les trames à
   30 Hz tant qu'elles sont posées. Quitter l'écran relâche. */
let NIV = {};        // n° de gradateur → niveau en %, le temps de la session
let SEL = 0;         // gradateur tenu par la télécommande
let HL = null;       // appareil en évidence : { n, u, adr, fin, ch, nom }
/* La télécommande DMX tient des canaux, pas des gradateurs : « univers:canal »
   → niveau de 0 à 255. Un canal relâché reste dans la table à zéro, sinon son
   univers sortirait de la trame et le récepteur garderait la dernière valeur
   reçue. */
let DMX = {};
const adressesTenues = () => Object.keys(DMX).filter(k => DMX[k] > 0);

function envoyer(){
  const t = {};
  const poser512 = u => (t[u] = t[u] || new Array(512).fill(0));
  Object.keys(NIV).forEach(k => {
    const pct = NIV[k] | 0;
    if(pct <= 0) return;
    const a = adrGrada(+k);
    if(a) poser512(a.u)[a.canal - 1] = Math.round(pct * 255 / 100);
  });
  if(HL){
    /* Mettre un appareil en évidence : son premier canal à fond, ce qui suffit
       à la plupart des projecteurs dont le canal 1 est l'intensité. « Tous les
       canaux » existe dans sa fiche pour les autres — c'est plus brutal, une
       lyre y répondra en ouvrant tout ce qu'elle a. */
    const trame = poser512(HL.u);
    const fin = P.reg.hlTout ? HL.fin : HL.adr;
    for(let c = HL.adr; c <= fin && c <= 512; c++) trame[c - 1] = 255;
  }
  /* La télécommande DMX écrit dans l'univers en clair. Là où elle croise un
     gradateur de la feuille, c'est le plus haut des deux qui sort — un pupitre
     ne fait pas autrement. Un canal à zéro pose quand même son univers : c'est
     ce qui le fait retomber. */
  Object.keys(DMX).forEach(k => {
    const [u, canal] = k.split(":").map(Number);
    const trame = poser512(u);
    const v = DMX[k] | 0;
    if(canal >= 1 && canal <= 512 && v > trame[canal - 1]) trame[canal - 1] = v;
  });
  /* L'univers du gradateur appelé part même à zéro : il faut bien qu'il
     retombe quand on l'éteint. */
  const a = SEL ? adrGrada(SEL) : null;
  if(a) poser512(a.u);
  NET.emission(t, P.reg.proto, P.reg.prio, P.reg.cible);
}

function allumerSeuls(ns, pct = 100){
  if(P.reg.solo) NIV = {};
  ns.forEach(n => NIV[n] = pct);
  SEL = ns[0] || 0;
  envoyer();
}
function toutEteindre(){
  NIV = {}; SEL = 0; HL = null;
  Object.keys(DMX).forEach(k => DMX[k] = 0);
  NET.emission({}, P.reg.proto);
}

/* Ce que la feuille a posé à cette adresse. C'est tout l'intérêt d'avoir le
   patch et la télécommande au même endroit : le canal 137 n'est pas un numéro,
   c'est un gradateur ou un projecteur. */
function quiEstLa(u, canal){
  const g = gradas().find(n => { const a = adrGrada(n); return a && a.u === u && a.canal === canal; });
  if(g != null){
    const c = circuitGrada(g);
    return `Gradateur ${g} · ${c ? "circuit " + c : "circuit à relever"}`;
  }
  const x = appareils().find(y => y.u === u && y.adr <= canal && y.fin >= canal);
  if(x){
    const c = circuitApp(x.n);
    return `${courtNom(x.app)} n° ${x.n} · canal ${canal - x.adr + 1} sur ${x.ch}${
      c ? " · circuit " + c : ""}`;
  }
  return "rien de patché à cette adresse";
}

/* Où part vraiment le flux. Un compteur d'envois qui monte ne prouve rien : le
   sACN a besoin d'une interface à viser, et sans Wi-Fi il n'en a aucune. */
function routeEmission(etat){
  if(P.reg.cible) return "vers " + P.reg.cible;
  if(P.reg.proto !== "sACN") return "en diffusion sur le réseau";
  if(!etat.ip) return "en attente du Wi-Fi, rien ne part";
  if(etat.erreur) return "bloqué : " + etat.erreur;
  return "en multicast" + (etat.iface ? ", par " + etat.iface : "");
}

/* ------------------------------ l'écran ---------------------------------- */
let ONGLET = "tout";     // tout | app | grada — l'onglet survit aux rendus
let MASQUE = true;       // n'afficher que les gradateurs qui portent un circuit
let REPLIEE = false;     // télécommande réduite à une ligne
let VOLET = null;        // null | relever | dmx | ajouter | fiche | patchs
let CIBLE = null;        // élément ouvert dans la fiche : { t:"g"|"a", n }
let POINTE = null;       // gradateur repéré dans la liste
let PAVE = null;         // frappe du pavé numérique ; null = pavé fermé
let TU = 0;              // univers de l'adresse courante ; 0 = télécommande jamais ouverte
let TC = 1;              // canal de l'adresse courante
let DSEL = [];           // sélection de la télécommande DMX : des clés « u:c »
let DCMD = [];           // sa ligne de commande, en jetons : ["1","/","137","At","50"]
let DOUV = false;        // le dernier jeton est un nombre encore ouvert à la frappe
let INDICE = 0;          // rang du gradateur en cours de relevé
let fond = null, volet = null;

function vPatch(){
  const d = el("div", "pecr");
  d.innerHTML = `<div class="p-haut" id="p-haut"></div><div id="p-liste"></div>
    <div class="p-bas"><div class="in" id="p-bas"></div></div>`;
  /* Quitter l'écran relâche le flux et referme ce qui traîne : on ne laisse
     pas un gradateur allumé derrière soi. */
  poser(() => { fermerVolet(true); NET.emissionArret();
                NIV = {}; SEL = 0; HL = null; DMX = {}; DSEL = []; });
  setTimeout(() => {
    peindre();
    if(S.route.v === "tel" && !VOLET) ouvrirVolet("relever");
    if(S.route.v === "tcd" && !VOLET) ouvrirVolet("dmx");
  });
  return d;
}

function peindre(){
  const liste = appareils();

  /* En-tête : le nom du spectacle, la télécommande, les trois onglets. */
  const h = el("div");
  /* Le retour est un bouton à lui : dans le même, un appui à côté du
     pictogramme ouvrait le menu des patchs. */
  const rang = el("div", "p-entete");
  const bk = el("button", "bk", ic("back"));
  bk.setAttribute("aria-label", "Retour à l'accueil");
  bk.onclick = () => go({ v:"home" });
  const t = el("button", "p-titre");
  t.innerHTML = `<b>${esc(P.nom || "Sans titre")}</b><span class="ch">▾</span>
    <span class="n">${PATCHS.length} patch${PATCHS.length > 1 ? "s" : ""}</span>`;
  t.setAttribute("aria-label", "Changer de patch");
  t.onclick = () => ouvrirVolet("patchs");
  rang.append(bk, t);
  h.append(rang);
  h.append(barreTele());

  const o = el("div", "ongl");
  [["tout", "Tout", gradas().length + liste.length],
   ["app", "Appareils", restantsA()],
   ["grada", "Gradateurs", restantsG()]].forEach(([k, lib, n]) => {
    const b = el("button", null, `${lib}<em>${n}</em>`);
    b.setAttribute("aria-pressed", ONGLET === k);
    b.onclick = () => { ONGLET = k; peindre(); };
    o.append(b);
  });
  h.append(o);
  $("#p-haut").replaceChildren(h);

  majListe();

  /* Libellés courts : les onglets au-dessus disent déjà de quoi on parle, et
     « Relever gradateurs » se coupait en deux sur un téléphone. */
  const bg = el("button", null,
    `<span class="et">Relever</span><span class="cpt">${restantsG()}</span>`);
  bg.setAttribute("aria-label", "Relever les gradateurs");
  bg.setAttribute("aria-expanded", VOLET === "relever");
  bg.onclick = () => ouvrirVolet("relever");
  const ba = el("button", "dmx",
    `<span class="et">Ajouter</span><span class="cpt">${liste.length}</span>`);
  ba.setAttribute("aria-label", "Ajouter des appareils");
  ba.setAttribute("aria-expanded", VOLET === "ajouter");
  ba.onclick = () => ouvrirVolet("ajouter");
  const bp = el("button", "pdf", "PDF");
  bp.setAttribute("aria-label", "Imprimer la feuille ou l'enregistrer en PDF");
  bp.onclick = exporterFeuille;
  $("#p-bas").replaceChildren(bg, ba, bp);

  if(VOLET === "relever") majVoletRelever();
  if(VOLET === "dmx") majVoletDmx();
  if(VOLET === "ajouter") majVoletAjouter();
  if(VOLET === "fiche") majVoletFiche();
  if(VOLET === "patchs") majVoletPatchs();
  sauverPatchs();
}

/* La liste seule : elle se remet à jour derrière un volet ouvert sans que le
   champ en cours de frappe ne perde le curseur. */
function majListe(){
  const d = el("div");
  if(ONGLET === "tout" || ONGLET === "grada") d.append(pileGradas());
  if(ONGLET === "tout" || ONGLET === "app") d.append(pileApps());
  $("#p-liste").replaceChildren(d);
  sauverPatchs();
}

/* ------------------------- télécommande en barre -------------------------- */
function barreTele(){
  const d = el("div", "tl compact" + (REPLIEE ? " mini" : ""));
  const on = Object.keys(NIV).filter(k => NIV[k] > 0);
  const tenus = adressesTenues();
  const vivant = on.length || HL || tenus.length;
  const lv = SEL ? (NIV[SEL] || 0) : 0;
  const a = SEL ? adrGrada(SEL) : null;
  const cir = SEL ? circuitGrada(SEL) : "";
  const etat = a ? `U${a.u}·${a.canal}${cir ? " · circ. " + esc(cir) : ""}`
              : on.length ? `${on.length} allumé${on.length > 1 ? "s" : ""}` : "plateau noir";
  const chev = `<button class="chev" data-a="plier" aria-expanded="${!REPLIEE}"
      aria-label="${REPLIEE ? "Déplier la télécommande" : "Réduire la télécommande"}"
    >${REPLIEE ? "⌃" : "⌄"}</button>`;

  d.innerHTML = REPLIEE
    ? `<span class="led${vivant ? " on" : ""}"></span>
       <span class="ap"><b>${SEL || "—"}</b><span>${etat}</span></span>
       <span class="niv">${lv} %</span>
       <button data-a="noir">Noir</button>${chev}`
    : `<span class="led${vivant ? " on" : ""}"></span>
       <span class="ap"><b>${SEL || "—"}</b><span>${etat}</span></span>
       <input type="range" min="0" max="100" value="${lv}" aria-label="Niveau"${
         SEL ? "" : " disabled"}>
       <span class="niv">${lv} %</span>
       <button data-a="noir">Noir</button><button data-a="full">Full</button>
       <button data-a="prec" aria-label="Gradateur précédent">◀</button>
       <button data-a="suiv" aria-label="Gradateur suivant">▶</button>
       <button data-a="zero">Zéro</button>${chev}`;

  /* Le petit logo télécommande, en tête de la barre : il ouvre la vraie
     télécommande DMX. La barre appelle des gradateurs, elle passe par la plage
     du patch ; le logo mène à ce qui parle en univers et en canaux. */
  const lgo = el("button", "lgo" + (tenus.length ? " on" : ""), ic("remote"));
  lgo.dataset.a = "tcd";
  lgo.setAttribute("aria-label", tenus.length
    ? `Télécommande DMX — ${tenus.length} adresse${tenus.length > 1 ? "s tenues" : " tenue"}`
    : "Ouvrir la télécommande DMX");
  lgo.title = "Télécommande DMX";
  d.prepend(lgo);

  const niveau = pct => {
    if(!SEL) return;
    const v = Math.max(0, Math.min(100, Math.round(pct)));
    Object.keys(NIV).forEach(k => { if(NIV[k] > 0 || +k === SEL) NIV[k] = v; });
    envoyer(); peindre();
  };
  const gliss = d.querySelector("input");
  if(gliss) gliss.oninput = e => niveau(+e.target.value);
  const actes = {
    noir:() => niveau(0), full:() => niveau(100),
    prec:() => { allumerSeuls([Math.max(P.reg.premier, (SEL || P.reg.premier + 1) - 1)]); peindre(); },
    suiv:() => { allumerSeuls([Math.min(P.reg.premier + P.reg.nb - 1,
                                        (SEL || P.reg.premier - 1) + 1)]); peindre(); },
    zero:() => { toutEteindre(); peindre(); },
    tcd:() => ouvrirVolet("dmx"),
    plier:() => { REPLIEE = !REPLIEE; peindre(); }
  };
  d.querySelectorAll("button").forEach(b => {
    b.onclick = actes[b.dataset.a];
    if(b.dataset.a === "noir" && SEL && lv === 0) b.classList.add("on");
    if(b.dataset.a === "full" && lv === 100) b.classList.add("on");
  });

  if(HL){
    /* L'appareil en évidence se range dans la même barre que le gradateur
       appelé : c'est le même plateau qui s'allume. */
    const c = el("button", "hl", `◉ ${esc(HL.nom)} · U${HL.u}·${HL.adr}`);
    c.setAttribute("aria-label", "Éteindre l'appareil en évidence");
    c.onclick = () => { HL = null; envoyer(); peindre(); };
    d.append(c);
  }
  return d;
}

/* ---------------------------- rangées et piles ---------------------------- */
/* Un appareil et un gradateur se lisent pareil : badge, désignation, adresse
   DMX à droite, une action. La pastille édite, le corps de la rangée allume. */
function rangee({ badge, appareil, titre, sous, dmx, dmxHaut, action, actionEtat,
                  onAction, onRangee, allume }){
  const d = el("div", "rg" + (allume ? " on" : "") + (onRangee ? " cliquable" : ""));
  d.innerHTML = `<span class="bd${appareil ? " ap" : ""}">${esc(badge)}</span>
    <span class="tx"><b>${esc(titre)}</b><span>${esc(sous || "—")}</span></span>
    <span class="dm">${esc(dmxHaut || "")}<b>${esc(dmx || "")}</b></span>`;
  if(action){
    const b = el("button", "ac" + (actionEtat === "on" ? " on"
                                 : actionEtat === "vide" ? " vide" : ""), esc(action));
    b.onclick = e => { e.stopPropagation(); onAction(); };
    d.append(b);
  }
  if(onRangee) d.onclick = onRangee;
  return d;
}

function pile(titre, compte, elements, rien, bouton){
  const d = el("div", "pile");
  d.insertAdjacentHTML("beforeend", `<h4>${esc(titre)}<span>${esc(compte || "")}</span></h4>`);
  if(bouton) d.querySelector("h4").append(bouton);
  if(!elements.length) d.insertAdjacentHTML("beforeend", `<p class="rien">${esc(rien || "Rien ici.")}</p>`);
  elements.forEach(e => d.append(e));
  return d;
}

/* Deux cents gradateurs dans une liste, personne ne les lit : on n'affiche que
   ceux qui portent un circuit. Les autres vivent dans le relevé, et le bouton
   de l'en-tête les rend visibles le temps d'une vérification. */
function pileGradas(){
  const tous = gradas();
  const vus = MASQUE ? tous.filter(n => circuitGrada(n)) : tous;
  const caches = tous.length - vus.length;

  const rangs = vus.map(n => {
    const a = adrGrada(n) || { u:"—", canal:"—" };
    const c = circuitGrada(n), lv = NIV[n] || 0;
    const r = rangee({
      badge:"G",
      titre:"Gradateur " + n,
      sous:c ? `circuit ${c}${noteGrada(n) ? " · " + noteGrada(n) : ""}` : "circuit à relever",
      dmxHaut:`${P.reg.proto} · U${a.u}`, dmx:String(a.canal),
      action:lv > 0 ? lv + " %" : (c || "relever"),
      actionEtat:lv > 0 ? "on" : c ? "" : "vide",
      allume:lv > 0,
      onAction:() => c ? ouvrirVolet("fiche", { t:"g", n })
                       : ouvrirVolet("relever", tous.indexOf(n)),
      onRangee:() => {
        if(lv > 0){ NIV[n] = 0; envoyer(); } else allumerSeuls([n]);
        peindre();
      }
    });
    r.dataset.g = n;
    if(n === POINTE) r.classList.add("pointe");
    return r;
  });

  const b = el("button", null, MASQUE ? `tout voir · ${caches}` : "masquer les vides");
  b.onclick = () => { MASQUE = !MASQUE; peindre(); };
  return pile("Gradateurs", `${relevesG()} relevés / ${tous.length}`, rangs,
              "Aucun gradateur relevé : ouvrir « Relever gradateurs ».", b);
}

function pileApps(){
  const liste = appareils();
  const ko = collisions(liste);
  const rangs = liste.map(x => {
    const c = circuitApp(x.n);
    return rangee({
      badge:"P", appareil:true,
      titre:`${courtNom(x.app)} · n° ${x.n}`,
      sous:`${x.mode || x.ch + " ch"}${ko.has(x.n) ? " · chevauchement" : ""}`,
      dmxHaut:`U${x.u}`, dmx:String(x.adr),
      action:c || "circ ?", actionEtat:c ? "" : "vide",
      allume:!!(HL && HL.n === x.n),
      onAction:() => ouvrirVolet("fiche", { t:"a", n:x.n }),
      onRangee:() => evidence(x)
    });
  });
  return pile("Appareils", `${liste.length} · ${puissanceTotale(liste)}`, rangs,
              "Aucune ligne : ouvrir « Ajouter appareils ».");
}

/* Mettre un appareil en évidence : le geste des gradateurs, appliqué au patch. */
function evidence(x){
  HL = (HL && HL.n === x.n) ? null
     : { n:x.n, u:x.u, adr:x.adr, fin:x.fin, ch:x.ch, nom:courtNom(x.app) };
  envoyer(); peindre();
}

/* -------------------------------- volets ---------------------------------- */
function ouvrirVolet(quoi, arg){
  if(VOLET === quoi && arg == null){ fermerVolet(); return; }
  fermerVolet(true);
  VOLET = quoi; PAVE = null; DCMD = []; DOUV = false;
  if(quoi === "relever") INDICE = arg != null ? arg : (prochainVide() ?? 0);
  /* La télécommande DMX s'ouvre là où on en était : sur le gradateur appelé la
     première fois, sur l'univers du patch à défaut. */
  if(quoi === "dmx"){
    if(!TU){
      const a = SEL ? adrGrada(SEL) : null;
      TU = a ? a.u : P.reg.u; TC = a ? a.canal : 1;
    }
    if(!DSEL.length) DSEL = [cleAdr(TU, TC)];
  }
  if(quoi === "fiche") CIBLE = arg;
  fond = el("div", "p-fond");
  fond.onclick = () => fermerVolet();
  const classe = { relever:"rel", dmx:"tcd", ajouter:"add", fiche:"fic", patchs:"pat" }[quoi];
  volet = el("div", "p-volet " + classe);
  volet.setAttribute("role", "dialog");
  volet.innerHTML = `<div class="poignee"><span class="barre"></span></div>
    <div class="tete"><h3></h3><span class="cpt"></span>
      <button class="x" aria-label="Fermer">✕</button></div>
    <div class="corps"></div>`;
  volet.querySelector(".x").onclick = () => fermerVolet();
  volet.querySelector(".poignee").onclick = () => fermerVolet();
  document.body.append(fond, volet);
  requestAnimationFrame(() => { fond.classList.add("on"); volet.classList.add("on"); });
  /* Ouvrir le relevé, c'est déjà appeler le gradateur : il s'allume, la liste
     se déplace dessus et le volet s'ouvre sur lui. */
  if(quoi === "relever") allerA(INDICE);
  else peindre();
}

function fermerVolet(sansPeindre){
  if(!volet) return;
  const f = fond, v = volet;
  f.classList.remove("on"); v.classList.remove("on");
  setTimeout(() => { f.remove(); v.remove(); }, 200);
  fond = volet = null; VOLET = null; POINTE = null; CIBLE = null; PAVE = null;
  DCMD = []; DOUV = false;
  if(!sansPeindre) peindre();
}

/* ------------------- volet : relever les gradateurs ----------------------- */
const prochainVide = (depuis = 0) => {
  const l = gradas();
  for(let k = depuis; k < l.length; k++) if(!circuitGrada(l[k])) return k;
  return null;
};

function allerA(k, niveau = 100){
  const l = gradas();
  if(k == null || k < 0 || k >= l.length) return;
  INDICE = k;
  POINTE = l[k];
  allumerSeuls([l[k]], niveau);
  peindre();
  /* En haut de la liste, pas au centre : le volet couvre la moitié basse. */
  const r = $(`.rg[data-g="${POINTE}"]`);
  if(r) r.scrollIntoView({ block:"start",
    behavior:matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth" });
}

function majVoletRelever(){
  const l = gradas();
  const n = l[INDICE];
  const a = n ? adrGrada(n) : null;
  const f = n ? ficheGrada(n) : { circuit:"", note:"" };
  const lv = n ? (NIV[n] || 0) : 0;
  const faits = relevesG();

  volet.querySelector(".tete h3").textContent = "Relever les gradateurs";
  volet.querySelector(".tete .cpt").textContent = `${faits} / ${l.length} relevés`;
  const c = volet.querySelector(".corps");

  if(PAVE !== null){ c.replaceChildren(paveNumerique()); return; }

  const garde = document.activeElement && document.activeElement.classList.contains("cir");
  const pos = garde ? document.activeElement.selectionStart : null;

  const d = el("div");
  d.innerHTML = `<div class="avanc"><i style="width:${
      Math.round(faits / Math.max(1, l.length) * 100)}%"></i></div>
    <div class="ecr">
      <button class="n" aria-label="Appeler un gradateur par son numéro">${
        n || "—"}<small>changer</small></button>
      <span class="ad">${a ? `${esc(P.reg.proto)} · U${a.u} · canal ${a.canal}`
                           : "aucun gradateur"}</span>
      <input class="cir" data-focus="rel-cir" inputmode="numeric" placeholder="n° de circuit"
             value="${esc(f.circuit)}" aria-label="Circuit du gradateur ${n || ""}">
    </div>
    <input class="note" placeholder="repère — face jardin, contre 2…" value="${esc(f.note)}"
           aria-label="Repère">
    <div class="jauge"><input type="range" min="0" max="100" value="${lv}"
      aria-label="Niveau"><b>${lv} %</b></div>`;

  /* Le grand numéro est un bouton : il ouvre le pavé pour sauter à un
     gradateur précis, ce qu'on ne fait pas en défilant sur deux cents. */
  d.querySelector(".ecr .n").onclick = () => { PAVE = ""; majVoletRelever(); };
  const cir = d.querySelector(".cir");
  cir.oninput = () => { f.circuit = cir.value; majListe(); majCompteurs(); };
  cir.onkeydown = e => { if(e.key === "Enter") suivantARelever(); };
  d.querySelector(".note").oninput = e => { f.note = e.target.value; majListe(); };
  const j = d.querySelector(".jauge input");
  j.oninput = e => {
    if(!n) return;
    NIV[n] = +e.target.value; envoyer();
    d.querySelector(".jauge b").textContent = NIV[n] + " %";
    majListe(); majBarre();
  };

  const ok = el("button", "gros", "Noté — gradateur suivant ▶");
  ok.onclick = suivantARelever;
  d.append(ok);

  const r1 = el("div", "rang");
  const prec = el("button", "mini", "◀ précédent");
  const saut = el("button", "mini", "Sauter");
  const noir = el("button", "mini" + (lv === 0 ? " on" : ""), "Noir");
  prec.onclick = () => allerA(INDICE - 1);
  saut.onclick = () => allerA(prochainVide(INDICE + 1) ?? Math.min(l.length - 1, INDICE + 1));
  noir.onclick = () => { if(n){ NIV[n] = 0; envoyer(); peindre(); } };
  r1.append(prec, saut, noir);
  d.append(r1);

  const r2 = el("div", "rang");
  const plus = el("button", "mini", "+ un gradateur");
  const sup = el("button", "mini", "Supprimer");
  const fin = el("button", "mini", "Terminer");
  plus.onclick = () => { P.reg.nb++; allerA(gradas().length - 1); };
  sup.onclick = () => { if(n) supprimerGrada(n); };
  fin.onclick = () => { toutEteindre(); fermerVolet(); };
  r2.append(plus, sup, fin);
  d.append(r2);

  const etat = NET.emissionEtat();
  d.append(el("p", "route", esc(routeEmission(etat))));

  c.replaceChildren(d);
  if(garde){ cir.focus(); try { cir.setSelectionRange(pos, pos); } catch(e){ } }
}

/* Pavé numérique : taper le numéro du gradateur à appeler. Un numéro au-delà
   de la plage l'allonge, un numéro supprimé le fait revenir. La touche C
   reprend le dernier chiffre seulement : sur un numéro à trois chiffres, une
   faute de frappe ne doit pas coûter toute la frappe. */
function paveNumerique(){
  const d = el("div", "pave");
  d.innerHTML = `<div class="saisie${PAVE ? "" : " vide"}">${
    PAVE || "n° de gradateur"}</div><div class="touches"></div>`;
  const t = d.querySelector(".touches");
  ["1", "2", "3", "4", "5", "6", "7", "8", "9", "C", "0", "✓"].forEach(x => {
    const b = el("button", x === "✓" ? "acc" : null, x);
    if(x === "C") b.setAttribute("aria-label", "Effacer le dernier chiffre");
    b.onclick = () => {
      if(x === "C"){ PAVE = PAVE.slice(0, -1); majVoletRelever(); return; }
      if(x === "✓"){ validerPave(); return; }
      if(PAVE.length < 4) PAVE += x;
      majVoletRelever();
    };
    t.append(b);
  });
  const retour = el("button", "sec", "Retour");
  retour.style.gridColumn = "1 / -1";
  retour.onclick = () => { PAVE = null; majVoletRelever(); };
  t.append(retour);
  return d;
}

function validerPave(){
  const n = parseInt(PAVE, 10);
  PAVE = null;
  if(!n){ majVoletRelever(); return; }
  const vise = Math.max(P.reg.premier, n);
  if(vise > P.reg.premier + P.reg.nb - 1) P.reg.nb = vise - P.reg.premier + 1;
  P.exclus = P.exclus.filter(x => x !== vise);
  allerA(gradas().indexOf(vise));
}

/* « Noté » avance, toujours : le prochain gradateur sans circuit devant, sinon
   celui d'après, sinon on repart du début sur ceux qu'on a sautés. Appeler le
   dernier gradateur au pavé mettait fin au relevé alors que rien n'était
   relevé ; le volet ne se referme plus que lorsqu'il ne reste plus rien. */
function suivantARelever(){
  const l = gradas();
  const k = prochainVide(INDICE + 1);
  if(k != null){ allerA(k); return; }
  if(INDICE + 1 < l.length){ allerA(INDICE + 1); return; }
  const reprise = prochainVide(0);
  if(reprise != null && reprise !== INDICE){ allerA(reprise); return; }
  toutEteindre(); fermerVolet();
}

/* ------------------ volet : la télécommande DMX --------------------------- */
/* La barre du haut appelle des gradateurs : elle passe par la plage du patch et
   ne sait donc rien dire d'une adresse qui n'en fait pas partie. Celle-ci parle
   le DMX tout court — un univers, une adresse, une valeur — et tient ce qu'on
   lui pose.

   La frappe est celle d'un Eos : une ligne de commande qu'on remplit et qu'on
   termine. « 1/137 Thru 1/150 At 50 Enter ». C'est ce qu'a dans les doigts qui
   tient un pupitre ETC, et ça dit en quelques touches ce que des boutons
   demanderaient en dix. Ce qui manque par rapport au vrai tient à ce qu'on
   adresse ici : des sorties DMX, sans bibliothèque derrière — donc pas de
   circuits, pas de groupes, pas de palettes. */

/* Une adresse se range à plat : l'univers 2 canal 1 suit l'univers 1 canal 512.
   Les plages « Thru » traversent alors les univers sans cas particulier. */
const cleAdr = (u, c) => u + ":" + c;
const absAdr = (u, c) => (u - 1) * 512 + c;
const deAbs = n => ({ u:Math.floor((n - 1) / 512) + 1, c:((n - 1) % 512) + 1 });
const absCle = k => { const [u, c] = k.split(":").map(Number); return absAdr(u, c); };
const pcent = v => Math.round((v | 0) / 255 * 100);
const PAS_POURCENT = 10;     // le « +% » d'un Eos, réglable là-bas, fixé ici
const MAX_PLAGE = 512;       // une plage d'un coup : un univers, pas plus

const jetonNombre = x => /^\d+$/.test(x || "");

/* La frappe. Un nombre reste ouvert tant qu'une autre touche ne l'a pas fermé :
   c'est ce qui permet de taper 137 chiffre à chiffre sans le voir se découper. */
function tapeChiffre(x){
  const der = DCMD[DCMD.length - 1];
  if(DOUV && jetonNombre(der)){ if(der.length < 5) DCMD[DCMD.length - 1] = der + x; }
  else { DCMD.push(x); DOUV = true; }
  majVoletDmx();
}
function tapeJeton(x){ DCMD.push(x); DOUV = false; majVoletDmx(); }

/* « Clear » reprend un cran : le dernier chiffre d'un nombre en cours, sinon le
   dernier jeton, sinon la sélection elle-même. Sur un numéro à trois chiffres,
   une faute de frappe ne doit pas coûter toute la ligne. */
function effacerCommande(){
  const der = DCMD[DCMD.length - 1];
  if(DOUV && jetonNombre(der) && der.length > 1) DCMD[DCMD.length - 1] = der.slice(0, -1);
  else if(DCMD.length){ DCMD.pop(); DOUV = false; }
  else DSEL = TU ? [cleAdr(TU, TC)] : [];
  majVoletDmx();
}

/* Lire la ligne : des adresses à gauche, un niveau à droite du « At ». Ce qui ne
   se lit pas est ignoré plutôt que refusé — une ligne à moitié tapée ne doit pas
   coûter la frappe entière. */
function lireCommande(jetons){
  let i = 0;
  const lireAdresse = () => {
    if(!jetonNombre(jetons[i])) return null;
    let u = TU || 1, c = parseInt(jetons[i++], 10);
    if(jetons[i] === "/"){
      u = Math.max(1, Math.min(63999, c));
      i++;
      c = jetonNombre(jetons[i]) ? parseInt(jetons[i++], 10) : 1;
    }
    return { u, c:Math.max(1, Math.min(512, c)) };
  };

  const morceaux = [];
  let plus = true;
  while(i < jetons.length && jetons[i] !== "At"){
    const x = jetons[i];
    if(x === "+" || x === "-"){ plus = x === "+"; i++; continue; }
    const de = lireAdresse();
    if(!de){ i++; continue; }
    let a = null;
    if(jetons[i] === "Thru"){ i++; a = lireAdresse() || de; }
    morceaux.push({ plus, de, a });
    plus = true;
  }

  /* Une ligne qui commence par « + » ou « − » s'ajoute à la sélection en place,
     comme sur un pupitre ; une ligne qui commence par une adresse la remplace. */
  const enchaine = jetons[0] === "+" || jetons[0] === "-";
  let sel = (!morceaux.length || enchaine) ? DSEL.slice() : [];
  morceaux.forEach(m => {
    const x = absAdr(m.de.u, m.de.c), y = m.a ? absAdr(m.a.u, m.a.c) : x;
    const d = Math.min(x, y), f = Math.min(Math.max(x, y), Math.min(x, y) + MAX_PLAGE - 1);
    for(let n = d; n <= f; n++){
      const t = deAbs(n), k = cleAdr(t.u, t.c);
      if(m.plus){ if(!sel.includes(k)) sel.push(k); }
      else sel = sel.filter(z => z !== k);
    }
  });

  /* Le niveau se tape en pourcentage. Un seul chiffre vaut des dizaines, comme
     sur un Eos : « At 5 » fait 50 %, « At 05 » fait 5 %. */
  let niveau = null;
  if(jetons[i] === "At"){
    const x = jetons[i + 1];
    if(x === "Full") niveau = 255;
    else if(x === "Out") niveau = 0;
    else if(jetonNombre(x)){
      const pc = x.length === 1 ? parseInt(x, 10) * 10 : parseInt(x, 10);
      niveau = Math.round(Math.max(0, Math.min(100, pc)) * 255 / 100);
    }
  }
  return { sel, niveau };
}

/* « Enter » : la ligne se lit, se pose, et s'efface. */
function poserCommande(){
  const r = lireCommande(DCMD);
  DCMD = []; DOUV = false;
  if(r.sel.length){
    DSEL = r.sel.slice().sort((a, b) => absCle(a) - absCle(b));
    const t = deAbs(absCle(DSEL[0]));
    TU = t.u; TC = t.c;
  }
  if(r.niveau != null) DSEL.forEach(k => DMX[k] = r.niveau);
  envoyer(); majVoletDmx(); majBarre();
}

function niveauSelection(v){
  const n = Math.max(0, Math.min(255, Math.round(v)));
  DSEL.forEach(k => DMX[k] = n);
  envoyer();
}

function majVoletDmx(){
  const cle = cleAdr(TU, TC);
  const v = DMX[cle] | 0;
  const tenus = adressesTenues();
  const nsel = DSEL.length;
  volet.querySelector(".tete h3").textContent = "Télécommande DMX";
  volet.querySelector(".tete .cpt").textContent = tenus.length
    ? `${tenus.length} adresse${tenus.length > 1 ? "s tenues" : " tenue"}` : "plateau noir";
  const c = volet.querySelector(".corps");

  const an = artnet(TU), sa = sacn(TU);
  const d = el("div");
  d.innerHTML = `<div class="ecr">
      <span class="adr"><b>${TU}/${TC}</b>${
        nsel > 1 ? `<i>+ ${nsel - 1} adresse${nsel > 2 ? "s" : ""}</i>` : ""}</span>
      <span class="lv">${pcent(v)} %<small>${v} sur 255</small></span>
      <span class="oc">${esc(quiEstLa(TU, TC))}</span>
      <span class="ad">${esc(P.reg.proto)} · Art-Net ${an.net}.${an.sub}.${an.uni} · sACN ${esc(sa.ip)}</span>
    </div>
    <div class="jauge"><input type="range" min="0" max="255" value="${v}"
      aria-label="Niveau de la sélection"><b>${pcent(v)} %</b></div>`;

  const j = d.querySelector(".jauge input");
  j.oninput = e => {
    niveauSelection(+e.target.value);
    d.querySelector(".jauge b").textContent = pcent(DMX[cle]) + " %";
    d.querySelector(".ecr .lv").innerHTML =
      `${pcent(DMX[cle])} %<small>${DMX[cle] | 0} sur 255</small>`;
    majBarre();
  };
  /* Le glissement fini, le volet se refait : les adresses tenues ont changé. */
  j.onchange = () => majVoletDmx();

  d.append(ligneCommande(), clavierEos());

  const r1 = el("div", "rang");
  const moins = el("button", "mini", `− ${PAS_POURCENT} %`);
  const plus = el("button", "mini", `+ ${PAS_POURCENT} %`);
  const tout = el("button", "mini", "Tout relâcher");
  moins.onclick = () => bousculer(-1);
  plus.onclick = () => bousculer(1);
  tout.onclick = () => {
    Object.keys(DMX).forEach(k => DMX[k] = 0);
    envoyer(); majVoletDmx(); majBarre();
  };
  r1.append(moins, plus, tout);
  d.append(r1);

  const r2 = el("div", "rang2");
  const prec = el("button", "mini", "◀ adresse");
  const suiv = el("button", "mini", "adresse ▶");
  prec.onclick = () => allerAdresse(-1);
  suiv.onclick = () => allerAdresse(1);
  r2.append(prec, suiv);
  d.append(r2);

  if(tenus.length){
    d.append(el("h5", null, "Adresses tenues"));
    const liste = el("div", "tenus");
    tenus.slice().sort((a, b) => absCle(a) - absCle(b)).forEach(k => {
      const [u, canal] = k.split(":").map(Number);
      const b = el("button", DSEL.includes(k) ? "ici" : null,
                   `${u}/${canal} · ${pcent(DMX[k])} %`);
      b.setAttribute("aria-label", `Reprendre l'adresse ${canal} de l'univers ${u}`);
      b.onclick = () => { DSEL = [k]; TU = u; TC = canal; majVoletDmx(); };
      liste.append(b);
    });
    d.append(liste);
  }

  const etat = NET.emissionEtat();
  d.append(el("p", "route", esc(routeEmission(etat))));
  d.append(el("p", "aide", "La ligne de commande se tape comme sur un Eos : "
    + "« 1/137 At 50 Enter » pose l'adresse 137 de l'univers 1 à 50 %. Un nombre seul est "
    + "une adresse de l'univers en cours, « / » désigne l'univers, « Thru » une plage — "
    + "elle traverse les univers —, « + » et « − » ajoutent ou retirent de la sélection, et "
    + "une ligne qui commence par l'un des deux reprend la sélection en place. « At » attend "
    + "un pourcentage, un seul chiffre valant des dizaines : « At 5 » fait 50 %, « At 05 » "
    + "fait 5 %. « Full » et « Out » terminent la ligne tout seuls, « Clear » reprend un "
    + "cran, « Sneak » relâche la sélection. Ce qui manque par rapport au vrai pupitre tient "
    + "à ce qu'on adresse ici : des sorties DMX, donc ni circuits, ni groupes. Une adresse "
    + "reste tenue tant qu'elle n'est pas relâchée, et quitter l'écran relâche tout. Là où "
    + "une adresse croise un gradateur de la feuille, c'est le plus haut des deux niveaux "
    + "qui sort. Le protocole, la priorité et la destination sont ceux du patch."));
  const fin = el("button", "act", "Terminer");
  fin.onclick = () => fermerVolet();
  d.append(fin);

  c.replaceChildren(d);
}

/* Le coup de pouce d'un Eos : dix pour cent par appui, sur la sélection. */
function bousculer(sens){
  if(DCMD.length) poserCommande();
  const pas = Math.round(PAS_POURCENT * 255 / 100);
  DSEL.forEach(k => DMX[k] = Math.max(0, Math.min(255, (DMX[k] | 0) + sens * pas)));
  envoyer(); majVoletDmx(); majBarre();
}

/* Passer à l'adresse voisine, univers suivant compris. */
function allerAdresse(sens){
  const t = deAbs(Math.max(1, absAdr(TU, TC) + sens));
  TU = t.u; TC = t.c; DSEL = [cleAdr(TU, TC)];
  majVoletDmx();
}

/* La ligne de commande, telle qu'elle se lit : « 1/137 Thru 1/150 At 50 ». Le
   « / » colle aux nombres qui l'entourent, tout le reste s'espace. */
function ligneCommande(){
  let texte = "";
  DCMD.forEach((x, i) => {
    const colle = x === "/" || DCMD[i - 1] === "/";
    texte += (i === 0 || colle ? "" : " ") + x;
  });
  const d = el("div", "cmd" + (texte ? "" : " vide"));
  d.innerHTML = `<span class="ln">${esc(texte || "adresse · Thru · At · niveau")}</span>`;
  if(texte) d.append(el("i", "cur"));
  d.setAttribute("aria-live", "polite");
  d.setAttribute("aria-label", "Ligne de commande : " + (texte || "vide"));
  return d;
}

/* Le clavier d'un Eos, ramené à ce qu'une télécommande d'adresses demande :
   les chiffres, « / » pour l'univers, « Thru », « + », « − », « At », et les
   touches qui terminent la ligne d'elles-mêmes. */
function clavierEos(){
  const terminer = niveau => {
    if(!DCMD.includes("At")) DCMD.push("At");
    DCMD.push(niveau); DOUV = false;
    poserCommande();
  };
  /* « Sneak » rend la main : sur un pupitre il relâche le contrôle manuel, ici
     il relâche les adresses tenues — elles retombent et sortent de la liste. */
  const sneak = () => {
    if(DCMD.length) poserCommande();
    DSEL.forEach(k => DMX[k] = 0);
    envoyer(); majVoletDmx(); majBarre();
  };
  const actes = {
    Thru:() => tapeJeton("Thru"), At:() => tapeJeton("At"),
    "+":() => tapeJeton("+"), "−":() => tapeJeton("-"), "/":() => tapeJeton("/"),
    Clear:effacerCommande, Out:() => terminer("Out"), Full:() => terminer("Full"),
    Sneak:sneak, Enter:poserCommande
  };
  const aides = {
    Thru:"Thru, une plage d'adresses", At:"At, poser un niveau",
    "+":"Ajouter à la sélection", "−":"Retirer de la sélection",
    "/":"Séparer l'univers de l'adresse", Clear:"Reprendre un cran",
    Out:"À zéro", Full:"À fond", Sneak:"Relâcher la sélection",
    Enter:"Poser la ligne"
  };
  const d = el("div", "clav");
  d.setAttribute("role", "group");
  d.setAttribute("aria-label", "Clavier de la télécommande DMX");
  ["1", "2", "3", "Thru", "4", "5", "6", "At", "7", "8", "9", "+",
   "/", "0", "Clear", "−", "Out", "Full", "Sneak", "Enter"].forEach(x => {
    const chiffre = /^\d$/.test(x);
    const b = el("button", chiffre ? null : x === "Enter" ? "fn acc" : "fn", x);
    if(aides[x]) b.setAttribute("aria-label", aides[x]);
    b.onclick = chiffre ? () => tapeChiffre(x) : actes[x];
    d.append(b);
  });
  return d;
}

/* --------------------------- volet : la fiche ----------------------------- */

    d.querySelector(".rep").oninput = e => { f.note = e.target.value; majListe(); };

    const fin = el("button", "act sec", "Terminer");
    all.onclick = () => {

  } else {

    volet.querySelector(".tete h3").textContent = courtNom(x.app);
    volet.querySelector(".tete .cpt").textContent = `appareil ${x.n} · U${x.u} · ${x.adr}`;
    const modes = BIB[x.app] || [];

    /* L'adresse se choisit ici, appareil par appareil : la ligne se scinde comme
       pour un changement de mode, et les autres exemplaires gardent la leur. */
    const placer = (u, adr) => { placerAppareil(x, u, adr); peindre(); };
    d.querySelector(".au").onchange = e =>
      placer(+e.target.value.replace(/\D/g, "") || 1, x.adr);
    d.querySelector(".aa").onchange = e =>
      placer(x.u, +e.target.value.replace(/\D/g, "") || 1);

    /* Le type et le mode se changent ici, appareil par appareil : la ligne se
       scinde toute seule pour que les autres exemplaires restent ce qu'ils
       sont. */
    d.querySelector(".sa").onchange = e => {
      const app = e.target.value, m = BIB[app] || [];
      changerAppareil(x, { app, mode:m.length ? m[0].nom : "", ch:m.length ? m[0].ch : x.ch });
      peindre();
    };
    const sm = d.querySelector(".sm");
    if(modes.length) sm.onchange = e => {
      const m = modes.find(y => y.nom === e.target.value);
      changerAppareil(x, { app:x.app, mode:e.target.value, ch:m ? m.ch : x.ch });
      peindre();
    };
    else sm.onchange = e => {
      changerAppareil(x, { app:x.app, mode:x.mode,
                           ch:+e.target.value.replace(/\D/g, "") || 1 });
      peindre();
    };

    /* Changer de type change l'empreinte : on le dit tout de suite si l'appareil
       mord sur ses voisins, avec de quoi le décaler d'une touche. */
    const gene = chevauchants(x.n);
    if(gene.length){
      const av = el("div", "alert",
        `<b>Chevauchement</b> — cet appareil occupe U${x.u}·${x.adr}→${x.fin} et croise ${
          gene.length > 1 ? "les appareils" : "l'appareil"} ${gene.join(", ")}.`);
      const dec = el("button", "act sec", "Décaler à la première adresse libre");
      dec.onclick = () => { placerAppareilLibre(x); peindre(); };
      av.append(dec);
      d.append(av);
    }

    const r = el("div", "rang2");
    const all = el("button", "act" + (enHl ? "" : " sec"),
                   enHl ? "Éteindre" : "Mettre en évidence");
    const fin = el("button", "act sec", "Terminer");
    all.onclick = () => evidence(x);
    fin.onclick = () => fermerVolet();
    r.append(all, fin);
    d.append(r);

    const sup = el("button", "act sup", "Supprimer cet appareil");
    sup.onclick = () => supprimerAppareil(x);
    d.append(sup);
    d.append(el("p", "aide", "Par défaut, la mise en évidence envoie le premier canal "
      + "à fond — l'intensité, sur la plupart des appareils. Changer le type ou le mode "
      + "ne touche que cet appareil : les autres exemplaires de sa ligne gardent leur adresse, "
      + "quitte à ce que la nouvelle empreinte les chevauche. Retirer un appareil enlève un "
      + "exemplaire à sa ligne : les appareils suivants remontent d'un cran."));
  }

  c.replaceChildren(d);
  if(garde){ const i = d.querySelector(".cir");
    i.focus(); try { i.setSelectionRange(pos, pos); } catch(e){ } }
}

function supprimerGrada(n){
  if(!P.exclus.includes(n)) P.exclus.push(n);
  delete P.grada[n];
  delete NIV[n];
  if(SEL === n) SEL = 0;
  envoyer();
  if(VOLET === "relever"){
    INDICE = Math.min(INDICE, gradas().length - 1);
    if(gradas()[INDICE]) allerA(INDICE); else peindre();
  } else fermerVolet();
}

function supprimerAppareil(x){
  if(HL && HL.n === x.n){ HL = null; envoyer(); }
  const l = P.lignes.find(y => y.id === x.ligne);
  if(l){
    l.nb = Math.max(0, l.nb - 1);
    if(!l.nb) P.lignes = P.lignes.filter(y => y.id !== l.id);
  }
  /* Les circuits sont attachés au rang de l'appareil : ce qui suit remonte. */
  const suite = {};
  Object.keys(P.fiches).forEach(k => {
    const i = +k;
    if(i < x.n) suite[i] = P.fiches[k];
    else if(i > x.n) suite[i - 1] = P.fiches[k];
  });
  P.fiches = suite;
  fermerVolet();
}

              esc(p.nom)}</option>`).join("")}</optgroup>`).join("")}</select></span>
      <span class="cf c-mode"><i>${modes.length ? "mode" : "canaux par appareil"}</i>${modes.length
        ? `<select class="sm" aria-label="Mode">${modes.map(m =>

              esc(m.nom)} · ${m.ch} ch</option>`).join("")}</select>`
        : `<input class="sm in-ch" data-focus="${l.id}-ch" inputmode="numeric" value="${l.ch}"
                  aria-label="Empreinte en canaux">`}</span>
      <span class="cf c-qte"><i>quantité</i>
        <input class="qn" data-focus="${l.id}-nb" inputmode="numeric" value="${l.nb}"

      <span class="c-ua">
        <span class="cf"><i>univers</i>
          <input class="qu" data-focus="${l.id}-u" inputmode="numeric" value="${dep.u}"
                 aria-label="Univers de départ de la ligne"></span>
        <span class="cf"><i>1re adresse</i>
          <input class="qa" data-focus="${l.id}-adr" inputmode="numeric" value="${dep.adr}"

      <button class="x" aria-label="Retirer la ligne">✕</button>

        l.suite ? "à la suite" : "départ imposé"}
        <b>${mes.length ? `U${mes[0].u}·${mes[0].adr}→${mes[mes.length - 1].fin}` : "—"}</b></button>${
        enKo ? `<button class="lib" title="Reposer la ligne sur une plage libre">adresse libre</button>` : ""}</div>`;
    r.querySelector(".sa").onchange = e => {
      l.app = e.target.value;

      peindre();
    };
    const sm = r.querySelector(".sm");
    if(modes.length) sm.onchange = e => {
      l.mode = e.target.value;
      const m = modes.find(x => x.nom === l.mode);
      if(m) l.ch = m.ch;
      peindre();
    };
    else sm.onchange = e => { l.ch = Math.max(1, +e.target.value.replace(/\D/g, "") || 1); peindre(); };
    r.querySelector(".qn").onchange = e => {
      l.nb = Math.min(500, +e.target.value.replace(/\D/g, "") || 0); peindre(); };
    /* Écrire un univers ou une adresse impose le départ de la ligne : c'était
       jusqu'ici le seul réglage qu'on ne pouvait pas choisir — la ligne se posait
       où l'application voulait bien. */
    const imposer = (u, adr) => {
      figerSuivante(l, liste);
      l.suite = false;
      l.u = Math.max(1, Math.min(63999, u || 1));
      l.adr = Math.max(1, Math.min(512, adr || 1));

    r.querySelector(".qu").onchange = e =>

  const univ = [...new Set(liste.map(x => x.u))];
  if(univ.length){
    const res = el("div", "kvs");
    res.innerHTML = univ.map(u => {
      const a = artnet(u), sa = sacn(u);
      return `<div class="kv"><span>U${u}</span><b>${a.net}.${a.sub}.${a.uni} · ${sa.ip}</b></div>`;
    }).join("");
    d.append(res);
  }
  d.append(el("p", "aide", "Les modes viennent de la bibliothèque : la fiche d'un appareil "
    + "permet de les saisir à la main ou de les importer d'un fichier GDTF. Une ligne neuve "
    + "arrive sur la première adresse libre ; « départ imposé » la fixe là où elle est, "
    + "« à la suite » la chaîne sur la ligne d'avant."));
  const fin = el("button", "act", "Terminer");
  fin.onclick = () => fermerVolet();
  d.append(fin);
  c.replaceChildren(d);
}

/* Chaque spectacle a son patch : on en ouvre un, on en crée un, on duplique
   celui de la reprise. Changer de patch éteint le plateau — on ne laisse pas
   une lampe allumée d'un spectacle à l'autre. */
function majVoletPatchs(){
  volet.querySelector(".tete h3").textContent = "Patchs";
  volet.querySelector(".tete .cpt").textContent =
    `${PATCHS.length} spectacle${PATCHS.length > 1 ? "s" : ""}`;

  const garde = document.activeElement && document.activeElement.classList.contains("nom");
  const pos = garde ? document.activeElement.selectionStart : null;

  const d = el("div");
  const f = el("div", "f");
  f.innerHTML = `<label>Nom du patch en cours</label>
    <input class="nom" data-focus="pat-nom" value="${esc(P.nom)}"
           placeholder="Création, série 2026…" aria-label="Nom du patch en cours">`;
  f.querySelector("input").oninput = e => {
    P.nom = e.target.value;
    const t = $(".p-titre b");
    if(t) t.textContent = P.nom || "Sans titre";
    const l = volet.querySelector(".p.ici b");
    if(l) l.textContent = P.nom || "Sans titre";
    sauverPatchs();
  };
  d.append(f);

  /* Les réglages du flux appartiennent au patch : une reprise dans une autre
     salle, c'est un autre univers et un autre nombre de gradateurs. */
  const pl = el("div", "plage");
  pl.innerHTML = `<div class="f"><label>Protocole</label>
      <select class="r-proto"><option${P.reg.proto === "sACN" ? " selected" : ""}>sACN</option>
        <option${P.reg.proto === "Art-Net" ? " selected" : ""}>Art-Net</option></select></div>
    <div class="f"><label>Univers</label>
      <input class="r-u" data-focus="r-u" inputmode="numeric" value="${P.reg.u}"></div>
    <div class="f"><label>1re adresse</label>
      <input class="r-a" data-focus="r-a" inputmode="numeric" value="${P.reg.adr}"></div>
    <div class="f"><label>1er n°</label>
      <input class="r-p" data-focus="r-p" inputmode="numeric" value="${P.reg.premier}"></div>
    <div class="f"><label>Nb de gradateurs</label>
      <input class="r-n" data-focus="r-n" inputmode="numeric" value="${P.reg.nb}"></div>
    <div class="f"><label>Priorité sACN</label>
      <input class="r-prio" data-focus="r-prio" inputmode="numeric" value="${P.reg.prio}"></div>
    <div class="f dest"><label>Destination</label>
      <input class="r-cible" data-focus="r-cible" inputmode="url" value="${esc(P.reg.cible)}"
             placeholder="multicast"></div>`;
  const nbre = (v, min, max, d0) => {
    const x = parseInt(String(v).replace(/\D/g, ""), 10);
    return isNaN(x) ? d0 : Math.max(min, Math.min(max, x));
  };
  pl.querySelector(".r-proto").onchange = e => { P.reg.proto = e.target.value; envoyer(); peindre(); };
  pl.querySelector(".r-u").onchange = e => { P.reg.u = nbre(e.target.value, 1, 63999, 1); peindre(); };
  pl.querySelector(".r-a").onchange = e => { P.reg.adr = nbre(e.target.value, 1, 512, 1); peindre(); };
  pl.querySelector(".r-p").onchange = e => { P.reg.premier = nbre(e.target.value, 1, 9999, 1); peindre(); };
  pl.querySelector(".r-n").onchange = e => { P.reg.nb = nbre(e.target.value, 1, 999, 96); peindre(); };
  pl.querySelector(".r-prio").onchange = e => { P.reg.prio = nbre(e.target.value, 1, 200, 100); envoyer(); };
  pl.querySelector(".r-cible").onchange = e => { P.reg.cible = e.target.value.trim(); envoyer(); };
  d.append(pl);
  d.insertAdjacentHTML("beforeend", `<p class="aide">Sans destination, sACN part en multicast
    et Art-Net en diffusion — le cas normal. Une adresse IP force l'envoi vers ce seul nœud.</p>`);

  d.insertAdjacentHTML("beforeend", `<h5>Les patchs</h5>`);
  const z = el("div", "liste2");
  PATCHS.forEach((p, i) => {
    const l = adresser(p.lignes);
    const rel = Object.keys(p.grada || {})
      .filter(n => String((p.grada[n] || {}).circuit || "").trim()).length;
    const r = el("div", "p" + (i === iPatch ? " ici" : ""));
    r.innerHTML = `<span><b>${esc(p.nom || "Sans titre")}</b>
      <span>${l.length} appareils · ${rel} circuits relevés · ${p.reg.nb} gradateurs</span></span>`;
    const ouv = el("button", "ouv", i === iPatch ? "en cours" : "ouvrir");
    ouv.onclick = () => { if(i !== iPatch) chargerPatch(i); };
    const sup = el("button", "sup", "✕");
    sup.setAttribute("aria-label", "Supprimer le patch " + (p.nom || "sans titre"));
    sup.onclick = () => supprimerPatch(i);
    r.append(ouv, sup);
    z.append(r);
  });
  d.append(z);

  const rang = el("div", "rang2");
  const neuf = el("button", "act", "+ Nouveau patch");
  const dupl = el("button", "act sec", "Dupliquer celui-ci");
  neuf.onclick = () => {
    PATCHS.push(patchVide("Nouveau patch " + (PATCHS.length + 1)));
    chargerPatch(PATCHS.length - 1);
  };
  dupl.onclick = () => {
    const copie = JSON.parse(JSON.stringify(P));
    copie.nom = (P.nom || "Sans titre") + " (copie)";
    PATCHS.push(copie);
    chargerPatch(PATCHS.length - 1);
  };
  rang.append(neuf, dupl);
  d.append(rang);

  c.replaceChildren(d);
  if(garde){ const i = d.querySelector(".nom");
    i.focus(); try { i.setSelectionRange(pos, pos); } catch(e){ } }
}

function chargerPatch(i){
  toutEteindre();
  iPatch = i; P = PATCHS[i];
  ONGLET = "tout"; MASQUE = true;
  NET.emissionArret();
  sauverPatchs();
  fermerVolet();
}

function supprimerPatch(i){
  if(PATCHS.length === 1){
    alert("C'est le dernier patch : en créer un autre avant de supprimer celui-ci.");
    return;
  }
  if(!confirm("Supprimer le patch « " + (PATCHS[i].nom || "sans titre") + " » ?")) return;
  PATCHS.splice(i, 1);
  if(i === iPatch) chargerPatch(0);
  else { if(i < iPatch) iPatch--; sauverPatchs(); peindre(); }
}

<div class="recap">${univ.length ? univ.map(u => {

<footer>${gradas().length - releves.length} gradateurs sans circuit ne figurent pas dans le

    + " renseignée à l'inventaire." : ""}</footer>
</body></html>`;

  if(NET.imprimer(html, "feuille")) return;
  /* Repli navigateur : impression par cadre masqué. */
  const cadre = document.createElement("iframe");
  cadre.style.cssText = "position:fixed;right:0;bottom:0;width:0;height:0;border:0";

  cadre.onload = () => {
    try { cadre.contentWindow.focus(); cadre.contentWindow.print(); } catch(e){ }
    setTimeout(() => cadre.remove(), 2000);
  };

          <b>${(n.ports || []).map(p => "U" + p.univers).join(" · ") || "—"}</b></div>`;
      noeuds.append(c);
    });

  return d;
}

/* Testeur d'adresse : émet une trame Art-Net sur un canal, sans console. */
function testeur(){
  const c = el("div", "card");
  c.innerHTML = `<h4>Testeur d'adresse</h4>
    <p class="muted" style="margin:0 0 12px">Émet une trame Art-Net en diffusion. À utiliser quand la console est éteinte.</p>
    <div class="ff">
      <div class="f"><label for="t-u">Univers</label><input id="t-u" type="number" min="1" value="1"></div>
      <div class="f"><label for="t-c">Canal</label><input id="t-c" type="number" min="1" max="512" value="1"></div>
    </div>
    <div class="f"><label for="t-n">Niveau — <span id="t-v">255</span></label>
      <input id="t-n" type="range" min="0" max="255" value="255"></div>
    <div class="ff">
      <button class="pill" id="t-go" style="padding:12px">Envoyer</button>
      <button class="pill" id="t-off" style="padding:12px">Tout à zéro</button>
    </div>`;
  const trame = (canal, niveau) => {
    const n = new Array(512).fill(0);
    if(canal >= 1 && canal <= 512) n[canal - 1] = niveau;
    return n;
  };
  setTimeout(() => {
    const maj = () => $("#t-v", c).textContent = $("#t-n", c).value;
    $("#t-n", c).addEventListener("input", maj);
    $("#t-go", c).onclick = () => NET.emettre(+$("#t-u", c).value,
      trame(+$("#t-c", c).value, +$("#t-n", c).value));
    $("#t-off", c).onclick = () => NET.emettre(+$("#t-u", c).value, new Array(512).fill(0));
  });
  return c;
}

/* ----------------------------- mise à jour ------------------------------ */
/* L'application se compare à la version publiée dans la release du dépôt. Le
   natif vérifie tout seul au lancement et télécharge dans la foulée ; il reste
   un geste, l'écran d'installation d'Android, qu'aucune application hors
   magasin n'a le droit de sauter. Deux endroits affichent le même état — le
   bandeau d'accueil et cet écran — et aucun des deux n'est forcément là. */
const MAJ = { e:null };
const PHASES_BANDEAU = ["disponible", "telechargement", "pret", "autorisation"];

function ko(o){ return o >= 1048576 ? (o / 1048576).toFixed(1).replace(".", ",") + " Mo"
                                    : Math.round(o / 1024) + " ko"; }
function nomVer(e){ return e.nomPublie || ("version " + e.publie); }
/* Une version construite depuis une branche de travail arrive sur le téléphone
   comme les autres : autant que le bandeau le dise. */
function branche(e){ return e.branche && e.branche !== "main" ? " Branche " + esc(e.branche) + "." : ""; }
function jour(iso){ const j = iso.slice(0, 10).split("-"); return j.length === 3 ? j[2] + "/" + j[1] + "/" + j[0] : iso; }

function bandeauMaj(e){
  if(e.phase === "telechargement"){
    const pc = e.taille ? Math.min(100, Math.round(e.recus / e.taille * 100)) : 0;
    return `<div class="maj"><div class="g"><b>Téléchargement de ${esc(nomVer(e))}</b>
      <span>${ko(e.recus)}${e.taille ? " sur " + ko(e.taille) : ""}</span>
      <div class="jauge"><div style="width:${pc}%"></div></div></div></div>`;
  }
  if(e.phase === "pret")
    return `<div class="maj"><div class="g"><b>${esc(nomVer(e))} prête</b>
      <span>Android demandera de confirmer l'installation.${branche(e)}</span></div>
      <button data-maj="installer">Installer</button></div>`;
  if(e.phase === "autorisation")
    return `<div class="maj"><div class="g"><b>Une autorisation à donner</b>
      <span>Autoriser Patch à installer des applications, puis revenir ici.</span></div>
      <button data-maj="installer">Reprendre</button></div>`;
  return `<div class="maj"><div class="g"><b>${esc(nomVer(e))} disponible</b>
    <span>Téléchargement en attente.${branche(e)}</span></div>
    <button data-maj="telecharger">Télécharger</button></div>`;
}

const DITS = {
  repos:"Pas encore vérifié.", verification:"Vérification en cours…",
  ajour:"L'application est à jour.", disponible:"Une version plus récente attend.",
  telechargement:"Téléchargement en cours…", pret:"La version téléchargée attend l'installation.",
  autorisation:"Android attend l'autorisation d'installer des applications.",
  erreur:"La vérification a échoué.", demo:"Hors application : rien à mettre à jour."
};

function ecranMaj(e){
  const lignes = [];
  lignes.push(`<div class="kv"><span>Installée</span><b>${esc(e.nomInstalle || "—")}</b></div>`);
  if(e.publie)
    lignes.push(`<div class="kv"><span>Publiée</span><b>${esc(e.nomPublie || String(e.publie))}</b></div>`);
  if(e.sha) lignes.push(`<div class="kv"><span>Construite depuis</span><b>${esc(e.sha)}${
    e.branche && e.branche !== "main" ? " · " + esc(e.branche) : ""}</b></div>`);
  if(e.date) lignes.push(`<div class="kv"><span>Publiée le</span><b>${esc(jour(e.date))}</b></div>`);
  if(e.phase === "telechargement" || (e.phase === "pret" && e.taille))
    lignes.push(`<div class="kv"><span>Téléchargé</span><b>${ko(e.recus)}${
      e.taille ? " / " + ko(e.taille) : ""}</b></div>`);
  const boutons = [];
  if(e.phase === "pret" || e.phase === "autorisation")
    boutons.push(`<button class="pill" data-maj="installer" style="padding:12px">Installer</button>`);
  else if(e.phase === "disponible" || e.phase === "erreur")
    boutons.push(`<button class="pill" data-maj="telecharger" style="padding:12px">Télécharger</button>`);
  boutons.push(`<button class="pill" data-maj="verifier" style="padding:12px">Vérifier</button>`);
  return `<p style="margin:0 0 12px">${e.phase === "ajour" ? `<span class="chipok">à jour</span>` : ""}
      <span class="muted">${esc(DITS[e.phase] || e.phase)}${
        e.erreur ? " " + esc(e.erreur) + "." : ""}</span></p>
    <div class="card"><h4>Version</h4>${lignes.join("")}</div>
    <div class="${boutons.length > 1 ? "ff" : ""}">${boutons.join("")}</div>
    <p class="muted" style="margin-top:14px">L'application regarde la release du dépôt à chaque
      lancement et rapatrie l'APK toute seule. Le dernier geste revient à Android : une application
      installée hors magasin ne peut pas en installer une autre sans que tu voies son écran et que
      tu confirmes. La première fois, il faudra aussi autoriser Patch à installer des applications.</p>`;
}

function cablerMaj(racine){
  racine.querySelectorAll("[data-maj]").forEach(b => b.onclick = () => {
    const quoi = b.dataset.maj;
    if(quoi === "installer") NET.maj.installer();
    else if(quoi === "telecharger") NET.maj.telecharger();
    else NET.maj.verifier();
    setTimeout(peindreMaj, 250);
  });
}

function peindreMaj(){
  const e = MAJ.e;
  const zone = $("#maj-zone");
  if(zone){
    const montre = e && PHASES_BANDEAU.includes(e.phase);
    zone.innerHTML = montre ? bandeauMaj(e) : "";
    if(montre) cablerMaj(zone);
  }
  const ecran = $("#maj-ecran");
  if(ecran && e){ ecran.innerHTML = ecranMaj(e); cablerMaj(ecran); }
}

function vMaj(){
  const d = el("div");
  const ecran = el("div");
  ecran.id = "maj-ecran";
  d.append(bar("Mise à jour"), ecran);
  NET.maj.verifier();          // sans effet si une vérification tourne déjà
  setTimeout(peindreMaj);
  return d;
}

/* -------------------------------- moteur -------------------------------- */
const VIEWS = { home, proj:vProj, mach:vMach, haut:vHaut, mdg:vMdg, dmx:vPatch, tel:vPatch,
                tcd:vPatch, gel:vGel, ndi:vNdi, net:vNet, art:vArt, maj:vMaj };
let VUE_AV = null;              // l'écran du rendu précédent
function render(){
  if(STOP){ STOP(); STOP = null; }
  /* Un rendu détruit les champs : on note lequel avait le curseur pour le rendre. */
  const avant = document.activeElement;
  const marque = avant && avant.dataset ? avant.dataset.focus : null;
  let pos = null;
  try { pos = avant ? avant.selectionStart : null; } catch(e){ pos = null; }

  /* Un filtre ne fait pas remonter la page : quand on reste sur le même écran,
     on repose le défilement — celui de la page et celui du bandeau de filtres,
     que le rendu vient de recréer au début. */
  const r = S.route;
  const meme = VUE_AV === r.v;
  VUE_AV = r.v;
  const pav = document.querySelector(".pills");
  const sx = pav ? pav.scrollLeft : 0;
  const sy = window.scrollY;

  const node = r.v === "fiche" ? vFiche(r.p)
             : r.v === "edit" ? vEdit(r.k, r.i)
             : VIEWS[r.v]();
  $("#app").replaceChildren(node);

  /* Rendre le curseur avant de reposer le défilement, et sans que le champ se
     ramène lui-même à l'écran : c'est ce `focus` qui faisait sauter la page en
     haut dès qu'on touchait un filtre en ayant écrit dans la recherche. */
  if(marque){
    const n = document.querySelector('[data-focus="' + marque + '"]');
    if(n){
      n.focus({ preventScroll:true });
      try { if(pos != null) n.setSelectionRange(pos, pos); } catch(e){ }
    }
  }

  if(meme){
    const pap = $(".pills");
    if(pap && sx) pap.scrollLeft = sx;
    /* Le contenu neuf n'est pas encore mesuré : sans cette lecture, le
       navigateur rabat le défilement à zéro faute de savoir jusqu'où il va. */
    if(sy){ void document.body.offsetHeight; window.scrollTo(0, sy); }
  }
  const q = $("#q");
  if(q){
    q.addEventListener("input", e => { S.q = e.target.value; const pos = e.target.selectionStart; render();
      const n = $("#q"); if(n){ n.focus({ preventScroll:true }); n.setSelectionRange(pos, pos); } });
  }
  const t = ["proj", "mach", "haut", "mdg", "fiche", "edit"].includes(r.v) ? "parc"
          : r.v === "home" ? "home" : "tools";
  document.querySelectorAll(".tb").forEach(b => b.setAttribute("aria-current", b.dataset.t === t ? "true" : "false"));
  peindreMaj();          // le rendu a jeté le bandeau : on le repose s'il a lieu d'être
}
document.querySelectorAll(".tb").forEach(b => b.onclick = () => {
  S.q = "";
  go({ v:b.dataset.t === "home" ? "home" : b.dataset.t === "parc" ? "proj" : "dmx" });
});
/* Un seul suivi pour toute l'application : le bandeau et l'écran s'y branchent
   quand ils existent. Il ne passe pas par poser(), qui est remis à zéro à
   chaque changement d'écran. */
NET.maj.suivre(e => { MAJ.e = e; peindreMaj(); });
render();
</script>
