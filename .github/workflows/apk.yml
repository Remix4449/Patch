name: APK Patch

# Compile l'application Android et publie l'APK dans une release fixe,
# pour pouvoir la télécharger directement depuis un téléphone.

on:
  push:
    paths:
      - 'patch-app/**'
      - '.github/workflows/apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Composants Android
        run: |
          set -e
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          echo "SDK : $SDK"
          export PATH="$SDK/cmdline-tools/latest/bin:$SDK/tools/bin:$PATH"
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0" > /dev/null || true

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Construire l'APK
        working-directory: patch-app
        run: gradle --no-daemon assembleDebug

      - name: Renommer
        run: |
          mkdir -p sortie
          cp patch-app/app/build/outputs/apk/debug/app-debug.apk sortie/patch-regie.apk
          ls -la sortie

      - name: Déposer comme artefact
        uses: actions/upload-artifact@v4
        with:
          name: patch-regie-apk
          path: sortie/patch-regie.apk
          retention-days: 90

      - name: Publier la release téléchargeable
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          NOTE="Application Patch — inventaire régie.
          Télécharger patch-regie.apk depuis ce téléphone, puis l'ouvrir.
          Android demandera d'autoriser l'installation depuis cette source.
          Construit depuis ${GITHUB_SHA::7}."
          if gh release view apk --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release edit apk --repo "$GITHUB_REPOSITORY" --notes "$NOTE"
          else
            gh release create apk --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" --title "Patch — dernière version" --notes "$NOTE"
          fi
          gh release upload apk sortie/patch-regie.apk --repo "$GITHUB_REPOSITORY" --clobber
