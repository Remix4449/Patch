<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Canevas E — Registre</title>
<link rel="stylesheet" href="socle.css">
<link rel="stylesheet" href="mix.css">
<style>
/* ---------------------------------------------------------------------------
   Canevas E — « Registre »

   Assemblage : un registre par objet. Les appareils d'un côté, les gradateurs
   de l'autre, les deux dans le même visuel de liste ; le tableau d'ajout de
   lignes ouvre le registre des appareils, les réglages de plage ouvrent celui
   des gradateurs. Le relevé plein écran n'est pas un écran de plus : c'est le
   bouton du bas, qui emmène au plateau et ramène la liste remplie.

   Thèse : on range d'abord, on relève ensuite — et on sait toujours dans
   quelle des deux listes on se trouve.
--------------------------------------------------------------------------- */

.page{max-width:820px;margin:0 auto;padding:0 14px calc(96px + env(safe-area-inset-bottom,0px))}
.haut{position:sticky;top:0;z-index:20;background:var(--bg);margin:0 -14px;padding:10px 14px 2px}
.ent{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin:4px 0 12px}
.ent h1{font:800 23px/1.1 var(--disp);letter-spacing:-.025em;margin:0}
.ent .st{display:flex;gap:15px;margin-left:auto}
.ent .st div b{display:block;font:600 16px/1 var(--mono)}
.ent .st div span{font:600 9.5px/1 var(--body);letter-spacing:.12em;text-transform:uppercase;color:var(--ink3)}

.seg{display:flex;background:var(--sur2);border-radius:12px;padding:3px;gap:3px;margin-bottom:14px}
.seg button{flex:1;border:0;background:none;border-radius:10px;padding:10px 8px;
            font:700 13.5px/1.25 var(--body);color:var(--ink2)}
.seg button[aria-pressed="true"]{background:var(--bg);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.14)}
.seg button i{display:block;font-style:normal;font:500 10.5px/1.4 var(--mono);color:var(--ink3)}
.seg button[aria-pressed="true"] i{color:var(--dmx)}

.reglages{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
.reglages .f{display:flex;flex-direction:column;gap:5px;min-width:0}
.reglages label{font:700 9.5px/1 var(--body);letter-spacing:.12em;text-transform:uppercase;color:var(--ink3)}
.reglages input,.reglages select{background:var(--sur);border:1.5px solid var(--line);border-radius:10px;
     padding:9px 8px;outline:none;width:100%;font:500 14px/1.2 var(--mono);text-align:center}
.reglages select{font-family:var(--body);text-align:left}
@media (max-width:560px){ .reglages{grid-template-columns:1fr 1fr} }

.plateau{position:fixed;left:0;right:0;bottom:0;z-index:30;padding:10px 14px
         calc(10px + env(safe-area-inset-bottom,0px));
         background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(10px);
         border-top:1.5px solid var(--line)}
.plateau .in{max-width:820px;margin:0 auto;display:flex;gap:9px}
.plateau button{flex:1;border:0;border-radius:14px;padding:15px;font:700 15px/1.2 var(--body);
                background:var(--tel);color:#fff}
.plateau button.sec{background:var(--sur);color:var(--ink2);border:1.5px solid var(--line)}
.plateau button b{display:block;font:600 11px/1.6 var(--mono);opacity:.85}
</style>
</head>
<body>
<div class="page">
  <div class="haut" id="haut"></div>
  <div id="corps"></div>
</div>
<div class="plateau"><div class="in" id="plateau"></div></div>

<script src="socle.js"></script>
<script src="mix.js"></script>
<script>
bandeau("e");

const E = etatDemo();
let onglet = "app";          // app | grada

function maj(){ rendre(); }

function rendre(){
  /* En-tête : la télécommande en barre, le titre, les deux registres. */
  const h = el("div");
  h.append(barreTele(E, maj));
  const liste = adresser(E.lignes);
  const ent = el("div", "ent");
  ent.innerHTML = `<h1>${esc(E.nom)}</h1>
    <div class="st">
      <div><b>${liste.length}</b><span>appareils</span></div>
      <div><b>${E.reg.nb}</b><span>gradateurs</span></div>
      <div><b>${parCircuit(E).length}</b><span>circuits</span></div>
    </div>`;
  h.append(ent);

  const seg = el("div", "seg");
  const ba = el("button", null, `Appareils<i>${appsRestants(E)} sans circuit</i>`);
  const bg = el("button", null, `Gradateurs<i>${gradasRestants(E)} à relever</i>`);
  ba.setAttribute("aria-pressed", onglet === "app");
  bg.setAttribute("aria-pressed", onglet === "grada");
  ba.onclick = () => { onglet = "app"; rendre(); };
  bg.onclick = () => { onglet = "grada"; rendre(); };
  seg.append(ba, bg);
  h.append(seg);
  $("#haut").replaceChildren(h);

  $("#corps").replaceChildren(onglet === "app" ? vueAppareils() : vueGradateurs());
  $("#plateau").replaceChildren(...boutonsPlateau());
}

/* ---------------------------- registre appareils ------------------------- */
function vueAppareils(){
  const d = el("div");
  d.append(editeurLignes(E, maj));
  const liste = adresser(E.lignes);
  const rangs = liste.map(x => {
    const c = circuitApp(E, x.n);
    return rangee({
      badge:"P", appareil:true,
      titre:`${courtNom(x.app)} · n° ${x.n}`,
      sous:`${x.mode} · ${x.ch} canaux`,
      dmxHaut:`U${x.u}`, dmx:String(x.adr),
      action:c || "circ ?", actionEtat:c ? "" : "vide",
      onAction:() => relevePatch(x.n)
    });
  });
  d.append(pile("Appareils patchés", liste.length + " · " + puissance(liste), rangs,
                "Aucune ligne : ajouter une ligne d'appareils ci-dessus."));
  return d;
}

/* --------------------------- registre gradateurs ------------------------- */
function vueGradateurs(){
  const d = el("div");
  const r = el("div", "reglages");
  r.innerHTML = `<div class="f"><label>Protocole</label>
      <select id="r-proto"><option${E.reg.proto === "sACN" ? " selected" : ""}>sACN</option>
        <option${E.reg.proto === "Art-Net" ? " selected" : ""}>Art-Net</option></select></div>
    <div class="f"><label>Univers</label><input id="r-u" inputmode="numeric" value="${E.reg.u}"></div>
    <div class="f"><label>1re adresse</label><input id="r-a" inputmode="numeric" value="${E.reg.adr}"></div>
    <div class="f"><label>Nombre</label><input id="r-n" inputmode="numeric" value="${E.reg.nb}"></div>`;
  $("#r-proto", r).onchange = e => { E.reg.proto = e.target.value; poserFlux(E); maj(); };
  $("#r-u", r).onchange = e => { E.reg.u = +e.target.value.replace(/\D/g, "") || 1; maj(); };
  $("#r-a", r).onchange = e => { E.reg.adr = Math.min(512, +e.target.value.replace(/\D/g, "") || 1); maj(); };
  $("#r-n", r).onchange = e => { E.reg.nb = Math.max(1, Math.min(512, +e.target.value.replace(/\D/g, "") || 1)); maj(); };
  d.append(r);

  const rangs = listeGradas(E).map(n => {
    const a = adrGrada(n, E.reg);
    const c = circuitGrada(E, n);
    const lv = E.niv[n] || 0;
    return rangee({
      badge:"G",
      titre:`Gradateur ${n}`,
      sous:c ? `circuit ${c}${gradaFiche(E, n).note ? " · " + gradaFiche(E, n).note : ""}` : "circuit à relever",
      dmxHaut:`U${a.u}`, dmx:String(a.canal),
      action:lv > 0 ? lv + " %" : (c || "circ ?"),
      actionEtat:lv > 0 ? "on" : c ? "" : "vide",
      allume:lv > 0,
      onAction:() => { if(c && lv === 0){ allumerSeuls(E, [n]); maj(); } else if(lv > 0){ E.niv[n] = 0; poserFlux(E); maj(); } else releveGrada(n); }
    });
  });
  d.append(pile("Gradateurs", `${E.reg.nb} · ${E.reg.proto} · U${E.reg.u}`, rangs));
  return d;
}

/* ------------------------------ vers le plateau -------------------------- */
function boutonsPlateau(){
  const gr = el("button", null, onglet === "grada"
    ? `Relever les gradateurs<b>${gradasRestants(E)} restants</b>`
    : `Relever les circuits<b>${appsRestants(E)} appareils sans circuit</b>`);
  gr.onclick = () => onglet === "grada" ? releveGrada() : relevePatch();
  const z = el("button", "sec", "Tout à zéro");
  z.onclick = () => { toutEteindre(E); maj(); };
  return [gr, z];
}

function releveGrada(n){
  const depart = n != null ? listeGradas(E).indexOf(n) : undefined;
  relever({
    titre:"Relevé des gradateurs", question:"Gradateur allumé — que voit-on sur scène ?",
    couleur:"#3FC7DC", marque:"n° de circuit", depart,
    items:() => itemsGradas(E),
    ajouter:{ texte:"+ un gradateur", faire:() => { E.reg.nb++; return E.reg.nb - 1; } },
    onChange:() => {}, onFin:() => { toutEteindre(E); maj(); }
  });
}
function relevePatch(n){
  const liste = adresser(E.lignes);
  const depart = n != null ? liste.findIndex(x => x.n === n) : undefined;
  relever({
    titre:"Circuits des appareils", question:"Sur quel circuit est branché cet appareil ?",
    couleur:"#FFA34D", marque:"n° de circuit", depart,
    items:() => itemsApps(E),
    onChange:() => {}, onFin:maj
  });
}

/* Ancre d'ouverture : #tel entre directement dans le relevé des gradateurs. */
if(location.hash === "#tel") onglet = "grada";
rendre();
if(location.hash === "#tel") releveGrada();
</script>
</body>
</html>
