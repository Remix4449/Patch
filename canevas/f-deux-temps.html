<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Canevas F — Deux temps</title>
<link rel="stylesheet" href="socle.css">
<link rel="stylesheet" href="mix.css">
<style>
/* ---------------------------------------------------------------------------
   Canevas F — « Deux temps »

   Assemblage : l'application ne se divise pas par objet mais par moment.
   Assis, au calme, on prépare — le tableau d'ajout de lignes et les deux
   listes, denses, à lire d'un coup. Debout, sur le plateau, on relève — le
   plein écran prend toute la place et enchaîne, sans coupure, les gradateurs
   puis les appareils : une seule file d'attente, une seule barre d'avancement.

   Thèse : ce n'est pas l'outil qui change, c'est la posture. D'où un seul
   bouton pour passer de l'un à l'autre, et le retour qui repose la liste là
   où on l'avait laissée, remplie.
--------------------------------------------------------------------------- */

.page{max-width:820px;margin:0 auto;padding:0 14px calc(104px + env(safe-area-inset-bottom,0px))}
.ent{margin:16px 0 14px}
.ent .kick{font:600 10.5px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--ink3)}
.ent h1{font:800 26px/1.1 var(--disp);letter-spacing:-.03em;margin:7px 0 0}
.ent p{margin:6px 0 0;color:var(--ink2);font-size:14px;max-width:56ch}

.bilan{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-bottom:16px}
.bilan div{background:var(--sur);border:1.5px solid var(--line);border-radius:13px;padding:11px 12px}
.bilan b{display:block;font:600 21px/1 var(--mono);font-variant-numeric:tabular-nums}
.bilan span{font:600 9.5px/1.3 var(--body);letter-spacing:.1em;text-transform:uppercase;color:var(--ink3)}
.bilan div.reste b{color:var(--dmx)}
@media (max-width:560px){ .bilan{grid-template-columns:1fr 1fr} }

h2.sec{font:700 10.5px/1 var(--body);letter-spacing:.16em;text-transform:uppercase;color:var(--ink3);
       margin:22px 0 10px;display:flex;align-items:center;gap:10px}
h2.sec i{flex:1;height:1px;background:var(--line);font-style:normal}
h2.sec em{font:500 11px/1 var(--mono);font-style:normal;color:var(--ink3);text-transform:none;letter-spacing:0}

.plage{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end;margin-bottom:10px}
.plage .f{display:flex;flex-direction:column;gap:5px;min-width:92px;flex:1}
.plage label{font:700 9.5px/1 var(--body);letter-spacing:.12em;text-transform:uppercase;color:var(--ink3)}
.plage input,.plage select{background:var(--sur);border:1.5px solid var(--line);border-radius:10px;
     padding:9px 8px;outline:none;width:100%;font:500 14px/1.2 var(--mono);text-align:center}
.plage select{font-family:var(--body);text-align:left}

/* Le passage au plateau : un seul bouton, qui dit ce qui reste à faire. */
.bascule{position:fixed;left:0;right:0;bottom:0;z-index:30;
         padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px));
         background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(10px);
         border-top:1.5px solid var(--line)}
.bascule .in{max-width:820px;margin:0 auto;display:flex;gap:9px;align-items:stretch}
.bascule .go{flex:1;border:0;border-radius:15px;padding:16px;background:var(--tel);color:#fff;
             font:800 17px/1.1 var(--disp);letter-spacing:-.01em;text-align:left}
.bascule .go b{display:block;font:600 11.5px/1.7 var(--mono);opacity:.9;letter-spacing:0}
.bascule .sec{border:1.5px solid var(--line);background:var(--sur);border-radius:15px;padding:0 15px;
              font:600 12.5px/1.3 var(--body);color:var(--ink2);min-width:92px}
</style>
</head>
<body>
<div class="page">
  <div class="ent">
    <div class="kick" id="kick"></div>
    <h1>Préparer</h1>
    <p>Le plan de feu et la plage de gradateurs se posent ici, au calme. Le relevé,
    lui, se fait debout : un seul bouton y emmène, et la file enchaîne les gradateurs
    puis les appareils.</p>
  </div>
  <div class="bilan" id="bilan"></div>
  <div id="corps"></div>
</div>
<div class="bascule"><div class="in" id="bascule"></div></div>

<script src="socle.js"></script>
<script src="mix.js"></script>
<script>
bandeau("f");

const E = etatDemo();
function maj(){ rendre(); }

function rendre(){
  const liste = adresser(E.lignes);
  const restes = gradasRestants(E) + appsRestants(E);
  $("#kick").textContent = `${E.reg.proto} · univers ${E.reg.u} · ${E.reg.nb} gradateurs`;
  $("#bilan").innerHTML = `
    <div><b>${liste.length}</b><span>appareils</span></div>
    <div><b>${E.reg.nb}</b><span>gradateurs</span></div>
    <div><b>${parCircuit(E).length}</b><span>circuits</span></div>
    <div class="${restes ? "reste" : ""}"><b>${restes}</b><span>à relever</span></div>`;

  const d = el("div");

  d.insertAdjacentHTML("beforeend", `<h2 class="sec">Plan de feu<i></i>
    <em>${liste.length} appareils · ${puissance(liste)}</em></h2>`);
  d.append(editeurLignes(E, maj));
  d.append(pile("Appareils", `${appsRestants(E)} sans circuit`, liste.map(x => {
    const c = circuitApp(E, x.n);
    return rangee({ badge:"P", appareil:true,
      titre:`${courtNom(x.app)} · n° ${x.n}`,
      sous:`${x.mode} · ${x.ch} canaux`,
      dmxHaut:`U${x.u}`, dmx:String(x.adr),
      action:c || "circ ?", actionEtat:c ? "" : "vide",
      onAction:() => plateau(itemsGradas(E).length + liste.findIndex(y => y.n === x.n)) });
  }), "Aucune ligne pour l'instant."));

  d.insertAdjacentHTML("beforeend", `<h2 class="sec">Plage de gradateurs<i></i>
    <em>${gradasRestants(E)} à relever</em></h2>`);
  const p = el("div", "plage");
  p.innerHTML = `<div class="f"><label>Protocole</label>
      <select id="p-proto"><option${E.reg.proto === "sACN" ? " selected" : ""}>sACN</option>
        <option${E.reg.proto === "Art-Net" ? " selected" : ""}>Art-Net</option></select></div>
    <div class="f"><label>Univers</label><input id="p-u" inputmode="numeric" value="${E.reg.u}"></div>
    <div class="f"><label>1re adresse</label><input id="p-a" inputmode="numeric" value="${E.reg.adr}"></div>
    <div class="f"><label>1er n°</label><input id="p-p" inputmode="numeric" value="${E.reg.premier}"></div>
    <div class="f"><label>Nombre</label><input id="p-n" inputmode="numeric" value="${E.reg.nb}"></div>`;
  const nb = (v, min, max, d0) => { const x = parseInt(String(v).replace(/\D/g, ""), 10);
    return isNaN(x) ? d0 : Math.max(min, Math.min(max, x)); };
  $("#p-proto", p).onchange = e => { E.reg.proto = e.target.value; maj(); };
  $("#p-u", p).onchange = e => { E.reg.u = nb(e.target.value, 1, 63999, 1); maj(); };
  $("#p-a", p).onchange = e => { E.reg.adr = nb(e.target.value, 1, 512, 1); maj(); };
  $("#p-p", p).onchange = e => { E.reg.premier = nb(e.target.value, 1, 9999, 1); maj(); };
  $("#p-n", p).onchange = e => { E.reg.nb = nb(e.target.value, 1, 512, 48); maj(); };
  d.append(p);

  d.append(pile("Gradateurs", `${E.reg.proto} · U${E.reg.u}`, listeGradas(E).map(n => {
    const a = adrGrada(n, E.reg), c = circuitGrada(E, n);
    return rangee({ badge:"G",
      titre:`Gradateur ${n}`,
      sous:c ? `circuit ${c}${gradaFiche(E, n).note ? " · " + gradaFiche(E, n).note : ""}` : "circuit à relever",
      dmxHaut:`U${a.u}`, dmx:String(a.canal),
      action:c || "circ ?", actionEtat:c ? "" : "vide",
      onAction:() => plateau(listeGradas(E).indexOf(n)) });
  })));

  $("#corps").replaceChildren(d);

  const go = el("button", "go");
  go.innerHTML = restes
    ? `Sur le plateau<b>${gradasRestants(E)} gradateurs puis ${appsRestants(E)} appareils</b>`
    : `Sur le plateau<b>tout est relevé — vérifier au besoin</b>`;
  go.onclick = () => plateau();
  const pdf = el("button", "sec", "Exporter la feuille");
  pdf.onclick = () => alert("Maquette : l'application ouvre ici la boîte d'impression d'Android.");
  $("#bascule").replaceChildren(go, pdf);
}

/* --------------------------- le temps du plateau ------------------------- */
/* Une seule file : les gradateurs, puis les appareils. Valider saute au
   prochain élément non relevé, quel que soit son genre — on ne revient à la
   liste qu'une fois debout devant elle. */
function plateau(depart){
  relever({
    titre:"Sur le plateau", question:"Que voit-on sur scène ?",
    couleur:"#3FC7DC", marque:"n° de circuit", depart,
    items:() => [...itemsGradas(E), ...itemsApps(E)],
    ajouter:{ texte:"+ un gradateur", faire:() => { E.reg.nb++; return E.reg.nb - 1; } },
    onChange:() => {}, onFin:() => { toutEteindre(E); maj(); }
  });
}

rendre();
if(location.hash === "#tel") plateau();
</script>
</body>
</html>
