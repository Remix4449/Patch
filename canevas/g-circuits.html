<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Canevas G — Circuits</title>
<link rel="stylesheet" href="socle.css">
<link rel="stylesheet" href="mix.css">
<style>
/* ---------------------------------------------------------------------------
   Canevas G — « Circuits »

   Assemblage : la liste n'est pas rangée par objet mais par circuit. Chaque
   circuit porte ses gradateurs et ses appareils dans la même rangée de liste,
   et se teste d'une touche. Le tableau d'ajout de lignes vit dans un volet —
   on l'ouvre pour poser le plan de feu, on le referme. Le relevé plein écran
   est le seul endroit où l'on écrit un numéro de circuit : il remplit la
   feuille en direct, et les cartes se forment derrière.

   Thèse : ce qu'on cherche sur un plateau, ce n'est ni un appareil ni un
   gradateur — c'est un circuit. Alors c'est lui qui organise l'écran.
--------------------------------------------------------------------------- */

.page{max-width:820px;margin:0 auto;padding:0 14px calc(96px + env(safe-area-inset-bottom,0px))}
.haut{position:sticky;top:0;z-index:20;background:var(--bg);margin:0 -14px;padding:10px 14px 4px}
.ent{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin:2px 0 11px}
.ent h1{font:800 23px/1.1 var(--disp);letter-spacing:-.025em;margin:0}
.ent .st{display:flex;gap:15px;margin-left:auto}
.ent .st div b{display:block;font:600 16px/1 var(--mono)}
.ent .st div span{font:600 9.5px/1 var(--body);letter-spacing:.12em;text-transform:uppercase;color:var(--ink3)}

.filtres{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.filtres button{border:1.5px solid var(--line);background:var(--sur);border-radius:99px;
                padding:7px 12px;font:600 12.5px/1 var(--body);color:var(--ink2)}
.filtres button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.filtres .sp{flex:1}
.filtres button.volet{border-style:dashed}

/* --------------------------- la carte de circuit ------------------------- */
.cc{border:1.5px solid var(--line);border-radius:14px;margin-bottom:9px;overflow:hidden;
    background:var(--sur)}
.cc>.tete{display:grid;grid-template-columns:58px minmax(0,1fr) auto auto;gap:10px;align-items:center;
          padding:10px 12px;background:var(--sur2)}
.cc>.tete .no{font:600 20px/1 var(--mono);text-align:center;background:var(--sur);
              border:1.5px solid var(--line);border-radius:10px;padding:8px 0}
.cc.on>.tete .no{background:var(--tel);border-color:var(--tel);color:#fff}
.cc>.tete .rep{border:0;background:none;outline:none;font:600 14.5px/1.2 var(--body);width:100%;
               padding:4px 0;border-bottom:1px dashed transparent;min-width:0}
.cc>.tete .rep:focus{border-bottom-color:var(--ink3)}
.cc>.tete .rep::placeholder{color:var(--ink3);font-weight:500;font-style:italic}
.cc>.tete .cpt{font:500 10.5px/1.35 var(--mono);color:var(--ink3);text-align:right;white-space:nowrap}
.cc>.tete .test{border:1.5px solid var(--tel);background:var(--sur);color:var(--tel);border-radius:10px;
                padding:9px 11px;font:700 12px/1 var(--body);white-space:nowrap}
.cc.on>.tete .test{background:var(--tel);color:#fff}
.cc .manque{padding:9px 12px;border-top:1px solid var(--line);font-size:12.5px;color:var(--ink3)}

.volet{margin-bottom:12px}
.aide{font:500 12.5px/1.5 var(--body);color:var(--ink3);margin:0 2px 12px}

.bas{position:fixed;left:0;right:0;bottom:0;z-index:30;
     padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px));
     background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(10px);
     border-top:1.5px solid var(--line)}
.bas .in{max-width:820px;margin:0 auto;display:flex;gap:9px}
.bas button{flex:1;border:0;border-radius:14px;padding:14px 12px;font:700 14px/1.2 var(--body);
            background:var(--tel);color:#fff}
.bas button.dmx{background:var(--dmx)}
.bas button b{display:block;font:600 10.5px/1.7 var(--mono);opacity:.9}
</style>
</head>
<body>
<div class="page">
  <div class="haut" id="haut"></div>
  <div id="corps"></div>
</div>
<div class="bas"><div class="in" id="bas"></div></div>

<script src="socle.js"></script>
<script src="mix.js"></script>
<script>
bandeau("g");

const E = etatDemo();
let filtre = "tout";      // tout | manque | vides
let volet = false;

function maj(){ rendre(); }

function rendre(){
  const h = el("div");
  h.append(barreTele(E, maj));
  const liste = adresser(E.lignes);
  const circuits = parCircuit(E);
  const ent = el("div", "ent");
  ent.innerHTML = `<h1>${esc(E.nom)}</h1>
    <div class="st">
      <div><b>${circuits.length}</b><span>circuits</span></div>
      <div><b>${E.reg.nb - gradasRestants(E)}</b><span>gradateurs</span></div>
      <div><b>${liste.length - appsRestants(E)}</b><span>appareils</span></div>
    </div>`;
  h.append(ent);

  const f = el("div", "filtres");
  [["tout", "Toute la feuille"], ["manque", "Circuits incomplets"],
   ["vides", `À relever · ${gradasRestants(E) + appsRestants(E)}`]].forEach(([k, t]) => {
    const b = el("button", null, t);
    b.setAttribute("aria-pressed", filtre === k);
    b.onclick = () => { filtre = k; rendre(); };
    f.append(b);
  });
  f.append(el("span", "sp"));
  const bv = el("button", "volet", volet ? "Fermer le plan de feu" : "Plan de feu…");
  bv.onclick = () => { volet = !volet; rendre(); };
  f.append(bv);
  h.append(f);
  $("#haut").replaceChildren(h);

  const d = el("div");
  if(volet){
    const v = el("div", "volet");
    v.append(editeurLignes(E, maj));
    d.append(v);
    d.append(el("p", "aide",
      "Le plan de feu ne demande aucun circuit : il pose les appareils et leurs adresses. " +
      "Les circuits se relèvent sur le plateau, et viennent se ranger dans les cartes ci-dessous."));
  }

  if(filtre === "vides"){
    d.append(pile("Gradateurs sans circuit", gradasRestants(E) + " sur " + E.reg.nb,
      listeGradas(E).filter(n => !circuitGrada(E, n)).map(n => {
        const a = adrGrada(n, E.reg);
        return rangee({ badge:"G", titre:`Gradateur ${n}`,
          sous:`${E.reg.proto} · à relever`, dmxHaut:`U${a.u}`, dmx:String(a.canal),
          action:"relever", actionEtat:"vide",
          onAction:() => releveGradas(listeGradas(E).indexOf(n)) });
      }), "Tous les gradateurs portent un circuit."));
    d.append(pile("Appareils sans circuit", appsRestants(E) + " sur " + liste.length,
      liste.filter(x => !circuitApp(E, x.n)).map(x =>
        rangee({ badge:"P", appareil:true, titre:`${courtNom(x.app)} · n° ${x.n}`,
          sous:`${x.mode} · ${x.ch} canaux`, dmxHaut:`U${x.u}`, dmx:String(x.adr),
          action:"affecter", actionEtat:"vide",
          onAction:() => releveApps(liste.findIndex(y => y.n === x.n)) })),
      "Tous les appareils sont affectés."));
  } else {
    const vus = circuits.filter(c => filtre === "manque" ? (!c.gradas.length || !c.apps.length) : true);
    if(!vus.length) d.append(el("p", "aide", "Aucun circuit dans ce filtre."));
    vus.forEach(c => d.append(carte(c)));
  }
  $("#corps").replaceChildren(d);

  const bg = el("button", null, `Relever les gradateurs<b>${gradasRestants(E)} restants</b>`);
  bg.onclick = () => releveGradas();
  const ba = el("button", "dmx", `Affecter les appareils<b>${appsRestants(E)} restants</b>`);
  ba.onclick = () => releveApps();
  $("#bas").replaceChildren(bg, ba);
}

/* Une carte par circuit : ses gradateurs, ses appareils, et de quoi l'allumer. */
function carte(c){
  const allume = c.gradas.some(n => (E.niv[n] || 0) > 0);
  const d = el("div", "cc" + (allume ? " on" : ""));
  const t = el("div", "tete");
  t.innerHTML = `<span class="no">${esc(c.circuit)}</span>
    <input class="rep" placeholder="repère…" value="${esc(E.reperes[c.circuit] || "")}"
           aria-label="Repère du circuit ${esc(c.circuit)}">
    <span class="cpt">${c.gradas.length} gradateur${c.gradas.length > 1 ? "s" : ""}<br>${
      c.apps.length} appareil${c.apps.length > 1 ? "s" : ""}</span>
    <button class="test">${allume ? "Éteindre" : "Tester ▶"}</button>`;
  t.querySelector(".rep").oninput = e => { E.reperes[c.circuit] = e.target.value; };
  t.querySelector(".test").onclick = () => {
    if(!c.gradas.length){ alert("Ce circuit n'a pas encore de gradateur : rien à allumer."); return; }
    if(allume){ c.gradas.forEach(n => E.niv[n] = 0); poserFlux(E); }
    else allumerSeuls(E, c.gradas);
    maj();
  };
  d.append(t);

  c.gradas.forEach(n => {
    const a = adrGrada(n, E.reg), lv = E.niv[n] || 0;
    d.append(rangee({ badge:"G", titre:`Gradateur ${n}`,
      sous:gradaFiche(E, n).note || "—", dmxHaut:`${E.reg.proto} · U${a.u}`, dmx:String(a.canal),
      action:lv > 0 ? lv + " %" : "allumer", actionEtat:lv > 0 ? "on" : "", allume:lv > 0,
      onAction:() => { if(lv > 0){ E.niv[n] = 0; poserFlux(E); } else allumerSeuls(E, [n]); maj(); } }));
  });
  c.apps.forEach(x => {
    d.append(rangee({ badge:"P", appareil:true, titre:courtNom(x.app),
      sous:`${x.mode} · ${x.ch} canaux`, dmxHaut:`appareil ${x.n} · U${x.u}`, dmx:String(x.adr),
      action:"détacher",
      onAction:() => { delete E.affect[x.n]; maj(); } }));
  });
  if(!c.gradas.length) d.append(el("p", "manque", "Aucun gradateur sur ce circuit : rien à tester."));
  if(!c.apps.length) d.append(el("p", "manque", "Aucun appareil branché sur ce circuit."));
  return d;
}

/* ------------------------------ les relevés ------------------------------ */
function releveGradas(depart){
  relever({
    titre:"Relevé des gradateurs", question:"Gradateur allumé — que voit-on sur scène ?",
    couleur:"#3FC7DC", marque:"n° de circuit", depart,
    items:() => itemsGradas(E),
    ajouter:{ texte:"+ un gradateur", faire:() => { E.reg.nb++; return E.reg.nb - 1; } },
    onChange:() => {}, onFin:() => { toutEteindre(E); maj(); }
  });
}
function releveApps(depart){
  relever({
    titre:"Affectation des appareils", question:"Sur quel circuit est branché cet appareil ?",
    couleur:"#FFA34D", marque:"n° de circuit", depart,
    items:() => itemsApps(E),
    onChange:() => {}, onFin:maj
  });
}

rendre();
if(location.hash === "#tel") releveGradas();
</script>
</body>
</html>
